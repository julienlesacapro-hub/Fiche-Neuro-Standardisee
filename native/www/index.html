<style>
:root{
  --bd:#c9ced6; --bd2:#e3e7ec; --bg:#f4f6f9; --card:#fff;
  --ink:#14181f; --ink2:#5a6472; --acc:#1b4f8f; --acc-l:#e8f0fa;
  --ok:#1f7a4d; --ok-l:#e6f4ec; --warn:#b4531a; --warn-l:#fbeee4;
  --bad:#a32020; --bad-l:#fbeaea; --sel:#1b4f8f;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:13px/1.45 "Segoe UI",Roboto,system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font-family:inherit;font-size:13px;color:inherit}

/* ---------- barre d'outils ---------- */
#topbar{position:sticky;top:0;z-index:50;background:#101725;color:#fff;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
  display:flex;align-items:center;gap:8px;padding:7px 12px;flex-wrap:wrap;
  box-shadow:0 1px 6px rgba(0,0,0,.25)}
#topbar .ttl{font-weight:700;letter-spacing:.02em;margin-right:6px;font-size:13px}
#topbar .sep{width:1px;height:22px;background:#3a4558;margin:0 3px}
.tb{background:#22304a;color:#fff;border:1px solid #394a68;border-radius:5px;
  padding:5px 10px;cursor:pointer;white-space:nowrap}
.tb:hover{background:#2e4066}
.tb.pri{background:#1b6fd0;border-color:#3b8ae8}
.tb.pri:hover{background:#2a80e4}
.tb.gd{background:#1a6b43;border-color:#2a8a59}
.tb.gd:hover{background:#228152}
.tb.dg{background:#8f2020;border-color:#b03030}
.onlyphone{display:none}
#tbmore{display:contents}
#dbstate{margin-left:auto;font-size:11.5px;color:#9fb0c8;display:flex;align-items:center;gap:8px}
#dbstate b{color:#eaf1fb}
.dot{width:8px;height:8px;border-radius:50%;background:#c0392b;display:inline-block}
.dot.on{background:#27ae60}

/* ---------- structure ---------- */
#wrap{display:flex;gap:0;align-items:flex-start;min-width:0;max-width:100%}
#side{width:250px;flex:0 0 250px;background:#fff;border-right:1px solid var(--bd);
  height:calc(100vh - 40px);position:sticky;top:40px;overflow:auto;padding:10px}
#side.hide{display:none}
#main{flex:1;min-width:0;max-width:100%;padding:12px 16px 120px;overflow:hidden}
#form,.sec,.sec>.body,.grid2,.bodywrap,.dbar,#sensTabs{min-width:0;max-width:100%}
.dwrap{max-width:100%}
#side h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
#search{width:100%;padding:6px 8px;border:1px solid var(--bd);border-radius:5px;margin-bottom:8px}
.fitem{border:1px solid var(--bd2);border-left:3px solid var(--acc);border-radius:5px;
  padding:6px 8px;margin-bottom:6px;cursor:pointer;background:#fbfcfe}
.fitem:hover{background:var(--acc-l)}
.fitem.cur{background:var(--acc-l);border-left-color:#0a2f5c}
.fitem .d{font-weight:700}
.fitem .m{font-size:11px;color:var(--ink2)}

/* ---------- sections ---------- */
.sec{background:var(--card);border:1px solid var(--bd);border-radius:7px;margin-bottom:10px;overflow:hidden}
.sec>h3{margin:0;padding:7px 11px;background:#eef2f7;border-bottom:1px solid var(--bd);
  font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:#243247;
  display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.sec>h3 .caret{font-size:10px;color:var(--ink2);transition:transform .15s}
.sec.closed>h3 .caret{transform:rotate(-90deg)}
.sec.closed .body{display:none}
.sec>h3 .fill{margin-left:auto;display:flex;gap:6px;align-items:center}
.sec .body{padding:9px 11px}
.mini{background:#fff;border:1px solid var(--bd);border-radius:4px;padding:2px 8px;
  font-size:11px;cursor:pointer;color:var(--ok);font-weight:600}
.mini:hover{background:var(--ok-l)}
.badge{font-size:10.5px;padding:1px 7px;border-radius:9px;background:#dde4ec;color:#41506a;font-weight:700}
.badge.ok{background:var(--ok-l);color:var(--ok)}
.badge.ab{background:var(--bad-l);color:var(--bad)}

/* ---------- lignes de champs ---------- */
.row{display:flex;align-items:center;gap:8px;padding:3px 0;flex-wrap:wrap;min-width:0;max-width:100%;
  border-bottom:1px dotted #e8ecf1}
.row:last-child{border-bottom:0}
.row>.lbl{flex:0 0 262px;font-weight:600;color:#1e2833}
.row>.lbl small{display:block;font-weight:400;color:var(--ink2);font-size:11px}
.row.sub{padding-left:24px;background:#fafbfd}
.row.sub>.lbl{flex-basis:238px;font-weight:400;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
.hidden{display:none !important}

/* ---------- boutons de choix ---------- */
.opts{display:inline-flex;flex-wrap:wrap;gap:4px}
.opt{border:1px solid var(--bd);background:#fff;border-radius:5px;padding:3px 11px;
  cursor:pointer;user-select:none;min-width:34px;text-align:center;line-height:1.3}
.opt:hover{border-color:var(--acc);background:var(--acc-l)}
.opt.on{background:var(--sel);border-color:var(--sel);color:#fff;font-weight:600}
.opt.on.v-ok{background:var(--ok);border-color:var(--ok)}
.opt.on.v-ab{background:var(--bad);border-color:var(--bad)}
.opt.on.v-wn{background:var(--warn);border-color:var(--warn)}
.opt.sm{padding:2px 8px;font-size:12px;min-width:26px}
.clr{border:0;background:none;color:#95a0ae;cursor:pointer;font-size:15px;line-height:1;padding:0 4px}
.clr:hover{color:var(--bad)}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{
  border:1px solid var(--bd);border-radius:5px;padding:4px 7px;background:#fff}
input[type=text]:focus,textarea:focus,select:focus{outline:2px solid var(--acc-l);border-color:var(--acc)}
.calc{background:#f0f3f7;border:1px dashed var(--bd);border-radius:5px;padding:3px 9px;
  font-weight:700;color:var(--acc)}
.req{border-color:var(--bad) !important;background:var(--bad-l) !important}
.chips{display:inline-flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);border-radius:12px;padding:2px 10px;cursor:pointer;background:#fff;font-size:12px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
textarea{width:100%;min-height:52px;resize:vertical}
.phr{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.phr button{font-size:11px;padding:2px 8px;border:1px dashed var(--bd);background:#fbfcfe;
  border-radius:10px;cursor:pointer;color:var(--ink2)}
.phr button:hover{border-style:solid;border-color:var(--acc);color:var(--acc);background:var(--acc-l)}

/* ---------- force MRC ---------- */
.mrc .opt{min-width:28px;padding:3px 7px;font-weight:600}
.mrc .opt.on{color:#fff}
.mrc-0.on,.mrc-1.on{background:var(--bad);border-color:var(--bad)}
.mrc-2.on,.mrc-3.on{background:var(--warn);border-color:var(--warn)}
.mrc-4.on{background:#b8961f;border-color:#b8961f}
.mrc-5.on{background:var(--ok);border-color:var(--ok)}

/* ---------- schémas corporels ---------- */
#patholder{position:absolute;width:0;height:0;overflow:hidden}
#sensTabs{display:flex;gap:5px;margin:10px 0 8px;flex-wrap:wrap;align-items:stretch}
.stab{border:1px solid var(--bd);background:#fff;border-radius:6px;padding:5px 13px;cursor:pointer;
  text-align:left;line-height:1.25}
.stab small{display:block;font-size:10.5px;color:var(--ink2);font-weight:400}
.stab.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.stab.on small{color:#cfe0f5}
.brush{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:9px;
  background:#f7f9fc;border:1px solid var(--bd2);border-radius:6px;padding:6px 8px}
.brush .bl{font-size:11.5px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;margin-right:2px}
.bb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);background:#fff;
  border-radius:16px;padding:3px 11px;cursor:pointer;font-size:12px}
.bb:hover{border-color:var(--acc)}
.bb.on{border-color:#101725;box-shadow:0 0 0 2px #101725 inset;font-weight:700}
.bb svg.sw{display:block;flex:0 0 auto}
.bodywrap,.landwrap{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.bodyfig{text-align:center}
.bodyfig .cap{font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.sumcol{flex:1;min-width:210px;font-size:12px}
svg.body{background:#fff;border:1px solid var(--bd2);border-radius:6px}
svg.body .z{fill:#fff;stroke:#2b3440;stroke-width:1.1;cursor:pointer}
svg.body .z:hover{stroke:#1b4f8f;stroke-width:2.6}
svg.body .deco{fill:none;stroke:#2b3440;stroke-width:1;pointer-events:none}
svg.body .sid{font:700 11px sans-serif;fill:#5a6472;pointer-events:none}
#zoneList,#zoneList2{font-size:11.5px;color:var(--ink2);margin-top:6px;min-height:18px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:11.5px;color:var(--ink2);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend svg.sw{display:block;flex:0 0 auto}

/* ---------- table des reliefs osseux (pallesthésie) ---------- */
.landtab{border-collapse:collapse;font-size:12.5px}
.landtab th{background:#eef2f7;border:1px solid var(--bd);padding:4px 10px;font-size:11px;
  text-transform:uppercase;letter-spacing:.04em;color:#41506a}
.landtab td{border:1px solid var(--bd2);padding:3px 6px}
.landtab td:first-child{font-weight:600;white-space:nowrap}
.landtab td:first-child small{font-weight:400;color:var(--ink2)}
.lgrp{display:inline-flex;gap:3px;flex-wrap:wrap}
.lb{border:1px solid var(--bd);background:#fff;border-radius:5px;padding:3px 9px;
  cursor:pointer;font-size:11.5px;color:#5a6472;white-space:nowrap}
.lb:hover{border-color:var(--acc);background:var(--acc-l);color:var(--acc)}
.lb.on{color:#fff;font-weight:700;border-color:transparent}
.lb.s1.on{background:#2f6fb5}
.lb.s2.on{background:#b07b18}
.lb.s3.on{background:#8c2020}
.lb.n.on{background:var(--ok)}
.cpb{margin-left:8px}
.cprow{display:block;padding:5px 7px;border:1px solid var(--bd2);border-radius:5px;margin-bottom:4px;cursor:pointer}
.cprow:hover{background:var(--acc-l);border-color:var(--acc)}

/* ---------- tables métamériques et reliefs ---------- */
.dbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0 8px}
.dbar .dsc{margin-left:auto;font-size:12.5px;color:var(--ink2)}
.dbar .dsc b{color:var(--acc);font-size:14px}
.dwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.dtab,.landtab{border-collapse:separate;border-spacing:0;font-size:12.5px;width:100%}
.dtab th,.landtab th{position:sticky;top:0;z-index:2;background:#eef2f7;border-bottom:1px solid var(--bd);
  padding:5px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#41506a;text-align:left}
.dtab td,.landtab td{border-bottom:1px solid var(--bd2);padding:3px 5px;vertical-align:middle}
.dtab tr:nth-child(even) td,.landtab tr:nth-child(even) td{background:#fafbfd}
.dtab tr.key td{background:#fff6e6}
td.lv{white-space:nowrap;min-width:92px}
td.lv b{font-size:13px}
td.lv small{display:block;font-weight:400;color:var(--ink2);font-size:10.5px;max-width:190px;white-space:normal;line-height:1.2}
.dgrp{display:inline-flex;gap:3px}
.db{border:1px solid var(--bd);background:#fff;border-radius:5px;min-width:30px;padding:5px 6px;
  cursor:pointer;font-size:12px;font-weight:600;color:#5a6472}
.db:hover{border-color:var(--acc);background:var(--acc-l)}
.db.on{color:#fff;border-color:transparent}
.db.d2.on{background:#1f7a4d}
.db.d1.on{background:#b8961f}
.db.d0.on{background:#8c2020}
.db.d9.on{background:#5a6472}
.dprop{border:1px solid var(--bd);background:#fff;border-radius:5px;padding:4px 7px;cursor:pointer;color:var(--ink2)}
.dprop:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-l)}

/* ---------- panneau ASIA ---------- */
.asiagrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
@media(max-width:820px){.asiagrid{grid-template-columns:repeat(2,1fr)}}
.atile{border:1px solid var(--bd2);border-radius:7px;padding:8px 10px;background:#fbfcfe}
.atile .at{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
.atile .av{font-size:19px;font-weight:700;color:var(--acc);line-height:1.2;margin:2px 0}
.atile .as{font-size:11px;color:var(--ink2)}
.aisbox{border:2px dashed var(--bd);border-radius:8px;padding:10px 14px;margin-top:8px;background:#fbfcfe}
.aisbox.on{border-style:solid;border-color:var(--bad);background:var(--bad-l)}
.aisbox .aisg{font-size:22px;font-weight:800;letter-spacing:.02em}
.aisbox.on .aisg{color:var(--bad)}
.aisbox .aist{font-size:12.5px;color:var(--ink2);margin-top:2px}

/* ---------- valeurs de l'examen précédent ---------- */
.opt.gh,.chip.gh{color:#8b95a3;border-style:dashed;background:#fbfcfe}
.opt.gh:hover,.chip.gh:hover{color:var(--acc);border-style:solid}
.ghb{margin-left:6px;border:1px dashed var(--bd);background:#fbfcfe;color:#8b95a3;
  border-radius:12px;padding:2px 9px;cursor:pointer;font-size:11px;max-width:260px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.ghb:hover{border-style:solid;border-color:var(--acc);color:var(--acc);background:var(--acc-l)}
.prevnote{background:#eef4fb;border-color:#bcd4ee}
.chip.sm{font-size:11px;padding:1px 8px}

/* ---------- échelle de douleur ---------- */
.eva .opt{min-width:26px;padding:3px 7px;font-weight:600}
.eva-0.on{background:var(--ok);border-color:var(--ok)}

<script>
"use strict";
/* =====================================================================
   FICHE D'EXAMEN NEUROLOGIQUE STANDARDISÉ — générateur hors ligne
   Fichier unique, aucune dépendance externe, fonctionne sans réseau.
   ===================================================================== */

/* ---------- raccourcis ---------- */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- jeux d'options ---------- */
const ON  = [{v:1,l:'OUI',c:'v-ab'},{v:0,l:'NON',c:'v-ok'}];          // OUI = anormal
const NO  = [{v:1,l:'OUI',c:'v-ok'},{v:0,l:'NON',c:'v-ab'}];          // OUI = normal
const NN  = [{v:1,l:'OUI'},{v:0,l:'NON'}];                            // neutre
const CO  = [{v:1,l:'D'},{v:2,l:'G'},{v:3,l:'Bilat.'}];
const CO2 = [{v:1,l:'D'},{v:2,l:'G'}];
const REF = [{v:0,l:'Absent',c:'v-ab'},{v:1,l:'Présent',c:'v-ok'},{v:2,l:'Très vif',c:'v-wn'}];
const BBK = [{v:0,l:'Flexion',c:'v-ok'},{v:1,l:'Neutre',c:'v-wn'},{v:2,l:'Extension',c:'v-ab'}];
const MRC = [{v:0,l:'0'},{v:1,l:'1'},{v:2,l:'2'},{v:3,l:'3'},{v:4,l:'4'},{v:5,l:'5'}];
const MRC_TXT = 'Échelle MRC (Medical Research Council) — 0 : aucune contraction · 1 : contraction visible sans mouvement · '+
 '2 : mouvement possible pesanteur éliminée · 3 : mouvement contre pesanteur · 4 : mouvement contre résistance · 5 : force normale';
const EVA = Array.from({length:11},(_,i)=>({v:i,l:String(i)}));
const num = n => Array.from({length:n},(_,i)=>({v:i+1,l:String(i+1)}));

/* positions du regard — plusieurs modalités possibles simultanément */
const REGARD = [
 {v:'centre', l:'Regard centré',          s:'centré'},
 {v:'lat_d',  l:'Regard latéral droit',   s:'latéral droit'},
 {v:'lat_g',  l:'Regard latéral gauche',  s:'latéral gauche'},
 {v:'haut',   l:'Regard vers le haut',    s:'vers le haut'},
 {v:'bas',    l:'Regard vers le bas',     s:'vers le bas'}
];
/* caractère de la trépidation */
const TREP = [{v:1,l:'Épuisable',c:'v-wn'},{v:2,l:'Inépuisable',c:'v-ab'}];


/* =====================================================================
   AIDES À L'EXAMEN
   Chaque item techniquement délicat porte une clé d'aide. Le bouton « ? »
   ouvre la manœuvre, le résultat normal, ce qui compte comme pathologique
   et les pièges courants. Des photos ou des vidéos peuvent être attachées
   à chaque clé depuis le menu « Aides à l'examen » ; elles sont stockées
   dans la base locale du poste et n'entrent dans aucun export de données.
   ===================================================================== */
const HELP = {

oto:{t:'Otoscopie et classification de Haines et Harris',
 h:'<h4>Manœuvre</h4><p>Tirez le pavillon vers le haut et l\'arrière pour redresser le conduit. '+
   'Repérez d\'abord le manche du marteau et le triangle lumineux, puis balayez les quatre quadrants.</p>'+
   '<h4>Cotation</h4><ul>'+
   '<li><b>Stade 1</b> — rougeur du manche du marteau, seul signe visible.</li>'+
   '<li><b>Stade 2</b> — rougeur diffuse du tympan, qui est rétracté.</li>'+
   '<li><b>Stade 3</b> — épanchement séreux de la caisse : niveau liquide ou bulles derrière un tympan ambré.</li>'+
   '<li><b>Stade 4</b> — épanchement de sang dans la caisse : tympan bleu-violacé.</li>'+
   '<li><b>Stade 5</b> — perforation tympanique.</li></ul>'+
   '<h4>Pièges</h4><p>Un bouchon de cérumen fait conclure à tort. Une rougeur du manche du marteau '+
   'peut suivre un simple Valsalva forcé récent, sans barotraumatisme. '+
   '<b>Devant un stade 5, ne faites pas de Valsalva et n\'instillez rien dans le conduit.</b></p>'},

valsalva:{t:'Perméabilité tubaire — manœuvre de Valsalva',
 h:'<h4>Manœuvre</h4><p>Bouche fermée, narines pincées, le sujet souffle doucement. '+
   'Vous observez le tympan pendant l\'effort.</p>'+
   '<h4>Résultat</h4><ul>'+
   '<li><b>Perméable</b> — le tympan bombe franchement, souvent avec un claquement audible.</li>'+
   '<li><b>Difficile</b> — mouvement minime, ou obtenu au prix d\'un effort important, ou d\'un seul côté.</li>'+
   '<li><b>Impossible</b> — aucun mouvement tympanique.</li></ul>'+
   '<h4>Contre-indications</h4><p>Perforation tympanique, vertige déclenché par la manœuvre, '+
   'suspicion de barotraumatisme de l\'oreille interne. Dans ces cas, notez « non réalisé » en commentaire '+
   'plutôt que de forcer.</p>'},

weber:{t:'Test de Weber',
 h:'<h4>Manœuvre</h4><p>Diapason 256 Hz mis en vibration, pied posé sur le vertex ou sur les incisives '+
   'supérieures. Demandez : « De quel côté entendez-vous le son ? »</p>'+
   '<h4>Résultat</h4><ul>'+
   '<li><b>Non latéralisé</b> — son perçu au milieu : audition symétrique.</li>'+
   '<li><b>Latéralisé</b> — le son part <i>vers</i> l\'oreille atteinte en transmission, '+
   'et <i>à l\'opposé</i> de l\'oreille atteinte en perception.</li></ul>'+
   '<h4>Pièges</h4><p>Un diapason posé de travers latéralise faussement. Le sujet doit dire où il entend, '+
   'pas de quel côté il entend le mieux. Une surdité ancienne connue fausse la lecture : demandez-la.</p>',
 svg:'weber'},

rinne:{t:'Test de Rinne',
 h:'<h4>Manœuvre</h4><p>Pied du diapason sur la mastoïde jusqu\'à ce que le sujet cesse de percevoir le son, '+
   'puis branches placées aussitôt devant le conduit auditif. Demandez s\'il entend de nouveau.</p>'+
   '<h4>Résultat</h4><ul>'+
   '<li><b>Positif</b> (CA &gt; CO) — il réentend devant l\'oreille. C\'est la situation normale, '+
   'et aussi celle d\'une surdité de perception.</li>'+
   '<li><b>Négatif</b> (CO &gt; CA) — il n\'entend plus rien devant l\'oreille : atteinte de la transmission '+
   'de ce côté.</li></ul>'+
   '<h4>Piège</h4><p>Dans une surdité de perception profonde unilatérale, l\'oreille saine peut capter '+
   'le son par voie osseuse : le Rinne paraît faussement négatif. C\'est le Weber qui redresse l\'interprétation.</p>',
 svg:'rinne'},

hoffmann:{t:'Signe de Hoffmann',
 h:'<h4>Manœuvre</h4><p>Main du sujet relâchée, poignet en légère extension. Tenez la deuxième phalange '+
   'du majeur et chassez brusquement l\'ongle vers le bas, comme on fait claquer un doigt.</p>'+
   '<h4>Résultat</h4><ul>'+
   '<li><b>OUI = pathologique</b> — flexion-adduction du pouce, souvent accompagnée d\'une flexion de l\'index.</li>'+
   '<li><b>NON</b> — aucun mouvement.</li></ul>'+
   '<h4>Interprétation</h4><p>Signe pyramidal du membre supérieur, évocateur d\'une atteinte au-dessus de C5-C6. '+
   'Un Hoffmann bilatéral isolé existe chez des sujets hyperréflexiques sains : c\'est son asymétrie, '+
   'ou son association à d\'autres signes pyramidaux, qui lui donne sa valeur.</p>',
 svg:'hoffmann'},

babinski:{t:'Réflexe cutané plantaire — signe de Babinski',
 h:'<h4>Manœuvre</h4><p>Pointe mousse. Un seul passage, lent, du talon vers les orteils le long du bord '+
   '<b>externe</b> de la plante, puis incurvation vers le gros orteil. N\'appuyez pas fort : la douleur '+
   'provoque un retrait qui n\'est pas un Babinski.</p>'+
   '<h4>Cotation</h4><ul>'+
   '<li><b>Flexion</b> — les orteils se recroquevillent : réponse normale.</li>'+
   '<li><b>Neutre / indifférent</b> — aucun mouvement. Fréquent, sans valeur en soi.</li>'+
   '<li><b>Extension</b> — le gros orteil se redresse lentement, majestueusement, souvent avec écartement '+
   'des autres orteils : <b>signe de Babinski</b>, atteinte du faisceau pyramidal.</li></ul>'+
   '<h4>Pièges</h4><p>Un retrait rapide et global de tout le membre est un réflexe de défense, pas un Babinski. '+
   'Le signe est normal avant 18 à 24 mois.</p>',
 svg:'babinski'},

rot:{t:'Réflexes ostéotendineux : cotation, diffusion, polycinétisme',
 h:'<h4>Conditions</h4><p>Sujet détendu, membre en position intermédiaire. Frappez le tendon, jamais le muscle. '+
   'Si le réflexe paraît absent, refaites-le avec une manœuvre de Jendrassik (le sujet tire ses mains '+
   'crochetées l\'une contre l\'autre) avant de conclure.</p>'+
   '<h4>Cotation retenue ici</h4><ul>'+
   '<li><b>Absent</b> — rien, même avec renforcement.</li>'+
   '<li><b>Présent</b> — réponse normale.</li>'+
   '<li><b>Très vif</b> — réponse ample et rapide.</li></ul>'+
   '<h4>Les deux qualités complémentaires</h4><ul>'+
   '<li><b>Polycinétique</b> — une seule percussion déclenche plusieurs secousses successives.</li>'+
   '<li><b>Étendu</b> (ou diffusé) — la réponse déborde le muscle attendu : percuter le bicipital fait '+
   'aussi répondre les fléchisseurs des doigts, percuter le rotulien fait répondre les adducteurs, '+
   'parfois du côté opposé.</li></ul>'+
   '<p>Ces deux qualités, avec l\'aire réflexogène élargie, signent un syndrome pyramidal bien avant '+
   'que le réflexe ne devienne franchement « très vif ». Une hyperréflexie globale et symétrique, '+
   'sans polycinétisme ni diffusion, peut être constitutionnelle.</p>'},

trep:{t:'Trépidation épileptoïde (clonus) : épuisable ou inépuisable',
 h:'<h4>Manœuvre — clonus de la cheville</h4><p>Genou fléchi, jambe soutenue, pied relâché. '+
   'Imprimez une flexion dorsale brusque du pied et maintenez la pression.</p>'+
   '<h4>Manœuvre — clonus de la rotule</h4><p>Jambe en extension, empaumez la rotule et poussez-la '+
   'brusquement vers le bas, puis maintenez.</p>'+
   '<h4>Cotation</h4><ul>'+
   '<li><b>Épuisable</b> — quelques secousses (classiquement moins de cinq à six) puis arrêt malgré '+
   'la pression maintenue. Peut se voir chez un sujet anxieux ou hyperréflexique sain.</li>'+
   '<li><b>Inépuisable</b> — les secousses se poursuivent tant que vous maintenez la pression. '+
   '<b>Toujours pathologique</b> : syndrome pyramidal.</li></ul>'+
   '<p>Le caractère se cote séparément à droite et à gauche : une asymétrie vaut autant que la présence.</p>'},

mrc:{t:'Cotation de la force musculaire (échelle MRC)',
 h:'<h4>Échelle</h4><ul>'+
   '<li><b>0</b> — aucune contraction visible ni palpable.</li>'+
   '<li><b>1</b> — contraction visible ou palpable, sans mouvement.</li>'+
   '<li><b>2</b> — mouvement complet, pesanteur éliminée seulement.</li>'+
   '<li><b>3</b> — mouvement complet contre la pesanteur, sans résistance ajoutée.</li>'+
   '<li><b>4</b> — mouvement complet contre une résistance, mais diminué.</li>'+
   '<li><b>5</b> — force normale.</li></ul>'+
   '<h4>Points de méthode</h4><p>Testez sur toute l\'amplitude, comparez systématiquement les deux côtés, '+
   'et testez le côté supposé sain en premier. La limite 3/4 est celle du poids du membre : '+
   'c\'est la seule frontière objective de l\'échelle, servez-vous-en comme repère. '+
   'Une douleur ou une raideur qui limite le testing se note « non testable », pas 4.</p>'},

vac:{t:'Contraction anale volontaire et pression anale profonde',
 h:'<h4>VAC — contraction anale volontaire</h4><p>Doigt intrarectal, demandez au sujet de serrer '+
   'comme pour se retenir. Cotez OUI seulement devant une contraction volontaire reproductible. '+
   'Une contraction réflexe à l\'introduction du doigt ne compte pas.</p>'+
   '<h4>DAP — pression anale profonde</h4><p>Comprimez la paroi rectale entre le doigt intrarectal '+
   'et le pouce posé sur la peau périnéale. Demandez si le sujet perçoit la pression, sans lui montrer '+
   'le moment.</p>'+
   '<h4>Pourquoi ces deux items</h4><p>Ils décident du caractère complet ou incomplet de la lésion '+
   'dans la classification ASIA. Une VAC ou une DAP présente, ou une sensibilité conservée en S4-5, '+
   'suffit à classer la lésion comme incomplète. Ne les laissez pas vides si l\'examen est possible.</p>'},

derm:{t:'Tester les métamères : tact léger et piqûre',
 h:'<h4>Tact léger</h4><p>Effleurez avec un morceau de coton, sans appuyer. Le point de référence est '+
   'la joue, supposée normale : montrez-la au sujet d\'abord, puis comparez chaque métamère à cette référence.</p>'+
   '<h4>Piqûre</h4><p>Pointe mousse d\'une épingle de sûreté à usage unique. Le sujet doit distinguer '+
   'la pointe de la tête ronde <b>les yeux fermés</b>. Ne pas savoir distinguer les deux compte comme 0, '+
   'même si le sujet sent quelque chose.</p>'+
   '<h4>Cotation</h4><ul>'+
   '<li><b>2, normale</b> — perception identique à la joue.</li>'+
   '<li><b>1, hypoesthésie ou hyperesthésie</b> — perception diminuée ou exagérée. Les deux valent 1 '+
   'dans le score ASIA, la distinction est conservée pour le compte rendu.</li>'+
   '<li><b>0, anesthésie</b> — aucune perception, ou pointe et tête non distinguées.</li>'+
   '<li><b>NT</b> — non testable : pansement, plâtre, sujet non coopérant.</li></ul>'+
   '<h4>Méthode</h4><p>Descendez de haut en bas jusqu\'au premier niveau anormal, puis servez-vous '+
   'du report vers le bas. Testez toujours le point de repère anatomique de la norme, indiqué sur chaque ligne.</p>'},

pal:{t:'Pallesthésie au diapason',
 h:'<h4>Manœuvre</h4><p>Diapason 128 Hz mis en vibration, pied posé fermement sur le relief osseux. '+
   'Demandez d\'abord « sentez-vous la vibration ? », puis « dites-moi quand elle s\'arrête », '+
   'en arrêtant vous-même le diapason à un moment que le sujet ne voit pas.</p>'+
   '<h4>Cotation</h4><ul>'+
   '<li><b>Normale</b> — vibration perçue et fin de vibration correctement annoncée.</li>'+
   '<li><b>Diminuée</b> — vibration perçue plus brièvement que sur un relief sain de référence.</li>'+
   '<li><b>Exagérée</b> — perception anormalement vive ou désagréable.</li>'+
   '<li><b>Abolie</b> — vibration non perçue.</li></ul>'+
   '<p>La pallesthésie explore les cordons postérieurs. Elle <b>n\'entre pas</b> dans le score ASIA, '+
   'qui ne retient que le tact léger et la piqûre.</p>'},

nys:{t:'Nystagmus, VNS et NIV',
 h:'<h4>Nystagmus</h4><p>Regard centré puis excursions de 30° environ à droite, à gauche, en haut et en bas. '+
   'Ne dépassez pas 30° : au-delà, un nystagmus physiologique de fin de course apparaît chez tout le monde. '+
   'Le côté noté est celui de la <b>secousse rapide</b>.</p>'+
   '<h4>VNS — vidéonystagmoscopie</h4><p>Sous lunettes occultantes, la fixation étant supprimée, '+
   'un nystagmus d\'origine périphérique apparaît ou s\'amplifie. Un nystagmus qui ne change pas '+
   'sous occlusion oriente vers une origine centrale.</p>'+
   '<h4>NIV — nystagmus induit par vibration</h4><p>Vibrateur 100 Hz appliqué successivement sur '+
   'chaque mastoïde, sous VNS. Un nystagmus induit, battant toujours du même côté quel que soit '+
   'le côté stimulé, signe un déficit vestibulaire unilatéral.</p>'+
   '<h4>En médecine de plongée</h4><p>Un nystagmus apparu au décours d\'une plongée fait discuter '+
   'un barotraumatisme ou un accident de désaturation de l\'oreille interne. Notez l\'heure d\'apparition '+
   'par rapport à la sortie de l\'eau.</p>'},

barre:{t:'Manœuvres de Barré et de Mingazzini',
 h:'<h4>Barré (membres supérieurs)</h4><p>Assis ou debout, bras tendus vers l\'avant à l\'horizontale, '+
   'paumes vers le haut, <b>yeux fermés</b>, pendant 10 à 20 secondes. Un déficit pyramidal se traduit '+
   'par une chute progressive du membre, souvent précédée d\'une pronation de la main.</p>'+
   '<h4>Mingazzini (membres inférieurs)</h4><p>En décubitus dorsal, cuisses fléchies à 90° sur le bassin, '+
   'jambes horizontales, 10 à 20 secondes. Le membre déficitaire s\'abaisse, d\'abord la jambe puis la cuisse.</p>'+
   '<h4>Intérêt</h4><p>Ces deux manœuvres révèlent un déficit trop discret pour être vu au testing segmentaire. '+
   'Une chute asymétrique vaut un déficit, même avec une force cotée 5 partout.</p>'},

gcs:{t:'Score de Glasgow',
 h:'<h4>Règle générale</h4><p>Cotez la <b>meilleure</b> réponse obtenue, et pour la réponse motrice '+
   'la meilleure des deux côtés. Le total va de 3 à 15.</p>'+
   '<h4>Points de méthode</h4><p>Utilisez un stimulus douloureux standardisé (pression sus-orbitaire '+
   'ou pincement du trapèze) plutôt que la friction sternale. Distinguez le retrait à la douleur (4) '+
   'de la flexion inadaptée, dite décortication (3). Si un item ne peut pas être coté (œdème palpébral, '+
   'intubation), notez-le en commentaire : un total calculé sur un item manquant n\'a pas de sens.</p>'},

sphincter:{t:'Troubles sphinctériens et résidu mictionnel',
 h:'<h4>Pourquoi le résidu</h4><p>Une rétention peut être indolore et complète après une atteinte '+
   'médullaire. La mesure échographique (bladder scan) est le seul moyen fiable de la dépister : '+
   'ne vous fiez pas à la seule question « avez-vous uriné ? ».</p>'+
   '<h4>Méthode</h4><p>Mesurez avant la miction, faites uriner, mesurez à nouveau dans les cinq minutes. '+
   'Un résidu post-mictionnel supérieur à 100 mL est anormal. Au-delà de 300 mL, discutez le sondage.</p>'+
   '<h4>En médecine de plongée</h4><p>Un trouble mictionnel après plongée est un signe d\'accident '+
   'de désaturation médullaire jusqu\'à preuve du contraire, même isolé.</p>'}

};

/* Otoscopie : classification de HAINES et HARRIS modifiée par RUI et FLOTTES.
   Le stade 0 n'appartient pas à la classification : il est ajouté ici pour coter
   un tympan normal, qu'il faut bien pouvoir enregistrer. */
const HAINES = [
 {v:0,l:'Normal',c:'v-ok',d:'tympan normal'},
 {v:1,l:'Stade 1',d:'rougeur du manche du marteau'},
 {v:2,l:'Stade 2',c:'v-wn',d:'rougeur diffuse du tympan, qui est rétracté'},
 {v:3,l:'Stade 3',c:'v-ab',d:'épanchement séreux de la caisse du tympan'},
 {v:4,l:'Stade 4',c:'v-ab',d:'épanchement de sang dans la caisse'},
 {v:5,l:'Stade 5',c:'v-ab',d:'perforation tympanique'}
];
const HAINES_LAB = (v) => { const s=HAINES.find(x=>x.v===v); return s? s.d : ''; };
const HAINES_TXT = 'Classification de HAINES et HARRIS modifiée par RUI et FLOTTES — '+
 HAINES.filter(s=>s.v>0).map(s=>'stade '+s.v+' : '+s.d).join(' · ')+
 '. Le stade 0 est ajouté pour coter un tympan normal.';
const VALS = [{v:2,l:'Perméable',c:'v-ok'},{v:1,l:'Difficile',c:'v-wn'},{v:0,l:'Impossible',c:'v-ab'}];

}

function blank(){
  const now = new Date();
  return { id:'F'+now.getTime().toString(36).toUpperCase()+Math.random().toString(36).slice(2,6).toUpperCase(),
           created:now.toISOString(), updated:now.toISOString(),
           d:{ date_ex: iso(now), heure_ex: hhmm(now) } };
}
const iso  = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hhmm = d => String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
const stamp = f => (f.d.date_ex||'9999-99-99')+'T'+(f.d.heure_ex||'99:99')+'|'+(f.created||'');

/* =====================================================================
   EXAMEN PRÉCÉDENT DU MÊME DOSSIER
   ===================================================================== */
function prevFiche(){
  const doss = REC && REC.d.dossier;
  if(!doss) return null;
  const sibs = DB.filter(f=>f.d.dossier===doss && f.id!==REC.id)
                 .sort((a,b)=>stamp(a).localeCompare(stamp(b)));
  if(!sibs.length) return null;
  const cur = stamp(REC);
  const before = sibs.filter(f=>stamp(f) < cur);
  return before.length ? before[before.length-1] : sibs[sibs.length-1];
}
/* remplissage automatique de l'identité et de l'accident */
const ID_KEYS = ['nom','prenom','sexe','ddn','date_acc','heure_acc'];
function autofillFromDossier(){
  const before = PREV && PREV.id;
  PREV = prevFiche();
  if(!PREV) return;
  let n = 0;
  ID_KEYS.forEach(k=>{ const v=REC.d[k];
    if((v==null||v==='') && PREV.d[k]!=null && PREV.d[k]!==''){ REC.d[k]=PREV.d[k]; n++; } });
  if(n && PREV.id!==before) toast('Dossier connu : identité et accident repris de l\'examen du '+frDate(PREV.d.date_ex));
}

const NOGHOST = {date_ex:1,heure_ex:1,num_ex:1,age:1,delai_min:1,gcs_tot:1};
function ghostVal(k){
  if(!PREV || NOGHOST[k]) return null;
  const cur = REC.d[k];
  if(cur!=null && cur!=='' && !(Array.isArray(cur)&&!cur.length)) return null;
  const pv = PREV.d[k];
  if(pv==null || pv==='' || (Array.isArray(pv)&&!pv.length)) return null;
  return pv;
}
function acceptGhost(k){ const g=ghostVal(k); if(g==null) return;
  REC.d[k]=Array.isArray(g)?g.slice():g; pruneDeps(); touch(); refreshField(k); }
/* reprise complète de l'examen précédent sur les champs vides */

  if(!confirm("Reprendre toutes les valeurs de l'examen précédent du "+frDate(PREV.d.date_ex)+
              " sur les champs encore vides ?\n\nLes valeurs déjà saisies ne sont pas modifiées.")) return;

/* =====================================================================
   INTERPRÉTATION DE L'ACOUMÉTRIE (WEBER ET RINNE)
   Rappel des règles : un Rinne négatif (CO > CA) signe une atteinte de
   transmission de cette oreille. Le Weber latéralise VERS l'oreille
   atteinte en transmission, et à l'OPPOSÉ de l'oreille atteinte en
   perception. L'interprétation ci-dessous applique ces deux règles et
   signale les combinaisons qui ne s'accordent pas, plutôt que d'en
   forcer une conclusion.
   ===================================================================== */
const ORL_INT = {
  0:'Acoumétrie symétrique : pas d’argument pour une surdité unilatérale.',
  1:'Surdité de TRANSMISSION DROITE.',
  2:'Surdité de TRANSMISSION GAUCHE.',
  3:'Surdité de TRANSMISSION BILATÉRALE.',
  4:'Surdité de PERCEPTION DROITE.',
  5:'Surdité de PERCEPTION GAUCHE.',
  8:'Résultats discordants : à recontrôler.',
  9:'Interprétation impossible : Weber ou Rinne non renseigné.'
};
function orlAudio(){
  const d = REC.d, w = d.weber, rD = d.rinne_D, rG = d.rinne_G;
  if(w==null || rD==null || rG==null) return {code:9, txt:ORL_INT[9], cls:'wn', note:''};

  const neg = (rD===0?1:0) + (rG===0?1:0);
  let code, txt, cls='ok', note='';

  if(neg===0){
    if(w===0){ code=0; txt=ORL_INT[0]; }
    else if(w===1){ code=5; cls='ab';
      txt='Weber latéralisé à droite avec Rinne positif des deux côtés : '+ORL_INT[5].toLowerCase(); }
    else { code=4; cls='ab';
      txt='Weber latéralisé à gauche avec Rinne positif des deux côtés : '+ORL_INT[4].toLowerCase(); }
  }
  else if(neg===2){
    code=3; cls='ab';
    txt = ORL_INT[3] + (w===1? ' Weber latéralisé à droite : atteinte prédominant à droite.'
        : w===2? ' Weber latéralisé à gauche : atteinte prédominant à gauche.'
        : ' Weber non latéralisé : atteinte symétrique.');
  }
  else {
    const sd  = (rD===0) ? 'D' : 'G';
    const mot = (sd==='D') ? 'droite' : 'gauche';
    const attendu = (sd==='D') ? 1 : 2;
    if(w===attendu){ code=(sd==='D'?1:2); cls='ab'; txt=ORL_INT[code]; }
    else if(w===0){ code=(sd==='D'?1:2); cls='wn';
      txt='Rinne négatif à '+mot+' sans latéralisation du Weber : surdité de transmission '+mot+
          ' de faible degré, ou Weber pris en défaut. À recontrôler.'; }
    else { code=8; cls='ab';
      txt='Rinne négatif à '+mot+' mais Weber latéralisé du côté opposé : les deux tests ne s’accordent pas. '+
          'Vérifiez le placement du diapason et recontrôlez avant de conclure.'; }
  }

  /* Rappel propre à la médecine de plongée, affiché sans conclure à la place
     de l'examinateur : une atteinte de perception au décours d'une plongée
     n'a pas la même urgence qu'une atteinte de transmission. */
  if(code===4 || code===5)
    note = 'Au décours d’une plongée, une atteinte de perception fait discuter un barotraumatisme '+
           'de l’oreille interne ou un accident de désaturation de l’oreille interne. Avis ORL sans délai.';
  else if(code===1 || code===2 || code===3)
    note = 'À rapprocher de l’otoscopie et de la perméabilité tubaire : une atteinte de transmission '+
           'après plongée oriente vers un barotraumatisme de l’oreille moyenne.';

  return {code:code, txt:txt, cls:cls, note:note};
}

function computeAll(){
  const d = REC.d;
  if(d.ddn && d.date_ex){
    const b=new Date(d.ddn), e=new Date(d.date_ex);
    if(!isNaN(b)&&!isNaN(e)&&e>=b){ let a=e.getFullYear()-b.getFullYear();
      const m=e.getMonth()-b.getMonth(); if(m<0||(m===0&&e.getDate()<b.getDate())) a--;
      d.age = a; } else delete d.age;
  } else delete d.age;
  if(d.date_acc && d.heure_acc && d.date_ex && d.heure_ex){
    const a=new Date(d.date_acc+'T'+d.heure_acc), e=new Date(d.date_ex+'T'+d.heure_ex);
    if(!isNaN(a)&&!isNaN(e)) d.delai_min = Math.round((e-a)/60000); else delete d.delai_min;
  } else delete d.delai_min;
  if(d.gcs_y!=null && d.gcs_v!=null && d.gcs_m!=null) d.gcs_tot = d.gcs_y+d.gcs_v+d.gcs_m;
  else delete d.gcs_tot;
  if(d.dossier){
    const sib = DB.filter(f=>f.d.dossier===d.dossier && f.id!==REC.id).concat([REC])
                  .sort((a,b)=>stamp(a).localeCompare(stamp(b)));
    d.num_ex = sib.findIndex(f=>f.id===REC.id)+1;
  } else delete d.num_ex;

  const au = orlAudio();
  if(au.code===9){ delete d.orl_interp; delete d.orl_interp_txt; }
  else { d.orl_interp = au.code; d.orl_interp_txt = au.txt; }

  MODAL.forEach(m=> m.mode==='land' ? palAgg() : dermAgg(m.k));
  subjAgg(); cutAgg(); ASIA = asiaCalc();

  if(d.sens_examinee===0) delete d.sens_obj;
  else d.sens_obj = MODAL.reduce((n,m)=>n+(d['sens_'+m.k+'_nb']||0),0) > 0 ? 1 : 0;
}

/* agrégats d'une modalité cotée par métamère (tact léger, piqûre) */
function dermAgg(mod){
  const d=REC.d, p='sens_'+mod+'_';
  let tot=0, totD=0, totG=0, nt=0, rempli=0; const ab=[];
  DERM.forEach(lv=>['D','G'].forEach(sd=>{
    const v=d[dermKey(mod,lv.k,sd)];
    if(v==null) return;
    rempli++;
    if(v===9){ nt++; return; }
    const a = asiaOf(v);            // l'hyperesthésie vaut 1 comme l'hypoesthésie
    tot+=a; if(sd==='D')totD+=a; else totG+=a;
    if(v!==2) ab.push(lv.l+' '+sd+' ('+dstate(v).l.toLowerCase()+')');
  }));
  d[p+'score']   = rempli?tot:null;
  d[p+'score_D'] = rempli?totD:null;
  d[p+'score_G'] = rempli?totG:null;
  d[p+'nt']      = rempli?nt:null;
  d[p+'nb']      = rempli?ab.length:null;
  d[p+'zones']   = ab.join(' | ');
  [p+'score',p+'score_D',p+'score_G',p+'nt',p+'nb'].forEach(k=>{ if(d[k]==null) delete d[k]; });
}
/* agrégats des lésions cutanées de désaturation */
function cutAgg(){
  const d=REC.d, on=[];
  VIEWS.forEach(v=>SLOTS.forEach(sl=>['D','G'].forEach(sd=>{
    const val=d[cutKey(v.v,sl.s,sd)];
    if(val) on.push({v:v.v,s:sl.s,r:sl.r,side:sd,val:val});
  })));
  d.cut_nb   = on.length;
  d.cut_nb_D = on.filter(z=>z.side==='D').length;
  d.cut_nb_G = on.filter(z=>z.side==='G').length;
  CUTT.forEach(t=> d['cut_'+t.k+'_nb'] = on.filter(z=>z.val===t.v).length);
  ['tetecou','MS','tronc','MI'].forEach(r=>['D','G'].forEach(sd=>
    d['cut_'+r+'_'+sd] = on.some(z=>z.r===r&&z.side===sd)?1:0));
  d.cut_zones = on.map(z=>SLOT_LAB[z.v][z.s]+' '+z.side+' ('+cutt(z.val).l.toLowerCase()+')').join(' | ');
}

/* =====================================================================
   SCORE ASIA (ISNCSCI) — calcul indicatif
   Les totaux, le niveau sensitif et le niveau moteur des segments pourvus
   d'un myotome clé suivent la norme. Dans les segments qui en sont dépourvus
   (C1-C4, T2-L1, S2-S5), la norme présume le niveau moteur égal au niveau
   sensitif « si la fonction motrice sus-jacente est normale ». Cette condition
   demande un jugement clinique : l'outil l'applique de façon mécanique.
   Vérifiez sur la grille officielle avant toute décision.
   ===================================================================== */
const MYO_UE = ['c5','c6','c7','c8','t1'], MYO_LE = ['l2','l3','l4','l5','s1'];
const LVL_LAB = k => { const d=DERM.find(x=>x.k===k); return d?d.l:k; };

function asiaCalc(){
  const d=REC.d, A={};
  const mv = (k,sd) => { const v=d[myoKey(k,sd)]; return (v==null)?null:v; };

  /* totaux sensitifs */
  A.lt  = d.sens_lt_score;  A.ltD = d.sens_lt_score_D;  A.ltG = d.sens_lt_score_G;
  A.pp  = d.sens_pp_score;  A.ppD = d.sens_pp_score_D;  A.ppG = d.sens_pp_score_G;

  /* totaux moteurs */
  const sum = (ks,sd) => { let t=0,n=0; ks.forEach(k=>{ const v=mv(k,sd); if(v!=null){t+=v;n++;} }); return n?t:null; };
  A.uemsD=sum(MYO_UE,'D'); A.uemsG=sum(MYO_UE,'G');
  A.lemsD=sum(MYO_LE,'D'); A.lemsG=sum(MYO_LE,'G');
  A.uems=(A.uemsD==null&&A.uemsG==null)?null:(A.uemsD||0)+(A.uemsG||0);
  A.lems=(A.lemsD==null&&A.lemsG==null)?null:(A.lemsD||0)+(A.lemsG||0);
  A.motTotal=(A.uems==null&&A.lems==null)?null:(A.uems||0)+(A.lems||0);

  /* niveau sensitif : métamère le plus caudal normal en tact léger ET en piqûre,
     tous les métamères sus-jacents étant eux aussi normaux */
  function sensIdx(sd){
    let last=-1;
    for(let i=0;i<DERM.length;i++){
      const lt=d[dermKey('lt',DERM[i].k,sd)], pp=d[dermKey('pp',DERM[i].k,sd)];
      if(lt===2 && pp===2) last=i; else break;
    }
    return last;   // -1 = au-dessus de C2
  }
  /* niveau moteur : myotome clé le plus caudal coté au moins 3,
     tous les myotomes sus-jacents étant à 5 */
  function motIdx(sd){
    let last=-1;
    for(let i=0;i<MYO.length;i++){
      const v=mv(MYO[i].k,sd);
      if(v==null) break;
      if(v>=3){ let ok=true; for(let j=0;j<i;j++){ if(mv(MYO[j].k,sd)!==5){ok=false;break;} }
        if(ok) last=DERM_IDX[MYO[i].k]; else break; }
      else break;
    }
    return last;
  }
  const MYO_IDX = MYO.map(m0=>DERM_IDX[m0.k]);
  ['D','G'].forEach(sd=>{
    const si=sensIdx(sd); let mi=motIdx(sd);
    /* Segments dépourvus de myotome clé (C1-C4, T2-L1, S2-S5) : la norme y présume
       le niveau moteur égal au niveau sensitif, à condition que la fonction motrice
       sus-jacente soit normale. On prolonge donc le niveau moteur dans l'intervalle
       situé sous le dernier myotome clé intact, jusqu'au niveau sensitif, et pas
       au-delà du myotome clé suivant.
       Le niveau issu des myotomes n'est jamais rabaissé par le niveau sensitif :
       un myotome clé coté 5 reste intact même si le dermatome correspondant est altéré. */
    if(mi<0) mi = si;                       /* aucun myotome clé intact : C1-C4 */
    else if(si>mi){
      const nxt = MYO_IDX.find(x=>x>mi);
      const cap = (nxt==null) ? DERM.length-1 : nxt-1;
      mi = Math.min(si, cap);
    }
    A['sensIdx_'+sd]=si; A['motIdx_'+sd]=mi;
    A['sens_'+sd] = si<0 ? 'C1' : DERM[si].l;
    A['mot_'+sd]  = mi<0 ? 'C1' : DERM[mi].l;
  });

  /* niveau neurologique de la lésion : le plus rostral des quatre */
  const idxs=[A.sensIdx_D,A.sensIdx_G,A.motIdx_D,A.motIdx_G];
  A.nliIdx = Math.min.apply(null, idxs);
  A.nli = A.nliIdx<0 ? 'C1' : DERM[A.nliIdx].l;

  /* préservation sacrée */
  const s45lt=[d[dermKey('lt','s45','D')],d[dermKey('lt','s45','G')]];
  const s45pp=[d[dermKey('pp','s45','D')],d[dermKey('pp','s45','G')]];
  A.sacral = s45lt.some(v=>v>=1&&v!==9) || s45pp.some(v=>v>=1&&v!==9) || d.dap===1 || d.vac===1;
  A.sacralKnown = s45lt.some(v=>v!=null) || s45pp.some(v=>v!=null) || d.dap!=null || d.vac!=null;

  /* complétude de la saisie */
  let remplis=0, total=0;
  DERM.forEach(lv=>['D','G'].forEach(sd=>{ ['lt','pp'].forEach(m=>{ total++; if(d[dermKey(m,lv.k,sd)]!=null) remplis++; }); }));
  MYO.forEach(m0=>['D','G'].forEach(sd=>{ total++; if(mv(m0.k,sd)!=null) remplis++; }));
  A.remplis=remplis; A.total=total;

  /* grade AIS */
  A.ais=null; A.aisTxt='';
  if(remplis>0 && A.sacralKnown){
    if(!A.sacral){ A.ais='A'; A.aisTxt='Lésion complète : aucune préservation sacrée.'; }
    else {
      const sparing = ['D','G'].some(sd=>{
        const mi=A['motIdx_'+sd];
        return MYO.some(m0=> DERM_IDX[m0.k] > mi+2 && (mv(m0.k,sd)||0) >= 1);
      });
      const motorIncomplete = (d.vac===1) || sparing;
      if(!motorIncomplete){ A.ais='B'; A.aisTxt='Sensitivement incomplet, moteur complet.'; }
      else {
        const below=[];
        ['D','G'].forEach(sd=>MYO.forEach(m0=>{ if(DERM_IDX[m0.k] > A.nliIdx){ const v=mv(m0.k,sd); if(v!=null) below.push(v); } }));
        const ok = below.filter(v=>v>=3).length;
        if(!below.length){ A.ais='C'; A.aisTxt='Moteur incomplet, aucun myotome clé évaluable sous le niveau.'; }
        else if(ok >= below.length/2){ A.ais='D'; A.aisTxt='Moteur incomplet : au moins la moitié des myotomes clés sous le niveau cotés 3 ou plus.'; }
        else { A.ais='C'; A.aisTxt='Moteur incomplet : moins de la moitié des myotomes clés sous le niveau cotés 3 ou plus.'; }
      }
      const toutNormal = A.lt===112 && A.pp===112 && A.motTotal===100;
      if(toutNormal){ A.ais='E'; A.aisTxt='Examen normal. Grade E seulement si un déficit antérieur est documenté ; sinon il n\'y a pas de lésion médullaire.'; }
    }
  }
  d.asia_lt=A.lt; d.asia_pp=A.pp; d.asia_uems=A.uems; d.asia_lems=A.lems;
  d.asia_sens_D=A.sens_D; d.asia_sens_G=A.sens_G; d.asia_mot_D=A.mot_D; d.asia_mot_G=A.mot_G;
  d.asia_nli=A.nli; d.asia_sacral=A.sacralKnown?(A.sacral?1:0):null; d.asia_ais=A.ais;
  ['asia_lt','asia_pp','asia_uems','asia_lems','asia_sacral','asia_ais','asia_nli',
   'asia_sens_D','asia_sens_G','asia_mot_D','asia_mot_G'].forEach(k=>{ if(d[k]==null) delete d[k]; });
  return A;
}
/* agrégats de la pallesthésie, cotée sur les reliefs osseux */
function palAgg(){
  const d=REC.d, on=[];
  LANDMARKS.forEach(l=>{
    if(l.uni){ const v=d[landKey(l,null)]; if(v) on.push({l:l,side:null,val:v}); }
    else ['D','G'].forEach(sd=>{ const v=d[landKey(l,sd)]; if(v) on.push({l:l,side:sd,val:v}); });
  });
  const p='sens_pal_';
  d[p+'nb']   = on.length;
  d[p+'nb_D'] = on.filter(z=>z.side==='D').length;
  d[p+'nb_G'] = on.filter(z=>z.side==='G').length;
  SSTATE.forEach(st=> d[p+'nb_'+st.k] = on.filter(z=>z.val===st.v).length);
  ['tetecou','MS','tronc','MI'].forEach(r=>['D','G'].forEach(sd=>
    d[p+r+'_'+sd] = on.some(z=>LAND_REG[z.l.k]===r && (z.side===sd||z.side===null))?1:0));
  d[p+'zones'] = on.map(z=>z.l.l+(z.side?' '+z.side:'')+' ('+sLabel('pal',z.val).toLowerCase()+')').join(' | ');
}
/* agrégats des signes subjectifs localisés */
function subjAgg(){
  const d=REC.d, on=[];
  VIEWS.forEach(v=>SLOTS.forEach(s=>['D','G'].forEach(side=>{
    const val=d[subjKey(v.v,s.s,side)];
    if(val) on.push({v:v.v,s:s.s,r:s.r,side:side,val:val});
  })));
  d.subj_nb   = on.length;
  d.subj_nb_D = on.filter(z=>z.side==='D').length;
  d.subj_nb_G = on.filter(z=>z.side==='G').length;
  SUBJT.forEach(t=> d['subj_'+t.k+'_nb'] = on.filter(z=>z.val===t.v).length);
  ['tetecou','MS','tronc','MI'].forEach(r=>['D','G'].forEach(sd=>
    d['subj_'+r+'_'+sd] = on.some(z=>z.r===r&&z.side===sd)?1:0));
  d.subj_zones = on.map(z=>SLOT_LAB[z.v][z.s]+' '+z.side+' ('+subjt(z.val).l.toLowerCase()+')').join(' | ');
}

/* intertitre à l'intérieur d'une section ; porte le bouton qui déplie
   le détail d'un membre déclaré sans déficit */
function headHTML(f){
  let btn = '';
  if(f.limb){
    const def = REC.d[LIMB_DEF[f.limb]];
    const open = limbOpen(f.limb);
    if(def===1) btn = '<span class="hbadge ab">déficit déclaré</span>';
    else if(def===0) btn = '<span class="hbadge ok">'+(f.limb==='sph'?'coté sans déficit':'coté 5 partout')+'</span>'+
      '<button class="mini" onclick="limbToggle(\''+f.limb+'\')">'+(open?'masquer le détail':'afficher le détail')+'</button>';
    else btn = '<span class="hbadge">en attente de réponse</span>'+
      '<button class="mini" onclick="limbToggle(\''+f.limb+'\')">'+(open?'masquer le détail':'afficher le détail')+'</button>';
  }
  return '<div class="fhead" id="r_'+f.k+'"><span>'+esc(f.l)+'</span>'+btn+
    (f.sub2?'<small>'+esc(f.sub2)+'</small>':'')+'</div>';
}
function depOK(f){
  if(f.t==='head') return true;
  if(f.vis && !limbOpen(f.vis)) return false;
  if(!f.dep) return true;
  for(let i=0;i<f.dep.length;i+=2) if(f.dep[i+1].indexOf(REC.d[f.dep[i]])>=0) return true;
  return false;
}
function flagHTML(f){
  if(!f.flags || REC.d[f.k]==null) return '';
  return '<span class="chips" style="margin-left:6px">'+f.flags.map(fl=>{
    const k=f.k+'_'+fl.k;
    return '<span class="chip sm'+(REC.d[k]?' on':'')+'" onclick="toggleFlag(\''+k+'\')">'+esc(fl.l)+'</span>';
  }).join('')+'</span>';
}

/* =====================================================================
   DOUCHETTE CODE-BARRES — écouteur global
   Une douchette USB ou Bluetooth se comporte comme un clavier : elle
   « tape » le code en quelques dizaines de millisecondes puis envoie
   Entrée. On reconnaît cette rafale et on la route vers le n° de dossier,
   quel que soit le champ qui avait le focus.
   ===================================================================== */
const WEDGE = {buf:'', last:0, start:0, el:null};
const WEDGE_GAP  = 50;  // ms au-delà desquelles on considère qu'une nouvelle rafale commence
const WEDGE_RATE = 15;  // ms par caractère au maximum, moyenne sur toute la rafale
const WEDGE_MIN  = 4;   // longueur minimale d'un code pour être pris au sérieux

/* Une douchette émet 1 à 5 ms par caractère. Un être humain, même très rapide,
   ne descend pas durablement sous 60 ms. Le critère de vitesse moyenne est donc
   ce qui distingue un scan d'une frappe, bien plus sûrement qu'un seuil par touche. */
function wedgeKey(e){
  if(!SET.wedge) return;
  if(e.ctrlKey || e.altKey || e.metaKey) return;
  const now = Date.now();
  if(e.key === 'Enter' || e.key === 'Tab'){
    const code = WEDGE.buf, n = code.length;
    WEDGE.buf = '';
    const rafale = n >= WEDGE_MIN &&
                   (now - WEDGE.last) <= WEDGE_GAP &&
                   (WEDGE.last - WEDGE.start) <= (n - 1) * WEDGE_RATE;
    if(rafale){ e.preventDefault(); e.stopPropagation(); handleScan(code, WEDGE.el); }
    return;
  }
  if(e.key.length !== 1) return;
  const ae = document.activeElement;
  // nouvelle rafale si le temps écoulé est trop long, ou si le focus a changé
  if(now - WEDGE.last > WEDGE_GAP || ae !== WEDGE.el){ WEDGE.buf=''; WEDGE.start=now; WEDGE.el=ae; }
  // une frappe trop lente pour une douchette : on repart de ce caractère
  else if(WEDGE.buf.length && (now - WEDGE.last) > WEDGE_RATE){ WEDGE.buf=''; WEDGE.start=now; }
  WEDGE.buf += e.key;
  WEDGE.last = now;
}
document.addEventListener('keydown', wedgeKey, true);

/* retire la chaîne du champ où elle est tombée par erreur, puis l'applique au dossier */
async function handleScan(raw, el){
  const dossEl = document.getElementById('i_dossier');
  if(el && el !== dossEl && el.tagName && /^(INPUT|TEXTAREA)$/.test(el.tagName)){
    const v = String(el.value || '');
    if(v.length >= raw.length && v.slice(-raw.length) === raw){
      el.value = v.slice(0, v.length - raw.length);
      const k = el.id && el.id.indexOf('i_')===0 ? el.id.slice(2) : null;
      if(k && FIELDS[k]){ if(el.value==='') delete REC.d[k]; else REC.d[k]=el.value; }
    }
  }
  await setDossierFromScan(raw);
}

/* applique un identifiant scanné ou saisi : extraction, pseudonymisation, recherche */
async function setDossierFromScan(raw){
  clearTimeout(DOSSIER_T);
  let code = String(raw||'').trim().replace(/[\u0000-\u001F\u007F]/g,'');
  if(SET.scanRe){
    try{ const m = new RegExp(SET.scanRe).exec(code); if(m) code = (m[1]!=null ? m[1] : m[0]); }
    catch(err){ toast("Règle d'extraction invalide, code pris tel quel"); }
  }
  if(!code){ toast('Code illisible'); return; }
  let val = code, pseudo = 0;
  if(SET.hash){
    const h = await pseudonymize(code);
    if(!h){ toast("Pseudonymisation impossible : sel absent ou navigateur sans crypto.subtle"); return; }
    val = h; pseudo = 1;
  }
  REC.d.dossier = val;
  REC.d.dossier_pseudo = pseudo;
  touch(); autofillFromDossier(); renderForm(); beep();
  toast(pseudo ? 'Identifiant pseudonymisé : '+val : 'Identifiant scanné : '+val);
}

/* SHA-256 salé, tronqué. Le sel n'est jamais écrit dans les fichiers exportés. */
async function pseudonymize(code){
  if(!SET.salt) return null;
  if(!(window.crypto && crypto.subtle && crypto.subtle.digest)) return null;
  try{
    const data = new TextEncoder().encode(SET.salt + '\u001F' + code);
    const buf  = await crypto.subtle.digest('SHA-256', data);
    const hex  = Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    return 'P-' + hex.slice(0, SET.hashLen||12).toUpperCase();
  }catch(e){ return null; }
}

/* court bip de confirmation, silencieux si l'audio n'est pas disponible */
function beep(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext; if(!Ctx) return;
    const c = new Ctx(), o = c.createOscillator(), g = c.createGain();
    o.type='square'; o.frequency.value=1180; g.gain.value=0.05;
    o.connect(g); g.connect(c.destination); o.start();
    setTimeout(()=>{ o.stop(); c.close(); }, 70);
  }catch(e){}
}

function pickRef(mode){

    if(mode==='all') on=true;
    else if(mode==='none') on=false;
    else if(mode.indexOf('side_')===0) on = (side===mode.slice(5));
    else if(mode==='ms') on = (fam==='ref_bicip'||fam==='ref_tricip');
    else if(mode==='mi') on = (fam==='ref_rot'||fam==='ref_ach');
    c.checked=on;
  });

  const targets = $$('.cpref').filter(c=>c.checked).map(c=>c.value);
  if(!targets.length){ toast('Aucun réflexe sélectionné'); return; }
  const v = REC.d[src];
  targets.forEach(k=>{
    REC.d[k]=v;
    RFLAGS.forEach(fl=>{ if(REC.d[src+'_'+fl.k]) REC.d[k+'_'+fl.k]=1; else delete REC.d[k+'_'+fl.k]; });
  });
  pruneDeps(); touch(); closeModal(); renderForm();
  toast('Cotation reportée sur '+targets.length+' réflexe'+(targets.length>1?'s':''));
}

/* Découpes : on réutilise les tracés de la silhouette. Chaque figure porte
   ses propres identifiants : plusieurs cartes coexistent sur une même page,
   et un identifiant dupliqué ferait pointer toutes les découpes vers la
   première figure, y compris quand celle-ci est masquée à l'impression. */
let CLIPN = 0;
function dermClips(uid){
  return '<defs>'+Object.keys(DERM_PART).map(part=>
    '<clipPath id="clp_'+uid+'_'+part+'">'+
    DERM_PART[part].map(s=>{ const sl=SLOTS.find(x=>x.s===s); return '<path d="'+sl.d+'"/>'; }).join('')+
    '</clipPath>').join('')+'</defs>';
}
const dzRect = b => { const x0=(b[3]==null?0:b[3]), x1=(b[4]==null?100:b[4]);
  return 'M'+x0+','+b[1]+' H'+x1+' V'+b[2]+' H'+x0+' Z'; };

/* bandes d'un demi-corps pour une vue donnée */
function dermBands(view, mod, side, interactive, uid){
  return Object.keys(DZ[view]).map(part=>
    '<g clip-path="url(#clp_'+uid+'_'+part+')">'+
    DZ[view][part].map(b=>{
      const v = REC.d[dermKey(mod,b[0],side)];
      const st = v==null? null : dstate(v);
      const lv = DERM.find(x=>x.k===b[0]);
      return '<path class="mz'+(st?' on':'')+'" d="'+dzRect(b)+'"'+
        (st?' style="fill:'+st.fill+';stroke:'+st.col+';stroke-width:.9"':'')+
        ' data-k="'+dermKey(mod,b[0],side)+'" data-lvl="'+b[0]+'"'+
        ' data-lab="'+esc((lv?lv.l:b[0])+' '+side+(st?' — '+st.l:'')+(lv?' · '+lv.p:''))+'"'+
        (interactive?'':' style="pointer-events:none"')+'></path>';
    }).join('')+'</g>').join('');
}
/* Étiquettes de niveau. Elles sont dessinées hors des groupes miroir, sinon
   le texte de la moitié droite s'afficherait retourné : pour cette moitié,
   l'abscisse est simplement prise en miroir (200 - x). */
function dermLabels(view, half){
  const out=[], placed=[];
  const mir = x => half==='R' ? 200-x : x;
  /* une étiquette n'est posée que si la place est libre : deux bandes voisines
     et courtes produiraient sinon deux textes superposés */
  const libre = (x,y) => !placed.some(q=>Math.abs(q[0]-x)<11 && Math.abs(q[1]-y)<7);
  Object.keys(DZ[view]).forEach(part=>DZ[view][part].forEach(b=>{
    const h=b[2]-b[1]; if(h<8) return;
    const lv=DERM.find(x=>x.k===b[0]); if(!lv) return;
    const x0=(b[3]==null?0:b[3]), x1=(b[4]==null?100:b[4]);
    let cx=(x0+x1)/2, cy=(b[1]+b[2])/2;
    /* l'étiquette doit rester sur le corps : le tronc et les membres inférieurs
       vivent près de la ligne médiane, le membre supérieur à l'écart */
    if(part==='axe') cx = x1>=100 ? 90 : Math.max(cx, 78);
    if(part==='ms')  cx = Math.min(cx, 76);
    if(part==='mi')  cx = x1>=100 ? 90 : Math.max(cx, 78);
    if(!libre(cx,cy)) return;
    placed.push([cx,cy]);
    out.push('<text class="mlab" x="'+mir(cx).toFixed(1)+'" y="'+(cy+2.2).toFixed(1)+'">'+esc(lv.l)+'</text>');
  }));
  return out.join('');
}
function dermSVG(view, mod, interactive){
  const uid = 'u'+(++CLIPN);
  const half = h => {
    const side = sideOf(view,h);
    return '<g>'+dermBands(view,mod,side,interactive && SGRAIN==='meta',uid)+
      /* contour de la silhouette, par-dessus les bandes */
      SLOTS.map(s=>'<path class="outl" d="'+s.d+'"></path>').join('')+
      /* couche de zones anatomiques, active en mode zone */
      (interactive && SGRAIN==='zone'
        ? SLOTS.map(s=>'<path class="zhit" d="'+s.d+'" data-zone="'+s.s+'" data-side="'+side+'"'+
            ' data-lab="'+esc(SLOT_LAB[view][s.s]+' '+side+' · '+
              ZONE_DERM[view][s.s].map(k=>{const l=DERM.find(x=>x.k===k);return l?l.l:k;}).join(' ')) +'"></path>').join('')
        : '')+
      '</g>';
  };
  const lab = view==='ant'
    ? '<text class="sid" x="16" y="96">D</text><text class="sid" x="180" y="96">G</text>'
    : '<text class="sid" x="16" y="96">G</text><text class="sid" x="180" y="96">D</text>';
  return '<svg class="body sensmap" viewBox="0 0 200 445" width="244" height="500"'+
    (interactive?' onclick="dermClick(event,\''+view+'\',\''+mod+'\')" onmousemove="zoneHover(event)" onmouseleave="zoneHover(null)"':'')+'>'+
    dermClips(uid)+'<g>'+half('L')+'</g><g transform="translate(200,0) scale(-1,1)">'+half('R')+'</g>'+
    '<g class="labs">'+dermLabels(view,'L')+dermLabels(view,'R')+'</g>'+lab+'</svg>';
}
function dermClick(ev, view, mod){
  const t = ev.target.closest('path'); if(!t) return;
  if(t.dataset.zone){
    const side = t.dataset.side;
    const lvls = ZONE_DERM[view][t.dataset.zone] || [];
    lvls.forEach(k=>{ REC.d[dermKey(mod,k,side)] = DBRUSH; });
    touch(); computeAll(); refreshSens(); afterSensChange();
    toast(SLOT_LAB[view][t.dataset.zone]+' '+side+' : '+lvls.length+' métamère'+(lvls.length>1?'s':'')+

  const k = t.dataset.k; if(!k) return;
  if(REC.d[k]===DBRUSH) delete REC.d[k]; else REC.d[k]=DBRUSH;
  touch(); computeAll(); refreshSens(); afterSensChange();

/* =====================================================================
   RECHERCHE D'UN SUJET PAR NUMÉRO, NOM, PRÉNOM OU DATE DE NAISSANCE
   Un sujet est identifié par son numéro de dossier. Les fiches d'un même
   numéro forment une série ; c'est la plus récente qui sert de source au
   remplissage automatique de l'identité et des données de l'accident.
   ===================================================================== */
const norm = s => String(s==null?'':s).toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[^a-z0-9]+/g,' ').trim();

/* index des sujets présents dans la base locale */
function subjectIndex(){
  const by = {};
  DB.forEach(f=>{
    const k = f.d.dossier || '';
    if(!k) return;
    const s = by[k] || (by[k] = {dossier:k, n:0, last:null, nom:'', prenom:'', ddn:'', sexe:null});
    s.n++;
    if(!s.last || stamp(f) > stamp(s.last)) s.last = f;
    ['nom','prenom','ddn'].forEach(a=>{ if(!s[a] && f.d[a]) s[a]=f.d[a]; });
    if(s.sexe==null && f.d.sexe!=null) s.sexe = f.d.sexe;
  });
  return Object.keys(by).map(k=>by[k])
    .sort((a,b)=>stamp(b.last).localeCompare(stamp(a.last)));
}

/* recherche libre : chaque mot de la requête doit se retrouver quelque part.
   Une date se cherche indifféremment en 12/04/1988 ou 1988-04-12. */
function searchSubjects(q){
  const terms = norm(q).split(' ').filter(Boolean);
  if(!terms.length) return [];
  return subjectIndex().filter(s=>{
    const hay = norm([s.dossier, s.nom, s.prenom, s.ddn, frDate(s.ddn),
                      s.last && s.last.d.examinateur].join(' '));
    return terms.every(t=>hay.indexOf(t)>=0);
  });
}

/* reprise d'un sujet : le numéro de dossier et l'identité passent dans la fiche
   courante, puis autofillFromDossier complète le reste depuis l'examen précédent. */
function applySubject(dossier, force){
  const s = subjectIndex().find(x=>x.dossier===dossier);
  if(!s){ toast('Sujet introuvable'); return; }
  REC.d.dossier = s.dossier;
  REC.d.dossier_pseudo = (s.last && s.last.d.dossier_pseudo) || 0;
  ID_KEYS.forEach(k=>{
    const v = s.last.d[k];
    if(v==null || v==='') return;
    if(force || REC.d[k]==null || REC.d[k]==='') REC.d[k]=v;
  });
  touch(); autofillFromDossier(); renderForm();
  toast('Sujet repris : '+(s.nom? s.nom.toUpperCase()+' '+(s.prenom||'') : s.dossier)+
        ' — '+s.n+' examen'+(s.n>1?'s':'')+' au dossier');
}

/* proposition automatique quand l'identité est saisie avant le numéro de dossier */
function matchByIdentity(){
  const d = REC.d;
  if(d.dossier) return null;
  const nom = norm(d.nom), pre = norm(d.prenom), ddn = d.ddn;
  if(!nom && !ddn) return null;
  const cand = subjectIndex().filter(s=>{
    if(ddn && s.ddn && s.ddn!==ddn) return false;
    if(nom && norm(s.nom)!==nom) return false;
    if(pre && norm(s.prenom) && norm(s.prenom)!==pre) return false;
    return (nom && norm(s.nom)===nom) || (ddn && s.ddn===ddn);
  });
  return cand.length===1 ? cand[0] : (cand.length>1 ? {multi:cand.length} : null);
}

      'Reprendre ce dossier</button></div>';
  return h;

  mig:['f_l2_G','f_l3_G','f_l4_G','f_l5_G','f_s1_G'],
  sph:['vac','dap']
};
const LIMB_LAB = {msd:'membre supérieur droit', msg:'membre supérieur gauche',
                  mid:'membre inférieur droit', mig:'membre inférieur gauche', sph:'sphincter anal'};
const LIMB_DEF = {msd:'def_msd', msg:'def_msg', mid:'def_mid', mig:'def_mig', sph:'def_sph'};

function limbOpen(l){ return REC.d[LIMB_DEF[l]]===1 || !!LIMBOPEN[l]; }

/* un membre déclaré déficitaire mais coté 5 partout est une contradiction :

   ===================================================================== */
function lab(k){ const f=FIELDS[k]; if(!f||!f.o) return REC.d[k];
  const o=f.o.find(x=>x.v===REC.d[k]); return o?o.l:null; }
const cote = v => v===1?'à droite':v===2?'à gauche':v===3?'des deux côtés':'';
const cot2 = v => v===1?'droite':v===2?'gauche':'';
const has  = k => REC.d[k]!=null && REC.d[k]!=='';
function frDate(s){ if(!s)return ''; const p=String(s).split('-'); return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s; }

function multiLab(k,short){
  const f=FIELDS[k], a=REC.d[k];
  if(!f||!Array.isArray(a)||!a.length) return '';
  return a.map(v=>{ const o=f.o.find(x=>x.v===v); return o?((short&&o.s)||o.l):v; }).join(', ');
}
const hasMulti = k => Array.isArray(REC.d[k]) && REC.d[k].length>0;

function refFlags(k){
  const out=[]; RFLAGS.forEach(fl=>{ if(REC.d[k+'_'+fl.k]) out.push(fl.l); });
  return out.length? ' ('+out.join(', ')+')' : '';
}

/* Résumé compact d'une modalité métamérique : les niveaux contigus de même
   cotation sont regroupés en intervalles, et les deux côtés fusionnés quand
   ils coïncident. Sur une section complète, cela remplace une liste de
   quarante-six items par deux intervalles. Utilisé par la synthèse rédigée
   et par l'impression ; la colonne CSV détaillée reste inchangée. */
function dermResume(mod){
  const d=REC.d;
  const ETAT = {0:'anesthésie', 1:'hypoesthésie', 3:'hyperesthésie', 9:'non testable'};
  const runs = {};                       /* runs[cote] = [{v, i0, i1}] */
  ['D','G'].forEach(sd=>{
    const out=[]; let cur=null;
    DERM.forEach((lv,i)=>{
      const v=d[dermKey(mod,lv.k,sd)];
      const anormal = (v===0 || v===1 || v===3 || v===9);
      if(anormal && cur && cur.v===v && cur.i1===i-1){ cur.i1=i; return; }
      if(anormal){ cur={v:v, i0:i, i1:i}; out.push(cur); }
      else cur=null;
    });
    runs[sd]=out;
  });
  const label = r => (r.i0===r.i1) ? ('en '+DERM[r.i0].l)
                                   : ('de '+DERM[r.i0].l+' à '+DERM[r.i1].l);
  const key = r => r.v+':'+r.i0+':'+r.i1;
  const mD = new Map(runs.D.map(r=>[key(r),r])), mG = new Map(runs.G.map(r=>[key(r),r]));
  const parts=[];
  runs.D.forEach(r=>{ if(mG.has(key(r))) parts.push(ETAT[r.v]+' '+label(r)+' des deux côtés');
                      else parts.push(ETAT[r.v]+' '+label(r)+' à droite'); });
  runs.G.forEach(r=>{ if(!mD.has(key(r))) parts.push(ETAT[r.v]+' '+label(r)+' à gauche'); });
  return parts.join(', ');
}

function narrative(){
  const d=REC.d, L=[];
  let h='Examen neurologique';
  if(d.date_ex) h+=' du '+frDate(d.date_ex);
  if(d.heure_ex) h+=' à '+d.heure_ex;
  const who=[]; if(d.dossier)who.push('dossier '+d.dossier);
  if(d.sexe)who.push(lab('sexe')==='M'?'sujet masculin':lab('sexe')==='F'?'sujet féminin':'sexe non précisé');
  if(d.age!=null)who.push(d.age+' ans');
  if(who.length) h+=' — '+who.join(', ');
  h+='.'; if(d.num_ex) h+=' Examen n°'+d.num_ex+' pour ce sujet.';
  if(d.delai_min!=null) h+=' Délai accident → examen : '+d.delai_min+' min ('+Math.floor(d.delai_min/60)+' h '+String(Math.abs(d.delai_min)%60).padStart(2,'0')+').';
  if(d.examinateur) h+=' Examinateur : '+d.examinateur+'.';
  L.push(h);

  const c=[]; if(has('avpu')) c.push('AVPU '+lab('avpu'));
  if(d.gcs_tot!=null) c.push('Glasgow '+d.gcs_tot+'/15 (Y'+d.gcs_y+' V'+d.gcs_v+' M'+d.gcs_m+')');
  if(c.length) L.push('CONSCIENCE : '+c.join(', ')+'.');

  /* fonctions supérieures */
  const fs=[];
  if(d.fs_comport===1)fs.push('troubles du comportement');
  if(d.fs_dts===1)fs.push('désorientation temporo-spatiale');
  if(d.fs_parole===1)fs.push('troubles de la parole');
  if(d.fs_visuel===1)fs.push('troubles visuels '+cote(d.fs_visuel_cote));
  if(d.fs_audition===1)fs.push("troubles de l'audition "+cote(d.fs_audition_cote));
  if(d.fs_acouph===1)fs.push('acouphènes '+cote(d.fs_acouph_cote));
  if(d.fs_vertiges===1)fs.push('vertiges');
  if(d.nys===1){
    let s='nystagmus';
    if(d.nys_cote)s+=' à secousse rapide '+cot2(d.nys_cote);
    if(hasMulti('nys_regard'))s+=', regard '+multiLab('nys_regard',1);
    if(has('nys_type'))s+=', '+lab('nys_type').toLowerCase();
    fs.push(s);
  }
  if(fs.length) L.push('FONCTIONS SUPÉRIEURES : '+fs.join(' ; ')+'.');
  else if(['fs_comport','fs_dts','fs_parole','fs_visuel','fs_audition','fs_acouph','fs_vertiges','nys'].some(has))
    L.push('FONCTIONS SUPÉRIEURES : sans anomalie, pas de nystagmus.');

  if(d.vns===1){
    const v=[];
    v.push(d.vns_spont===1
      ? ('nystagmus spontané '+cot2(d.vns_spont_cote)+(hasMulti('vns_spont_regard')?' (regard '+multiLab('vns_spont_regard',1)+')':'')).trim()
      : 'pas de nystagmus spontané');
    if(d.vns_sensib===1) v.push(d.vns_niv===1
      ? ('NIV présent '+cot2(d.vns_niv_cote)+(hasMulti('vns_niv_regard')?' (regard '+multiLab('vns_niv_regard',1)+')':'')).trim()
      : 'NIV absent');
    else if(d.vns_sensib===0) v.push('sans sensibilisation');
    L.push('VNS : '+v.join(' ; ')+'.');
  } else if(d.vns===0) L.push('VNS : non réalisée.');

  /* ORL */
  const orl=[];
  ['D','G'].forEach(sd=>{ const v=d['oto_'+sd];
    if(v>0) orl.push('otoscopie '+(sd==='D'?'droite':'gauche')+' stade '+v+' ('+HAINES_LAB(v)+')'+
      (d['oto_epanch_'+sd]===1?' avec épanchement rétro-tympanique':'')); });
  ['D','G'].forEach(sd=>{ const v=d['valsalva_'+sd];
    if(v!=null && v<2) orl.push('Valsalva '+(sd==='D'?'droit':'gauche')+' '+lab('valsalva_'+sd).toLowerCase()); });
  if(d.weber>0) orl.push('Weber '+lab('weber').toLowerCase());
  ['D','G'].forEach(sd=>{ if(d['rinne_'+sd]===0) orl.push('Rinne '+(sd==='D'?'droit':'gauche')+' négatif'); });
  if(d.orl_interp_txt) orl.push(d.orl_interp_txt.replace(/\.$/,''));
  if(d.orl_txt) orl.push(d.orl_txt);
  if(orl.length) L.push('ORL : '+orl.join(' ; ')+'.');
  else if(['oto_D','oto_G','valsalva_D','valsalva_G','weber','rinne_D','rinne_G'].some(has))
    L.push('ORL : tympans normaux, Valsalva perméable des deux côtés, Weber non latéralisé, Rinne positif bilatéral.');

  /* signes fonctionnels */
  const sf=[];
  if(d.sf_ceph===1)sf.push('céphalées');
  if(d.sf_rachis===1)sf.push('douleur rachidienne'+(d.sf_rachis_loc&&d.sf_rachis_loc.length?' ('+d.sf_rachis_loc.join(', ')+')':''));
  if(has('eva_type')){
    if(d.eva_type===3) sf.push('douleur non évaluable');
    else if(d.eva_score!=null) sf.push((d.eva_type===1?'EVA ':'EN ')+d.eva_score+'/10'+(d.eva_loc?' ('+d.eva_loc+')':''));
  }
  if(d.sf_subj===1){ let s='signes subjectifs';
    if(d.sf_subj_cote)s+=' '+cote(d.sf_subj_cote);
    if(d.subj_nb) s+=' : '+d.subj_zones;
    sf.push(s); }
  if(sf.length) L.push('SIGNES FONCTIONNELS : '+sf.join(' ; ')+'.');
  else if(['sf_ceph','sf_rachis','sf_subj'].some(has)) L.push('SIGNES FONCTIONNELS : absents.');

  /* réflexes */
  const RN={ref_bicip:'bicipital',ref_tricip:'tricipital',ref_rot:'rotulien',ref_ach:'achilléen'};
  const ra=[]; let rtested=0;
  Object.keys(RN).forEach(b=>['D','G'].forEach(s=>{
    const k=b+'_'+s, v=d[k]; if(v==null)return; rtested++;
    const side=(s==='D'?'droit':'gauche'), fl=refFlags(k);
    if(v===0)ra.push(RN[b]+' '+side+' aboli');
    else if(v===2)ra.push(RN[b]+' '+side+' très vif'+fl);
    else if(fl)ra.push(RN[b]+' '+side+' présent'+fl);
  }));
  ['D','G'].forEach(s=>{ const v=d['hoffman_'+s]; if(v===1) ra.push('signe de Hoffmann positif '+(s==='D'?'à droite':'à gauche')); });
  ['D','G'].forEach(s=>{ const v=d['bbk_'+s]; if(v==null)return;
    if(v===2)ra.push('cutané plantaire en extension '+(s==='D'?'à droite':'à gauche'));
    if(v===1)ra.push('cutané plantaire indifférent '+(s==='D'?'à droite':'à gauche')); });
  const trepTxt = (base,nom) => {
    const parts=[];
    ['D','G'].forEach(sd=>{
      const c=d[base+'_cote'];
      const concerne = (sd==='D' ? (c===1||c===3) : (c===2||c===3));
      if(!concerne) return;
      const q=d[base+'_qual_'+sd];
      parts.push((sd==='D'?'à droite':'à gauche')+(q?' ('+lab(base+'_qual_'+sd).toLowerCase()+')':''));
    });
    return nom+' '+(parts.length?parts.join(' et '):cote(d[base+'_cote']));
  };
  if(d.trep_pied===1)ra.push(trepTxt('trep_pied','trépidation du pied'));
  if(d.trep_rot===1)ra.push(trepTxt('trep_rot','trépidation rotulienne'));
  if(d.contract===1)ra.push('contractions musculaires spontanées '+cote(d.contract_cote)+(d.contract_loc?' ('+d.contract_loc+')':''));
  if(ra.length) L.push('RÉFLEXES : '+ra.join(' ; ')+'.');
  else if(rtested) L.push('RÉFLEXES : ostéotendineux présents et symétriques, Hoffmann négatif, cutané plantaire en flexion des deux côtés, pas de trépidation ni de contraction spontanée.');

  /* force motrice */
  const dec = Object.keys(LIMB_DEF).filter(l=>l!=='sph' && d[LIMB_DEF[l]]!=null);
  if(dec.length){
    const av = dec.filter(l=>d[LIMB_DEF[l]]===1).map(l=>LIMB_LAB[l]);
    const sans = dec.filter(l=>d[LIMB_DEF[l]]===0).map(l=>LIMB_LAB[l]);
    const ph=[];
    if(av.length)   ph.push('déficit déclaré : '+av.join(', '));
    if(sans.length) ph.push('sans déficit : '+(sans.length===4?'les quatre membres':sans.join(', ')));
    L.push('DÉFICIT MOTEUR PAR MEMBRE : '+ph.join(' ; ')+'.');
  }
  const fa=[]; let ftested=0;
  MYO.forEach(m0=>['D','G'].forEach(sd=>{ const v=d[myoKey(m0.k,sd)]; if(v==null)return; ftested++;
    if(v<5)fa.push(m0.l+' '+m0.m.toLowerCase()+' '+(sd==='D'?'droit':'gauche')+' coté '+v+'/5'); }));
  ['f_epaule','f_main'].forEach(b=>['D','G'].forEach(sd=>{ const v=d[b+'_'+sd]; if(v==null||v===5)return;
    fa.push((b==='f_epaule'?'élévation des épaules ':'serrage de main ')+(sd==='D'?'droite':'gauche')+' coté '+v+'/5'); }));
  if(fa.length) L.push('FORCE MOTRICE (MRC) : '+fa.join(' ; ')+'.');
  else if(ftested) L.push('FORCE MOTRICE (MRC) : 5/5 sur les '+ftested+' myotomes clés testés.');
  if(has('vac')||has('dap'))
    L.push('SPHINCTER : contraction anale volontaire '+(d.vac===1?'présente':d.vac===0?'absente':'non testée')+
           ', pression anale profonde '+(d.dap===1?'perçue':d.dap===0?'non perçue':'non testée')+'.');

  /* motricité */
  const mo=[];
  if(d.par_fac===1)mo.push('paralysie faciale '+cote(d.par_fac_cote)+(d.par_oeil===1?", sans fermeture de l'œil":''));
  if(d.barre===1)mo.push('chute au Barré '+cote(d.barre_cote));
  if(d.ming===1)mo.push('chute au Mingazzini '+cote(d.ming_cote));
  if(mo.length) L.push('MOTRICITÉ : '+mo.join(' ; ')+'.');
  else if(['par_fac','barre','ming'].some(has)) L.push('MOTRICITÉ : pas de paralysie faciale, Barré et Mingazzini tenus.');

  /* miction */
  const mi=[];
  if(has('mict')) mi.push(d.mict===1?('miction présente'+(has('mict_type')?', '+lab('mict_type').toLowerCase():'')):"pas de miction depuis l'accident");
  if(d.mict_residu_pre!=null)  mi.push('résidu pré-mictionnel '+d.mict_residu_pre+' mL');
  if(d.mict_residu_post!=null) mi.push('résidu post-mictionnel '+d.mict_residu_post+' mL');
  if(mi.length) L.push('MICTION : '+mi.join(' ; ')+'.');

  /* coordination */
  const co=[];
  if(d.vertic===0)co.push('verticalisation impossible');
  else if(has('vertic')){
    if(d.equil_yo===0)co.push('équilibre statique non conservé yeux ouverts');
    if(d.equil_yf===0)co.push('équilibre statique non conservé yeux fermés');
  }
  if(d.marche===0)co.push('marche impossible');
  else if(has('marche')){
    if(d.marche_yo===1)co.push('marche anormale yeux ouverts');
    if(d.marche_yf===1)co.push('marche anormale yeux fermés');
    if(d.devia_cote)co.push('déviation '+cote(d.devia_cote));
  }
  if(d.talon_genou===0)co.push('talon-genou déficitaire '+cote(d.talon_genou_cote));
  if(d.doigt_nez===0)co.push('doigt-nez déficitaire '+cote(d.doigt_nez_cote));
  if(co.length) L.push('COORDINATION : '+co.join(' ; ')+'.');
  else if(['vertic','marche','talon_genou','doigt_nez'].some(has)) L.push('COORDINATION : verticalisation, équilibre, marche et épreuves cérébelleuses normaux.');

  /* sensibilités */
  if(d.sens_examinee===0) L.push('SENSIBILITÉS : examen non réalisé.');
  else {
    const se=[];
    MODAL.forEach(m=>{ const n=d['sens_'+m.k+'_nb']||0;
      if(!n) return;
      const det = (m.mode==='derm') ? dermResume(m.k) : d['sens_'+m.k+'_zones'];
      se.push(m.l.toLowerCase()+' : '+det); });
    L.push('SENSIBILITÉS : '+(se.length? se.join(' | ') : 'tact léger, piqûre et pallesthésie normaux sur l\'ensemble des territoires testés')+'.');
  }
  if(ASIA && (ASIA.lt!=null || ASIA.uems!=null)){
    const a=[];
    if(ASIA.lt!=null) a.push('tact léger '+ASIA.lt+'/112');
    if(ASIA.pp!=null) a.push('piqûre '+ASIA.pp+'/112');
    if(ASIA.uems!=null) a.push('moteur MS '+ASIA.uems+'/50');
    if(ASIA.lems!=null) a.push('moteur MI '+ASIA.lems+'/50');
    a.push('niveaux sensitifs D '+ASIA.sens_D+' / G '+ASIA.sens_G);
    a.push('niveaux moteurs D '+ASIA.mot_D+' / G '+ASIA.mot_G);
    a.push('NLI '+ASIA.nli);
    if(ASIA.sacralKnown) a.push('préservation sacrée '+(ASIA.sacral?'présente':'absente'));
    if(ASIA.ais) a.push('AIS '+ASIA.ais);
    L.push('ASIA (calcul indicatif) : '+a.join(', ')+'.');
  }
  /* lésions cutanées */
  if(d.cut_present===1){
    const c=[];
    if(d.cut_nb) c.push(d.cut_zones);
    if(d.cut_delai!=null) c.push('apparition à '+d.cut_delai+' min après émersion');
    if(has('cut_evol')) c.push('évolution sous oxygène : '+lab('cut_evol').toLowerCase());
    if(d.cut_txt) c.push(d.cut_txt);
    L.push('LÉSIONS CUTANÉES : '+(c.length?c.join(' ; '):'présentes')+'.');
  } else if(d.cut_present===0) L.push('LÉSIONS CUTANÉES : absentes.');

  const cc=[]; if(has('conclusion'))cc.push(lab('conclusion'));
  if(has('orientation'))cc.push(lab('orientation')+(d.orientation===5&&d.orientation_autre?' : '+d.orientation_autre:''));
  if(d.orientation_txt)cc.push(d.orientation_txt.replace(/\n+/g,' '));
  if(cc.length) L.push('CONCLUSION : '+cc.join(' — ').replace(/\s*\.\s*$/,'')+'.');
  if(d.notes) L.push('COMMENTAIRES : '+d.notes);
  return L.join('\n');
}
function renderSynth(){ const el=$('#synth'); if(el) el.textContent=narrative(); }
function copySynth(){ navigator.clipboard.writeText(narrative()).then(()=>toast('Synthèse copiée'),()=>toast('Copie impossible')); }

/* =====================================================================
   IMPRESSION / PDF
   ===================================================================== */
function pv(k,normalVal){ const v=REC.d[k];
  if(v==null||v==='') return '<span style="color:#888">—</span>';
  const t=lab(k); const abn = normalVal!=null && v!==normalVal;
  return '<span class="pv'+(abn?' ab':'')+'">'+esc(t!=null?t:v)+'</span>'; }
function pline(l,html){ return '<div class="pl"><b>'+l+' :</b> '+html+'</div>'; }
function pcote(k){ const v=REC.d[k]; return v?' <span class="pv">('+(v===1?'D':v===2?'G':'D+G')+')</span>':''; }
function pmulti(k){ const t=multiLab(k,1); return t?' <span class="pv">[regard '+esc(t)+']</span>':''; }
function ptrep(base,nom){
  const d=REC.d;
  if(d[base]!==1) return pline(nom,pv(base,0));
  const c=d[base+'_cote'], parts=[];
  ['D','G'].forEach(sd=>{
    const concerne = (sd==='D' ? (c===1||c===3) : (c===2||c===3));
    if(!concerne) return;
    parts.push(sd+' : '+(d[base+'_qual_'+sd]!=null? pv(base+'_qual_'+sd) : '<span style="color:#888">caractère non précisé</span>'));
  });
  return pline(nom, pv(base,0)+pcote(base+'_cote')+(parts.length?' &nbsp; '+parts.join(' &nbsp;·&nbsp; '):''));
}
function pref(k){ return pv(k,1)+'<span class="pf">'+esc(refFlags(k))+'</span>'; }
function pid(l,v){ return '<div style="font-size:8.2pt"><b>'+l+' :</b> '+(v?esc(v):'<span style="color:#888">&nbsp;</span>')+'</div>'; }
function box(t,inner){ return '<div class="pbox"><h4>'+t+'</h4><div class="pb">'+inner+'</div></div>'; }

      pline('Valsalva G',pv('valsalva_G',2))+

        '<b>Interprétation acoumétrique :</b> <span class="pv'+(d.orl_interp?' ab':'')+'">'+esc(d.orl_interp_txt)+'</span>'+

      pline('Douleur cotée', (has('eva_type')? pv('eva_type')+(d.eva_type!==3&&d.eva_score!=null?' — <span class="pv'+(d.eva_score>0?' ab':'')+'">'+d.eva_score+'/10</span>':'')+
        (d.eva_loc?' — '+esc(d.eva_loc):'') : '<span style="color:#888">—</span>'))+

  h+=box('MICTION','<div class="p2"><div>'+

      pline('Résidu post-mictionnel',(d.mict_residu_post!=null?'<span class="pv">'+d.mict_residu_post+' mL</span>':'<span style="color:#888">—</span>'))+'</div></div>');

      pline('Marche possible',pv('marche',1))+

      pline('Talon-genou',pv('talon_genou',1)+pcote('talon_genou_cote'))+

  /* ---------- page 2 : grille ASIA ---------- */

     MYO.slice(5).map(m0=>'<tr><td><b>'+esc(m0.l)+'</b> '+esc(m0.m)+'</td><td>'+

       (d[myoKey(m0.k,'G')]==null?'<span style="color:#aaa">·</span>':(d[myoKey(m0.k,'G')]===5?'5':'<b class="ab">'+d[myoKey(m0.k,'G')]+'</b>'))+'</td></tr>').join('')+

  const nn=(v,m)=>v==null?'—':v+' / '+m;

       pline('Niveau sensitif', (A.sens_D||'—')+' (D) / '+(A.sens_G||'—')+' (G)')+

       pline('NLI', '<b>'+(A.nli||'—')+'</b>')+

     '</div></div>'+
     '<div class="paisp"><b>'+(A.ais? 'AIS '+A.ais : 'AIS non déterminable')+'</b> — '+esc(A.aisTxt||'grille incomplète')+'</div>'+

  /* cartes métamériques : la page 2 a la place, et une carte se lit d'un coup d'œil

  if(d.sens_examinee!==0){

        '<div class="pb"><div class="psvg">'+VIEWS.map(v=>

        '</div></div>'+
        '<div class="pzl">'+(dermResume(m.k)? esc(dermResume(m.k)) : 'Aucune anomalie cotée.')+'</div></div>').join('')+

  h+='</div>';

  /* ---------- page 3 : schémas, pallesthésie, conclusion ---------- */
  h+='<div class="pg"><div class="phead" style="font-size:10.5pt">SCHÉMAS, PALLESTHÉSIE ET CONCLUSION</div>';

  h+='<div class="pbox"><h4 class="small">SIGNES SUBJECTIFS<span class="sb"> localisation du ressenti</span></h4>'+

     '<div class="pb"><div class="p2">'+
