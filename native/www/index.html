  h+='<div class="pfoot"><span>Signes subjectifs : '+(d.sf_subj===1?'OUI':d.sf_subj===0?'NON':'—')+

  h+='<div class="pbox" style="margin-top:1.4mm"><h4>CONCLUSION</h4><div class="pb">'+

     (d.orientation_txt?pline("Précisions sur l'orientation",esc(d.orientation_txt).replace(/\n/g,'<br>')):'')+

  h+='<div style="font-size:7pt;text-align:right;margin-top:1.5mm;color:#444">Fiche '+esc(REC.id)+
     ' — éditée le '+frDate(iso(new Date()))+' à '+hhmm(new Date())+'</div>';
  h+='</div>';
  return h;
}

/* Feuille de style complete de la page, reutilisee telle quelle pour
   l'impression native : l'adaptateur d'impression d'Android et de iOS
   applique bien les regles @media print. */
function printCSS(){
  return Array.prototype.map.call(document.querySelectorAll('style'), s=>s.textContent).join('\n')
       + '\n@page{size:A4 portrait;margin:9mm 10mm}'
       + '\nbody.printdoc{background:#fff}'
       + '\nbody.printdoc #print-root{display:block !important}';
}
function printName(){
  return 'Fiche_neuro_'+(REC.d.dossier||'sans-dossier')+'_'+(REC.d.date_ex||'')+(REC.d.num_ex?'_ex'+REC.d.num_ex:'');
}
function doPrint(){
  computeAll();
  $('#print-root').innerHTML = buildPrint();

  /* Dans un WebView natif (Android, iOS), window.print() ne fait rien :
     ni WebView ni WKWebView n'implementent l'appel. On passe alors par le
     plugin NativePrint livre avec le projet natif, qui ouvre le service
     d'impression du systeme (impression papier ou export PDF). */
  const NP = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.NativePrint;
  if(NP){
    const doc = '<!doctype html><html lang="fr"><head><meta charset="utf-8">'+
      '<title>'+printName()+'</title><style>'+printCSS()+'</style></head>'+
      '<body class="printdoc">'+$('#print-root').innerHTML+'</body></html>';
    NP.print({ name: printName(), html: doc })
      .catch(e => toast('Impression indisponible : '+e));
    return;
  }

  const old=document.title;
  document.title = printName();
  window.print();
  setTimeout(()=>{document.title=old;},800);
}

/* =====================================================================
   COLONNES DU FICHIER STATISTIQUE + DICTIONNAIRE
   ===================================================================== */
const SET = {pii:false, sep:';', poste:'', wedge:true, scanRe:'', hash:false, hashLen:12, salt:''};

function codesOf(f){
  if(f.t==='choice') return f.o.map(o=>o.v+' = '+o.l).join(' ; ');
  if(f.t==='multi')  return '1 = coche ; 0 = non coche';
  if(f.t==='date')   return 'AAAA-MM-JJ';
  if(f.t==='time')   return 'HH:MM';
  return 'texte libre';
}
function columns(pii){
  const C=[], add=(k,l,codes,get)=>C.push({k:k,l:l,codes:codes,get:get||(r=>r.d[k])});
  add('fiche_id',"Identifiant unique de la fiche",'texte (cle primaire, sert au dedoublonnage)',r=>r.id);
  add('dossier',"N. de dossier / identifiant du sujet",'texte (cle sujet : relie les examens repetes)');
  add('dossier_pseudo','Identifiant pseudonymise ?',
      '1 = empreinte salee SHA-256 d un identifiant scanne ou saisi (prefixe P-) ; 0 = valeur saisie telle quelle ; vide = non renseigne',
      r=>r.d.dossier_pseudo!=null?r.d.dossier_pseudo:'');
  add('num_ex',"Rang de l'examen pour ce sujet",'entier >= 1, ordonne par date et heure');
  add('date_ex',"Date de l'examen",'AAAA-MM-JJ');
  add('heure_ex',"Heure de l'examen",'HH:MM');
  add('examinateur','Examinateur','texte');
  add('poste','Poste de saisie','texte (renseigne dans les reglages, utile a la fusion)',()=>SET.poste);
  add('date_acc',"Date de l'accident",'AAAA-MM-JJ');
  add('heure_acc',"Heure de l'accident",'HH:MM');
  add('delai_min','Delai accident vers examen','entier, minutes (calcule)');
  add('sexe','Sexe','1 = M ; 2 = F ; 3 = Autre');
  add('age',"Age a la date de l'examen",'entier, annees (calcule)');
  if(pii){ add('nom','Nom','texte - DONNEE IDENTIFIANTE');
           add('prenom','Prenom','texte - DONNEE IDENTIFIANTE');
           add('ddn','Date de naissance','AAAA-MM-JJ - DONNEE IDENTIFIANTE'); }

  SPEC.forEach(s=>{ if(s.id==='ident') return;
    s.f.forEach(f=>{
      if(f.t==='head') return;          // intertitre d'affichage, pas une variable
      if(f.t==='multi'){
        f.o.forEach(o=>add(f.k+'_'+o.v, f.l+' - '+o.l+' ('+s.t+')','1 = coche ; 0 = non coche',
          r=>{const a=r.d[f.k]; return Array.isArray(a)?(a.indexOf(o.v)>=0?1:0):(r.d[f.k+'_'+o.v]!=null?r.d[f.k+'_'+o.v]:'');}));
        add(f.k, f.l+' - liste ('+s.t+')','texte, valeurs separees par |',
          r=>Array.isArray(r.d[f.k])?r.d[f.k].join('|'):(r.d[f.k]||''));
      } else {
        add(f.k, f.l+' ('+s.t+')', codesOf(f)+(f.t==='num'&&f.unit?' ('+f.unit+')':''));
        // qualites complementaires des reflexes osteotendineux
        if(f.flags) f.flags.forEach(fl=>{ const kk=f.k+'_'+fl.k;
          add(kk, f.l+' - reflexe '+fl.l+' ('+s.t+')',
              '1 = present ; 0 = absent ; vide = reflexe non teste',
              r=>r.d[f.k]==null?'':(r.d[kk]?1:0)); });
      }
    });
  });

  // ---- interpretation acoumetrique deduite ----
  add('orl_interp','Interpretation acoumetrique (deduite de Weber et Rinne)',
      '0 = acoumetrie symetrique ; 1 = transmission droite ; 2 = transmission gauche ; 3 = transmission bilaterale ; '+
      '4 = perception droite ; 5 = perception gauche ; 8 = resultats discordants ; vide = Weber ou Rinne non renseigne',
      r=>r.d.orl_interp!=null?r.d.orl_interp:'');
  add('orl_interp_txt','Interpretation acoumetrique - phrase','texte (deduit, ne remplace pas l audiometrie)',
      r=>r.d.orl_interp_txt||'');

  add('sens_obj','Signes objectifs sensitifs','1 = OUI ; 0 = NON (deduit des cotations) ; vide = sensibilites non examinees',
      r=>r.d.sens_examinee===0?'':(r.d.sens_obj!=null?r.d.sens_obj:''));
  const SX = r => r.d.sens_examinee===1;

  // ---- sensibilite par metamere (ISNCSCI) ----
  const DCODE = '2 = normale ; 1 = hypoesthesie ; 3 = hyperesthesie ; 0 = anesthesie ; 9 = non testable (NT) ; '+
               'vide = non renseigne. Score ASIA : 2 vaut 2, 1 et 3 valent 1, 0 vaut 0, NT est exclu du total';
  MODAL.filter(m=>m.mode==='derm').forEach(m=>{
    const p='sens_'+m.k+'_';
    add(p+'score',   m.l+' - score total','entier 0-112 ; les NT sont exclus du total', r=>SX(r)?(r.d[p+'score']!=null?r.d[p+'score']:''):'');
    add(p+'score_D', m.l+' - score DROITE','entier 0-56', r=>SX(r)?(r.d[p+'score_D']!=null?r.d[p+'score_D']:''):'');
    add(p+'score_G', m.l+' - score GAUCHE','entier 0-56', r=>SX(r)?(r.d[p+'score_G']!=null?r.d[p+'score_G']:''):'');
    add(p+'nt',      m.l+' - nombre de metameres non testables','entier 0-56', r=>SX(r)?(r.d[p+'nt']!=null?r.d[p+'nt']:''):'');
    add(p+'nb',      m.l+' - nombre de metameres anormaux','entier 0-56', r=>SX(r)?(r.d[p+'nb']!=null?r.d[p+'nb']:''):'');
    add(p+'zones',   m.l+' - liste des metameres anormaux','texte, separes par |', r=>SX(r)?(r.d[p+'zones']||''):'');
    DERM.forEach(lv=>['D','G'].forEach(sd=>{
      const k=dermKey(m.k,lv.k,sd);
      add(k, m.l+' - metamere '+lv.l+' '+sd+' ('+lv.p+')', DCODE, r=>SX(r)?(r.d[k]!=null?r.d[k]:''):'');
    }));
  });

  // ---- pallesthesie sur les reliefs osseux ----
  const ETAT = '1 = diminuee ; 2 = exageree ; 3 = abolie ; 0 = normale ; vide = non examine';
  const pp='sens_pal_';
  add(pp+'nb',  'Pallesthesie - nombre de reliefs anormaux','entier 0-23 ; vide = non examine', r=>SX(r)?(r.d[pp+'nb']||0):'');
  add(pp+'nb_D','Pallesthesie - nombre a DROITE','entier', r=>SX(r)?(r.d[pp+'nb_D']||0):'');
  add(pp+'nb_G','Pallesthesie - nombre a GAUCHE','entier', r=>SX(r)?(r.d[pp+'nb_G']||0):'');
  SSTATE.forEach(st=> add(pp+'nb_'+st.k,'Pallesthesie - nombre cotes '+st.lp,'entier', r=>SX(r)?(r.d[pp+'nb_'+st.k]||0):''));
  ['tetecou','MS','tronc','MI'].forEach(r0=>['D','G'].forEach(sd=>
    add(pp+r0+'_'+sd,'Pallesthesie - atteinte '+REGION_LAB[r0]+' '+sd,'1 = atteinte ; 0 = aucune', r=>SX(r)?(r.d[pp+r0+'_'+sd]||0):'')));
  add(pp+'zones','Pallesthesie - liste detaillee','texte, separes par |', r=>SX(r)?(r.d[pp+'zones']||''):'');
  LANDMARKS.forEach(l=>{
    if(l.uni) add(landKey(l,null),'Pallesthesie - '+l.l+' (median)', ETAT, r=>SX(r)?(r.d[landKey(l,null)]||0):'');
    else ['D','G'].forEach(sd=> add(landKey(l,sd),'Pallesthesie - '+l.l+' '+sd, ETAT, r=>SX(r)?(r.d[landKey(l,sd)]||0):''));
  });

  // ---- synthese ASIA ----
  add('asia_lt',   'ASIA - score tact leger total','entier 0-112 (calcule)');
  add('asia_pp',   'ASIA - score piqure total','entier 0-112 (calcule)');
  add('asia_uems', 'ASIA - score moteur membres superieurs','entier 0-50 (calcule)');
  add('asia_lems', 'ASIA - score moteur membres inferieurs','entier 0-50 (calcule)');
  add('asia_sens_D','ASIA - niveau sensitif DROIT','texte, metamere (calcule)');
  add('asia_sens_G','ASIA - niveau sensitif GAUCHE','texte, metamere (calcule)');
  add('asia_mot_D', 'ASIA - niveau moteur DROIT','texte, metamere (calcule, regle simplifiee)');
  add('asia_mot_G', 'ASIA - niveau moteur GAUCHE','texte, metamere (calcule, regle simplifiee)');
  add('asia_nli',   'ASIA - niveau neurologique de la lesion','texte, metamere (calcule)');
  add('asia_sacral','ASIA - preservation sacree','1 = oui ; 0 = non ; vide = non determinable');
  add('asia_ais',   'ASIA - grade AIS','A, B, C, D ou E (calcul indicatif, a verifier)');

  // ---- signes subjectifs localises ----
  const SJ = r => r.d.sf_subj===0 || r.d.sf_subj===1;
  const TCODE = SUBJT.map(t=>t.v+' = '+t.l).join(' ; ')+' ; 0 = aucun ; vide = non renseigne';

  add('subj_nb_G','Signes subjectifs - zones a GAUCHE','entier', r=>SJ(r)?(r.d.subj_nb_G||0):'');
  SUBJT.forEach(t=> add('subj_'+t.k+'_nb','Signes subjectifs - zones : '+t.l,'entier', r=>SJ(r)?(r.d['subj_'+t.k+'_nb']||0):''));
  ['tetecou','MS','tronc','MI'].forEach(r0=>['D','G'].forEach(sd=>
    add('subj_'+r0+'_'+sd,'Signes subjectifs - atteinte '+REGION_LAB[r0]+' '+sd,'1 = oui ; 0 = non', r=>SJ(r)?(r.d['subj_'+r0+'_'+sd]||0):'')));
  add('subj_zones','Signes subjectifs - liste detaillee','texte, separees par |', r=>SJ(r)?(r.d.subj_zones||''):'');
  VIEWS.forEach(v=>SLOTS.forEach(sl=>['D','G'].forEach(sd=>{
    const k=subjKey(v.v,sl.s,sd);
    add(k,'Signes subjectifs - '+SLOT_LAB[v.v][sl.s]+' '+sd, TCODE, r=>SJ(r)?(r.d[k]||0):'');

  // ---- lesions cutanees de desaturation ----

  add('cut_nb_D','Lesions cutanees - zones a DROITE','entier', r=>CJ(r)?(r.d.cut_nb_D||0):'');
  add('cut_nb_G','Lesions cutanees - zones a GAUCHE','entier', r=>CJ(r)?(r.d.cut_nb_G||0):'');
  CUTT.forEach(t=> add('cut_'+t.k+'_nb','Lesions cutanees - zones : '+t.l,'entier', r=>CJ(r)?(r.d['cut_'+t.k+'_nb']||0):''));
  ['tetecou','MS','tronc','MI'].forEach(r0=>['D','G'].forEach(sd=>
    add('cut_'+r0+'_'+sd,'Lesions cutanees - atteinte '+REGION_LAB[r0]+' '+sd,'1 = oui ; 0 = non', r=>CJ(r)?(r.d['cut_'+r0+'_'+sd]||0):'')));
  add('cut_zones','Lesions cutanees - liste detaillee','texte, separees par |', r=>CJ(r)?(r.d.cut_zones||''):'');
  VIEWS.forEach(v=>SLOTS.forEach(sl=>['D','G'].forEach(sd=>{
    const k=cutKey(v.v,sl.s,sd);
    add(k,'Lesions cutanees - '+SLOT_LAB[v.v][sl.s]+' '+sd, CCODE, r=>CJ(r)?(r.d[k]||0):'');
  })));

  add('created','Horodatage de creation','ISO 8601',r=>r.created);
  add('updated','Horodatage de derniere modification','ISO 8601',r=>r.updated);
  return C;
}

/* ---------- CSV ---------- */
function csvCell(v,sep){
  if(v==null) return '';
  const s=String(v);
  return (/["\n\r]/.test(s) || s.indexOf(sep)>=0) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function buildCSV(recs,sep,pii){
  const C=columns(pii), L=[C.map(c=>csvCell(c.k,sep)).join(sep)];
  recs.forEach(r=>L.push(C.map(c=>{ let v; try{v=c.get(r);}catch(e){v='';}
    return csvCell(v==null?'':v,sep); }).join(sep)));
  return '﻿'+L.join('\r\n')+'\r\n';
}
function buildDict(sep,pii){
  const C=columns(pii), L=[['variable','libelle','codage'].map(x=>csvCell(x,sep)).join(sep)];
  C.forEach(c=>L.push([c.k,c.l,c.codes].map(x=>csvCell(x,sep)).join(sep)));
  return '﻿'+L.join('\r\n')+'\r\n';
}
function parseCSV(txt,sep){
  txt=txt.replace(/^﻿/,''); const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<txt.length;i++){ const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===sep){ row.push(cur); cur=''; }
    else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else if(c!=='\r') cur+=c;
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.length>1||r[0]!=='');
}

let idb=null;
function openDB(){ return new Promise((res,rej)=>{
  /* version 2 : ajout du magasin "media", qui reçoit les photos et vidéos
     de démonstration attachées aux aides à l'examen. Les fiches ne bougent pas. */
  const rq=indexedDB.open('fiche_neuro',2);
  rq.onupgradeneeded=e=>{ const db=e.target.result;
    if(!db.objectStoreNames.contains('fiches')) db.createObjectStore('fiches',{keyPath:'id'});
    if(!db.objectStoreNames.contains('meta'))   db.createObjectStore('meta',{keyPath:'k'});
    if(!db.objectStoreNames.contains('media'))  db.createObjectStore('media',{keyPath:'id'}); };
  rq.onsuccess=e=>{idb=e.target.result;res();}; rq.onerror=e=>rej(e); }); }
const tx=(st,mode)=>idb.transaction(st,mode).objectStore(st);
function idbAll(){ return new Promise(r=>{ const q=tx('fiches','readonly').getAll(); q.onsuccess=()=>r(q.result||[]); q.onerror=()=>r([]); }); }
function idbPut(o){ return new Promise(r=>{ const q=tx('fiches','readwrite').put(o); q.onsuccess=()=>r(1); q.onerror=()=>r(0); }); }
function idbDel(id){ return new Promise(r=>{ const q=tx('fiches','readwrite').delete(id); q.onsuccess=()=>r(1); q.onerror=()=>r(0); }); }
function metaGet(k){ return new Promise(r=>{ const q=tx('meta','readonly').get(k); q.onsuccess=()=>r(q.result?q.result.v:null); q.onerror=()=>r(null); }); }
function metaSet(k,v){ return new Promise(r=>{ const q=tx('meta','readwrite').put({k:k,v:v}); q.onsuccess=()=>r(1); q.onerror=()=>r(0); }); }
/* médias d'aide : images et vidéos attachées à un item d'examen */
function medAll(){ return new Promise(r=>{ const q=tx('media','readonly').getAll(); q.onsuccess=()=>r(q.result||[]); q.onerror=()=>r([]); }); }
function medPut(o){ return new Promise(r=>{ const q=tx('media','readwrite').put(o); q.onsuccess=()=>r(1); q.onerror=()=>r(0); }); }
function medDel(id){ return new Promise(r=>{ const q=tx('media','readwrite').delete(id); q.onsuccess=()=>r(1); q.onerror=()=>r(0); }); }


/* renumerote num_ex pour chaque dossier, et persiste, apres toute modification de la base */
async function renumberAll(){
  const by={};
  DB.forEach(f=>{ const k=f.d.dossier||''; if(!k) return; (by[k]=by[k]||[]).push(f); });
  const changed=[];
  Object.keys(by).forEach(k=>{
    by[k].sort((a,b)=>stamp(a).localeCompare(stamp(b)))
         .forEach((f,i)=>{ if(f.d.num_ex!==i+1){ f.d.num_ex=i+1; changed.push(f); } });
  });
  for(const f of changed) await idbPut(f);
  if(changed.length) DB = await idbAll();
}
/* ordre du fichier statistique : par dossier, puis chronologique */
function sortedDB(){
  return DB.slice().sort((a,b)=>{
    const c=String(a.d.dossier||'').localeCompare(String(b.d.dossier||''),'fr',{numeric:true});
    return c!==0 ? c : stamp(a).localeCompare(stamp(b));
  });
}

let DIR=null, DIRSTATE='none';   // none | ok | need | unsupported
const FSA = typeof window.showDirectoryPicker === 'function';

async function connectFile(){
  if(!FSA){ modalHTML('<h3>Ecriture directe non disponible sur ce navigateur</h3>'+
    '<div class="note">Ce navigateur ne gere pas l\'ecriture directe dans un dossier (API File System Access). '+
    'Elle fonctionne sur <b>Chrome</b> et <b>Edge</b> sur ordinateur.<br><br>'+
    'Ici, les fiches restent enregistrees dans le navigateur et vous produisez le fichier '+
    'de donnees avec le bouton <b>Exporter</b>. C\'est le mode prevu pour la saisie sur tablette : '+
    'vous exportez un CSV partiel, puis vous le fusionnez sur le poste principal.</div>'+
    '<button class="tb pri" onclick="closeModal();openExport()">Aller a l\'export</button>'); return; }
  try{
    DIR = await window.showDirectoryPicker({mode:'readwrite', id:'ficheneuro'});
    await metaSet('dir',DIR); DIRSTATE='ok';
    await writeDataFiles(true);
    toast('Dossier de donnees connecte');
  }catch(e){ if(e && e.name!=='AbortError') toast('Connexion annulee'); }
  updateBar();
}
async function restoreDir(){
  if(!FSA){ DIRSTATE='unsupported'; return; }
  const h=await metaGet('dir'); if(!h) return;
  DIR=h;
  try{ const p=await h.queryPermission({mode:'readwrite'}); DIRSTATE = p==='granted'?'ok':'need'; }
  catch(e){ DIRSTATE='need'; }
}
async function regrant(){
  if(!DIR) return connectFile();
  try{ const p=await DIR.requestPermission({mode:'readwrite'});
    if(p==='granted'){ DIRSTATE='ok'; await writeDataFiles(true); toast('Dossier reconnecte'); }
  }catch(e){ toast('Acces refuse'); }
  updateBar();
}
async function writeFileIn(name,txt){
  const fh=await DIR.getFileHandle(name,{create:true});
  const w=await fh.createWritable(); await w.write(new Blob([txt],{type:'text/plain;charset=utf-8'})); await w.close();
}
async function writeDataFiles(silent){
  if(DIRSTATE!=='ok'||!DIR) return false;
  try{
    const recs=sortedDB();
    await writeFileIn('donnees_neuro.csv', buildCSV(recs,SET.sep,SET.pii));
    await writeFileIn('dictionnaire_variables.csv', buildDict(SET.sep,SET.pii));
    await writeFileIn('sauvegarde_neuro.json', JSON.stringify({format:'fiche-neuro-v1',exported:new Date().toISOString(),fiches:recs},null,1));
    if(!silent) toast('Fichier de donnees mis a jour');
    return true;
  }catch(e){ DIRSTATE='need'; updateBar(); if(!silent) toast('Ecriture impossible : '+e.message); return false; }
}

function dl(name,txt){
  /* Dans un WebView natif, <a download> et les URL blob ne declenchent aucun
     telechargement. On ecrit alors le fichier dans les documents de
     l'application puis on ouvre la feuille de partage du systeme. */
  const C = window.Capacitor && window.Capacitor.Plugins;
  if(C && C.Filesystem){
    (async()=>{
      try{
        const r = await C.Filesystem.writeFile({
          path: name, data: txt, directory: 'DOCUMENTS', encoding: 'utf8', recursive: true });
        if(C.Share){
          await C.Share.share({ title: name, url: r.uri,
            dialogTitle: 'Enregistrer ou envoyer ' + name });
        }else{
          toast('Enregistre dans les documents : ' + name);
        }
      }catch(e){ toast('Enregistrement impossible : ' + e); }
    })();
    return;
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
  a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}

function migrateKey(h){
  // v1 : zonage anatomique effleurement / douleur / vibratoire -> plus d'equivalent metamerique
  if(/^sens_(eff|dou|vib)_/.test(h)) return null;
  // v2-v3 : zonage anatomique epicritique / thermoalgique -> plus d'equivalent metamerique
  if(/^sens_(epi|tha)_/.test(h)) return null;
  // v3 : myotomes renommes selon la nomenclature ASIA
  const m = /^(f_biceps|f_quadri|f_releveur)_(D|G)$/.exec(h);
  if(m) return MYO_MIGR[m[1]]+'_'+m[2];
  return h;
}
const MULTIKEYS = (function(){ const s={}; SPEC.forEach(sec=>sec.f.forEach(f=>{ if(f.t==='multi') s[f.k]=f.o.map(o=>o.v); })); return s; })();

function recFromRow(head0,row){
  const rec={id:'',created:'',updated:'',d:{}};
  const head = head0.map(migrateKey);
  head.forEach((h,i)=>{
    if(h==null) return;
    const raw=(row[i]==null?'':String(row[i]).trim());
    if(h==='fiche_id'){ rec.id=raw; return; }
    if(h==='created'||h==='updated'){ rec[h]=raw; return; }
    if(h==='poste') return;
    if(MULTIKEYS[h]){ if(raw) rec.d[h]=raw.split('|').filter(Boolean); return; }
    if(Object.keys(MULTIKEYS).some(k=>h.indexOf(k+'_')===0 && MULTIKEYS[k].indexOf(h.slice(k.length+1))>=0)) return;
    if(raw==='') return;
    if(NUMKEYS.has(h)){ const n=Number(raw.replace(',','.'));
      // 0 vaut « absent de cotation » pour les reliefs, les schemas et les qualites de reflexe : on ne le stocke pas.
      // En revanche 0 est une valeur CLINIQUE pour un metamere (sensibilite absente) : on la conserve.
      if(!isNaN(n)){ if(n!==0 || !ZERODROP.has(h)) rec.d[h]=n; } }
    else rec.d[h]=raw;
  });
  if(!rec.id) rec.id='F'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,6).toUpperCase();
  if(!rec.created) rec.created=new Date().toISOString();
  if(!rec.updated) rec.updated=rec.created;
  return rec;
}

function openImport(){
  modalHTML('<h3>Importer et fusionner</h3>'+
  '<div class="note">Deposez ici un fichier produit par cet outil sur un autre poste : '+
  'sauvegarde <b>.json</b> (recommandee, sans perte) ou <b>.csv</b> des donnees. '+
  'La fusion se fait sur <code>fiche_id</code> : une fiche deja presente est remplacee seulement si la version importee est plus recente. '+
  'Rien n\'est jamais supprime.</div>'+
  '<input type="file" id="impFile" accept=".json,.csv,.txt" multiple onchange="doImport(this.files)">'+
  '<div id="impRes" style="margin-top:12px"></div>');
}
async function doImport(files){
  let add=0,upd=0,same=0,err=0,seen=0;
  for(const file of files){
    let txt; try{ txt=await file.text(); }catch(e){ err++; continue; }
    let recs=[];
    if(/\.json$/i.test(file.name)){
      try{ const o=JSON.parse(txt); recs=Array.isArray(o)?o:(o.fiches||[]); }catch(e){ err++; continue; }
    } else {
      const first=(txt.replace(/^﻿/,'').split(/\r?\n/)[0]||'');
      const sep = first.split(';').length>first.split(',').length ? ';' : (first.indexOf('\t')>=0?'\t':',');
      const rows=parseCSV(txt,sep); if(rows.length<2){ err++; continue; }
      const head=rows[0].map(h=>h.trim());
      recs=rows.slice(1).filter(r=>r.join('').trim()!=='').map(r=>recFromRow(head,r));
    }
    for(const r of recs){
      if(!r||!r.d){ err++; continue; }
      seen++;
      const cur=DB.find(x=>x.id===r.id);
      if(!cur){ await idbPut(r); add++; }
      else if((r.updated||'')>(cur.updated||'')){ await idbPut(r); upd++; }
      else same++;
    }
  }
  DB=await idbAll(); await renumberAll(); await writeDataFiles(true); renderList(); renderForm(); updateBar();
  const resEl=$('#impRes'); if(!resEl) return;
  resEl.innerHTML='<div class="note" style="background:#e6f4ec;border-color:#9ccdb3">'+
    '<b>Fusion terminee.</b><br>'+seen+' fiche(s) lue(s)<br>'+add+' ajoutee(s)<br>'+upd+' mise(s) a jour (version importee plus recente)<br>'+
    same+' deja a jour, ignoree(s)<br>'+err+' fichier(s) ou ligne(s) illisible(s)<br><br>Base locale : <b>'+DB.length+'</b> fiche(s).</div>';
}

function randSalt(){
  const a = new Uint8Array(24); crypto.getRandomValues(a);
  return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function testScanRe(){
  const re=$('#setScanRe'), t=$('#setScanTest'), out=$('#scanPrev');
  if(!re||!t||!out) return;
  const v=t.value.trim();
  if(!v){ out.innerHTML='<span style="color:#8a94a3">Saisissez un code pour voir le résultat.</span>'; return; }
  if(!re.value){ out.innerHTML='Résultat : <b>'+esc(v)+'</b> <span style="color:#5a6472">(aucune règle, code pris tel quel)</span>'; return; }
  try{
    const m=new RegExp(re.value).exec(v);
    out.innerHTML = m ? 'Résultat : <b style="color:#1f7a4d">'+esc(m[1]!=null?m[1]:m[0])+'</b>'
                      : '<span style="color:#a32020">La règle ne correspond pas à ce code.</span>';
  }catch(e){ out.innerHTML='<span style="color:#a32020">Expression régulière invalide : '+esc(e.message)+'</span>'; }
}
function genSalt(){ const i=$('#setSalt'); if(i){ i.value=randSalt(); toast('Sel généré, pensez à le sauvegarder'); } }
function copySalt(){ const i=$('#setSalt'); if(!i||!i.value) return;
  navigator.clipboard.writeText(i.value).then(()=>toast('Sel copié'),()=>toast('Copie impossible')); }
function dlSalt(){ const i=$('#setSalt'); if(!i||!i.value){ toast('Aucun sel à enregistrer'); return; }
  dl('sel_fiche_neuro_'+today()+'.txt',
     "Sel secret de pseudonymisation - fiche d'examen neurologique\n"+
     "Genere le "+new Date().toISOString()+"\n\n"+i.value+"\n\n"+
     "A conserver hors du dossier de donnees. A saisir a l'identique sur chaque poste.\n");
  toast('Sel téléchargé'); }
async function saveScanSettings(){
  const w=$('#setWedge'), r=$('#setScanRe'), h=$('#setHash'), sa=$('#setSalt');
  if(!w||!r||!h||!sa) return;
  if(r.value){ try{ new RegExp(r.value); }catch(e){ toast("Expression régulière invalide"); return; } }
  if(h.checked && !sa.value.trim()){ toast('Définissez un sel avant d\'activer la pseudonymisation'); return; }
  SET.wedge=w.checked; SET.scanRe=r.value.trim(); SET.hash=h.checked; SET.salt=sa.value.trim();
  await metaSet('settings',{poste:SET.poste,sep:SET.sep,pii:SET.pii,wedge:SET.wedge,scanRe:SET.scanRe,hash:SET.hash,hashLen:SET.hashLen});
  await metaSet('salt', SET.salt);
  closeModal(); renderForm(); toast('Réglages enregistrés');
}

/* =====================================================================
   PWA : manifeste, service worker, installation
   Le fichier HTML unique reste utilisable tel quel en double-clic
   (protocole file://). Les liens vers le manifeste et le service worker
   ne sont poses que si la page est servie en http(s), sinon le navigateur
   leverait une erreur sur des ressources absentes.
   ===================================================================== */
let PWA_PROMPT = null;      // evenement beforeinstallprompt mis en attente
let SW_REG     = null;      // enregistrement du service worker
let SW_WAITING = null;      // version en attente d'activation

function pwaNative(){ return !!(window.Capacitor || window.cordova); }
function pwaWeb(){
  if(pwaNative()) return false;   // l'application native embarque deja tout le code
  return location.protocol === 'http:' || location.protocol === 'https:';
}
function pwaInstalled(){
  return window.matchMedia('(display-mode: standalone)').matches ||
         window.matchMedia('(display-mode: fullscreen)').matches ||
         window.navigator.standalone === true;
}
function pwaIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
         (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

function initPWA(){
  if(!pwaWeb()) return;
  const head = document.head;
  const lk = (rel,href,extra) => {
    const l = document.createElement('link');
    l.rel = rel; l.href = href;
    if(extra) Object.keys(extra).forEach(k=>l.setAttribute(k,extra[k]));
    head.appendChild(l);
  };
  lk('manifest','manifest.webmanifest');
  lk('apple-touch-icon','icons/apple-touch-icon.png',{sizes:'180x180'});

  window.addEventListener('beforeinstallprompt', e=>{
    e.preventDefault(); PWA_PROMPT = e; updateBar();
  });
  window.addEventListener('appinstalled', ()=>{
    PWA_PROMPT = null; updateBar(); toast('Application installée');
  });

  if(!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('sw.js').then(reg=>{
    SW_REG = reg;
    if(reg.waiting){ SW_WAITING = reg.waiting; updateBar(); }
    reg.addEventListener('updatefound', ()=>{
      const nw = reg.installing; if(!nw) return;
      nw.addEventListener('statechange', ()=>{
        if(nw.state === 'installed' && navigator.serviceWorker.controller){
          SW_WAITING = nw; updateBar();
          toast('Mise à jour disponible — menu « Installation »');
        }
      });
    });
  }).catch(()=>{ /* hors ligne ou service worker refuse : sans effet */ });

  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(reloaded) return; reloaded = true; location.reload();
  });
}

async function pwaInstall(){
  if(!PWA_PROMPT){ openInstall(); return; }
  PWA_PROMPT.prompt();
  try{ await PWA_PROMPT.userChoice; }catch(e){}
  PWA_PROMPT = null; updateBar();
}
function pwaUpdate(){
  if(!SW_WAITING){ toast('Aucune mise à jour en attente'); return; }
  SW_WAITING.postMessage({type:'SKIP_WAITING'});
}
async function pwaClearCache(){
  if(!('caches' in window)) { toast('Cache non disponible'); return; }
  const ks = await caches.keys();
  await Promise.all(ks.map(k=>caches.delete(k)));
  if(SW_REG) await SW_REG.unregister();
  toast('Cache vidé — rechargement');
  setTimeout(()=>location.reload(true), 700);
}

         'Menu &#8942; puis <b>Installer l\'application</b> ou <b>Ajouter à l\'écran d\'accueil</b>.</p>'+
         '<p><b>Ordinateur (Chrome, Edge)</b><br>'+
         'Icône d\'installation à droite de la barre d\'adresse, ou menu &#8942; &rsaquo; <b>Installer</b>.</p>'+
         '<div class="note">Si rien n\'apparaît, la page n\'est pas servie en HTTPS ou l\'application est déjà installée.</div>';
  }

  if(pwaWeb()){
    h += '<h4 style="margin:14px 0 6px">Mises à jour</h4>'+
         '<p>'+ (SW_WAITING
           ? '<b>Une nouvelle version est prête.</b> '+
             '<button class="tb pri" onclick="pwaUpdate()">Appliquer maintenant</button>'
           : 'Aucune mise à jour en attente. L\'application vérifie à chaque ouverture connectée.') + '</p>'+
         '<p><button class="tb" onclick="pwaClearCache()">Vider le cache et recharger</button> '+
         '<small style="color:var(--ink2)">Les fiches enregistrées ne sont pas touchées : '+
         'elles vivent dans la base locale, pas dans le cache.</small></p>';
  }
  modalHTML(h);
}

/* =====================================================================
   INITIALISATION
   ===================================================================== */
async function saveDraft(){ if(DIRTY && REC) await metaSet('draft',JSON.parse(JSON.stringify(REC))); }

(async function init(){
  $('#patholder').innerHTML = patternDefs();
  try{ await openDB(); }catch(e){ alert("Impossible d'ouvrir la base locale du navigateur : "+e); }
  DB = await idbAll();
  await loadMedia();
  const s = await metaGet('settings');
  if(s){ SET.poste=s.poste||''; SET.sep=s.sep||';'; SET.pii=!!s.pii;
         SET.wedge = s.wedge!==false; SET.scanRe=s.scanRe||''; SET.hash=!!s.hash; SET.hashLen=s.hashLen||12; }
  SET.salt = (await metaGet('salt')) || '';
  await restoreDir();
  const wantNew = /[?&]action=new\b/.test(location.search);
  const draft = await metaGet('draft');
  if(!wantNew && draft && draft.d && Object.keys(draft.d).length>2){ REC=draft; DIRTY=true; }
  else REC=blank();
  renderForm(); renderList(); updateBar();
  initPWA();
  setInterval(saveDraft,4000);
})();

window.addEventListener('beforeprint',()=>{ if(REC){ computeAll(); $('#print-root').innerHTML=buildPrint(); } });
window.addEventListener('beforeunload',e=>{ if(DIRTY){ e.preventDefault(); e.returnValue=''; } });
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){ e.preventDefault(); saveFiche(); }
  if(e.key==='Escape') closeModal();
});

/* =====================================================================
   AIDE À L'EXAMEN : fenêtre par item, et médiathèque locale
   Les photos et vidéos vivent dans le magasin "media" de la base locale
   du poste. Elles ne partent dans aucun export de fiches et n'apparaissent
   ni sur le PDF ni dans le CSV.
   ===================================================================== */
let MEDIA = [];                 // cache mémoire du magasin
const MURL = {};                // URL d'objet par identifiant de média

function helpBtn(key){
  if(!key || !HELP[key]) return '';
  return '<button class="hb" title="'+esc(HELP[key].t)+'" onclick="event.stopPropagation();openHelpItem(\''+key+'\')">?</button>';
}
async function loadMedia(){ try{ MEDIA = await medAll(); }catch(e){ MEDIA = []; } }
function mediaFor(key){ return MEDIA.filter(m=>m.key===key); }
function medURL(m){
  if(!MURL[m.id]) MURL[m.id] = URL.createObjectURL(m.blob);
  return MURL[m.id];
}
function mediaHTML(key){
  const ms = mediaFor(key);
  if(!ms.length) return '';
  return '<h4 style="margin:14px 0 6px">Vos médias ('+ms.length+')</h4>'+
    ms.map(m=>'<figure style="margin:0 0 10px">'+
      (m.type.indexOf('video')===0
        ? '<video src="'+medURL(m)+'" controls playsinline style="width:100%;max-height:44vh;background:#000;border-radius:6px"></video>'
        : '<img src="'+medURL(m)+'" alt="'+esc(m.name)+'" style="width:100%;border-radius:6px;border:1px solid var(--bd)">')+
      '<figcaption style="display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--ink2);margin-top:3px">'+
      esc(m.name)+' · '+Math.round(m.size/1024)+' ko'+
      '<button class="mini" style="margin-left:auto" onclick="delMedia(\''+m.id+'\',\''+key+'\')">supprimer</button>'+
      '</figcaption></figure>').join('');
}
function openHelpItem(key){
  const H = HELP[key]; if(!H){ toast('Aide indisponible'); return; }
  modalHTML('<h3>'+esc(H.t)+'</h3>'+
    '<div class="helpdoc">'+H.h+'</div>'+
    (H.svg && HELP_SVG[H.svg] ? '<div style="text-align:center;margin:12px 0">'+HELP_SVG[H.svg]+'</div>' : '')+
    '<div id="helpmedia">'+mediaHTML(key)+'</div>'+
    '<div class="note" style="margin-top:12px">'+
    '<b>Ajouter une photo ou une vidéo de démonstration.</b><br>'+
    '<input type="file" accept="image/*,video/*" id="mfile" style="margin-top:6px" onchange="addMedia(\''+key+'\')">'+
    '<br><span style="color:var(--ink2)">Le fichier reste sur ce poste, dans la base locale du navigateur. '+
    'Il n\'entre ni dans le PDF, ni dans le fichier de données, ni dans les sauvegardes de fiches. '+
    'Le menu <b>Aides à l\'examen</b> permet d\'exporter la médiathèque pour la copier sur un autre poste.</span></div>');
}
async function addMedia(key){
  const el = $('#mfile'); if(!el || !el.files || !el.files[0]) return;
  const f = el.files[0];
  if(f.size > 80*1024*1024){ toast('Fichier trop lourd (80 Mo maximum)'); el.value=''; return; }
  const rec = {id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
               key:key, name:f.name, type:f.type||'application/octet-stream', size:f.size,
               added:new Date().toISOString(), blob:f};
  await medPut(rec); await loadMedia();
  const box = $('#helpmedia'); if(box) box.innerHTML = mediaHTML(key);
  el.value=''; toast('Média ajouté');
}
async function delMedia(id,key){
  if(!confirm('Supprimer ce média ?')) return;
  await medDel(id);
  if(MURL[id]){ URL.revokeObjectURL(MURL[id]); delete MURL[id]; }
  await loadMedia();
  const box = $('#helpmedia'); if(box) box.innerHTML = mediaHTML(key);
  const lib = $('#liblist'); if(lib) lib.innerHTML = libList();
  toast('Média supprimé');
}

/* ---------- médiathèque ---------- */
function libList(){
  const keys = Object.keys(HELP);
  return '<table class="ptab" style="width:100%;font-size:12.5px"><thead><tr>'+
    '<th>Item d\'examen</th><th style="width:70px">Médias</th><th style="width:90px"></th></tr></thead><tbody>'+
    keys.map(k=>{ const n=mediaFor(k).length;
      return '<tr><td>'+esc(HELP[k].t)+'</td>'+
        '<td style="text-align:center">'+(n? '<b>'+n+'</b>' : '—')+'</td>'+
        '<td><button class="mini" onclick="openHelpItem(\''+k+'\')">ouvrir</button></td></tr>'; }).join('')+
    '</tbody></table>';
}
function openHelpLib(){
  const tot = MEDIA.reduce((s,m)=>s+m.size,0);
  modalHTML('<h3>Aides à l\'examen</h3>'+
    '<p style="margin:0 0 10px;color:var(--ink2);font-size:12.5px">'+
    Object.keys(HELP).length+' fiches techniques. Le bouton <b>?</b> à côté d\'un item ouvre la sienne. '+
    'Vous pouvez y attacher vos propres photos et vidéos de signes positifs.</p>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">'+
    '<button class="tb" onclick="exportMedia()">&#11015; Exporter la médiathèque</button>'+
    '<label class="tb" style="cursor:pointer">&#11014; Importer une médiathèque'+
    '<input type="file" accept="application/json,.json" style="display:none" onchange="importMedia(this)"></label>'+
    '<span style="font-size:11.5px;color:var(--ink2);align-self:center">'+
    MEDIA.length+' média'+(MEDIA.length>1?'s':'')+' · '+(tot/1048576).toFixed(1)+' Mo</span></div>'+
    '<div id="liblist" style="max-height:52vh;overflow:auto">'+libList()+'</div>');
}
const blob2data = b => new Promise(r=>{ const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(b); });
async function exportMedia(){
  if(!MEDIA.length){ toast('Aucun média à exporter'); return; }
  toast('Préparation de l\'export…');
  const out = [];
  for(const m of MEDIA)
    out.push({id:m.id,key:m.key,name:m.name,type:m.type,size:m.size,added:m.added,data:await blob2data(m.blob)});
  const txt = JSON.stringify({format:'fiche_neuro_media', v:1, media:out}, null, 0);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
  a.download='mediatheque_aides_'+today()+'.json';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}
async function importMedia(input){
  const f = input.files && input.files[0]; if(!f) return;
  try{
    const o = JSON.parse(await f.text());
    if(o.format!=='fiche_neuro_media' || !Array.isArray(o.media)) throw new Error('format inattendu');
    let n=0;
    for(const m of o.media){
      const res = await fetch(m.data); const blob = await res.blob();
      await medPut({id:m.id,key:m.key,name:m.name,type:m.type,size:m.size,added:m.added,blob:blob});
      n++;
    }
    await loadMedia();
    const lib=$('#liblist'); if(lib) lib.innerHTML=libList();
    toast(n+' média'+(n>1?'s':'')+' importé'+(n>1?'s':''));
  }catch(e){ alert('Import impossible : '+e.message); }
  input.value='';
}

</script>
