    const fi = secFill(s), closed = CLOSED[s.id]?' closed':'';
    h+='<div class="sec'+closed+'" id="s_'+s.id+'"><h3 onclick="if(!event.target.closest(\'button\'))toggleSec(\''+s.id+'\')">'+
       '<span class="caret">&#9660;</span>'+esc(s.t)+
       '<span class="fill">'+(s.norm?'<button class="mini" onclick="applyNormal(\''+s.id+'\')">tout normal</button>':'')+
       '<span class="badge'+(fi.done===fi.tot&&fi.tot>0?' ok':'')+'" id="b_'+s.id+'">'+fi.done+'/'+fi.tot+'</span></span></h3>'+
       '<div class="body">'+(s.note?'<div class="note">'+esc(s.note)+'</div>':'')+
       '<div class="'+(s.cols===2?'grid2':'')+'">'+fieldsHTML(s)+'</div>'+
       (s.tail? s.tail() : '')+'</div></div>';
  });

  h += pageNav();

  h += '<div class="sec" id="s_syn"><h3 onclick="if(!event.target.closest(\'button\'))toggleSec(\'syn\')">'+
       '<span class="caret">&#9660;</span>Synthèse rédigée (générée automatiquement)'+
       '<span class="fill"><button class="mini" onclick="copySynth()">copier le texte</button></span></h3>'+
       '<div class="body"><div id="synth"></div></div></div>';

  $('#form').innerHTML = h;
  buildNav(); renderSynth(); updateGlobalFill();
}

/* =====================================================================
   NAVIGATION EN QUATRE PAGES
   La fiche est longue : on la découpe en quatre temps qui suivent l'ordre
   réel de la consultation. Les sections propres à la prise en charge
   initiale disparaissent des fiches de suivi.
   ===================================================================== */
const PAGES = [
 {n:1, l:'Anamnèse et plongée',  s:'accueil, plongeur, plongée, facteurs, contacts',
  l2:'Identification',           s2:'la plongée reste sur la fiche initiale'},
 {n:2, l:'Examen général',       s:'constantes, conscience, ORL, cutané'},
 {n:3, l:'Examen neurologique',  s:'réflexes, force, sensibilités, scores, conclusion'},
 {n:4, l:'Conclusion',           s:'recompression, actes, examens, traitements, diagnostic'}
];
let PAGE = 1;
let TYPE_PROPOSE = false;   /* le type a ete deduit du rang de l'examen */
let TYPE_CHOISI  = false;   /* le praticien a cliqué le type lui-même */

function ftype(){ return REC.d.fiche_type || 1; }
/* une section s'affiche si elle concerne ce type de consultation */
function secForType(s){ return (!s.only || s.only.indexOf(ftype()) >= 0) && (!s.when || s.when()); }
function secOnPage(s, n){ return (s.page||1) === n && secForType(s); }
function pageSections(n){ return SPEC.filter(s=>secOnPage(s,n)); }

function goPage(n){
  n = Math.max(1, Math.min(PAGES.length, n));
  if(n === PAGE) return;
  PAGE = n; renderForm(); window.scrollTo(0,0);
}
function pageFill(n){
  let done=0, tot=0;
  pageSections(n).forEach(s=>{ const f=secFill(s); done+=f.done; tot+=f.tot; });
  return {done:done, tot:tot};
}
function pageLab(pg){ return (ftype()!==1 && pg.l2) ? pg.l2 : pg.l; }
function pageSub(pg){ return (ftype()!==1 && pg.s2) ? pg.s2 : pg.s; }
function pageBar(){
  return '<div id="pagebar">'+PAGES.map(pg=>{
    const f = pageFill(pg.n), plein = f.tot>0 && f.done===f.tot;
    return '<button class="wtab'+(PAGE===pg.n?' on':'')+(plein?' full':'')+'" onclick="goPage('+pg.n+')">'+
      '<b>'+pg.n+'. '+esc(pageLab(pg))+'</b>'+
      '<small>'+esc(pageSub(pg))+'</small>'+
      '<span class="pcount">'+f.done+'/'+f.tot+'</span></button>';
  }).join('')+'</div>';
}
function pageNav(){
  const prev = PAGE>1, next = PAGE<PAGES.length;
  return '<div id="pagenav">'+
    (prev? '<button class="tb" onclick="goPage('+(PAGE-1)+')">&#9668; Précédent'+
           '<small class="nophone" style="opacity:.7"> · '+esc(pageLab(PAGES[PAGE-2]))+'</small></button>'
         : '<span></span>')+
    '<span class="pmid">Page '+PAGE+' sur '+PAGES.length+'</span>'+
    (next? '<button class="tb pri" onclick="goPage('+(PAGE+1)+')">Suivant'+
           '<small class="nophone" style="opacity:.75"> · '+esc(pageLab(PAGES[PAGE]))+'</small> &#9658;</button>'
         : '<button class="tb gd" onclick="saveFiche()">&#128190; Enregistrer la fiche</button>')+
    '</div>';
}

/* ---------- navigation par sections (téléphone) ---------- */
function navSections(){
  return pageSections(PAGE).map(s=>({id:s.id, t:s.t}));
}

function buildNav(){
  const sel=$('#navsel'); if(!sel) return;
  const secs=navSections();
  sel.innerHTML = secs.map((x,i)=>'<option value="'+x.id+'">'+(i+1)+'. '+esc(x.t)+'</option>').join('');
}
function navGo(id){
  const el=document.getElementById('s_'+id); if(!el) return;
  if(el.classList.contains('closed')) toggleSec(id);
  el.scrollIntoView({behavior:'smooth',block:'start'});
  const sel=$('#navsel'); if(sel) sel.value=id;
}
function navStep(d){
  const secs=navSections(), sel=$('#navsel'); if(!sel||!secs.length) return;
  let i=secs.findIndex(x=>x.id===sel.value); if(i<0) i=0;
  i=Math.max(0,Math.min(secs.length-1,i+d));
  navGo(secs[i].id);
}
function toggleSec(id){ CLOSED[id]=!CLOSED[id]; const e=$('#s_'+id); if(e) e.classList.toggle('closed'); }
function toggleSide(){ $('#side').classList.toggle('hide'); }

function updateGlobalFill(){
  let d=0,t=0; SPEC.forEach(s=>{ if(s.custom&&s.id==='subj') return; if(!secForType(s)) return;
    const f=secFill(s); d+=f.done; t+=f.tot;});
  const A=anomalies();
  const el=$('#globalfill');
  if(el) el.innerHTML='<span class="badge'+(A.length?' ab':' ok')+'">'+
    (A.length? (A.length>1? A.length+' items anormaux' : '1 item anormal') : 'aucune anomalie')+'</span> '+
    '<span class="badge'+(d===t?' ok':'')+'">Complétude : '+d+'/'+t+'</span>';
  const w=$('#coher');
  if(w) w.innerHTML = (REC.d.conclusion===1 && A.length)
    ? '<div class="note" style="background:#fbeaea;border-color:#e0a5a5;margin:0 0 10px"><b>Incohérence à vérifier.</b> '+
      'La conclusion est « examen neurologique normal » alors que '+A.length+' item'+(A.length>1?'s sont anormaux':' est anormal')+' : '+
      esc(A.slice(0,8).join(', '))+(A.length>8?'…':'')+'.</div>' : '';
}

/* Un champ devenu sans objet ne doit pas garder une valeur fantôme dans le fichier
   de données : on efface les champs dont la condition d'affichage n'est plus remplie. */
function pruneDeps(){
  const d = REC.d;
  /* l'échographie n'existe que si l'examen est coché OUI : sinon ses 24 zones n'ont pas d'objet */
  if(d.im_echopp!==1) echoKeys().forEach(k=>{ delete d[k]; });
  /* le diagnostic principal doit rester l'un des diagnostics retenus */
  if(d.dg_principal!=null && (!Array.isArray(d.dg_liste) || d.dg_liste.indexOf(d.dg_principal)<0)) delete d.dg_principal;
  let again = true, guard = 0;
  while(again && guard++ < 6){
    again = false;
    Object.keys(FIELDS).forEach(k=>{
      const f = FIELDS[k];
      if((f.dep || f.depFn) && !depOK(f) && d[k]!=null){ delete d[k]; again = true; }
    });
  }
}

/* ---------- mise à jour des valeurs ---------- */
/* Valeurs proposées d'office quand une réponse est choisie. Elles ne remplacent
   jamais une valeur déjà saisie et restent modifiables : oxygène normobare
   « OUI » propose un débit de 15 L/min, (méthyl)prednisolone « OUI » une durée de 3 jours. */
const AUTOFILL = { soin_o2:{1:{soin_o2_debit:DEF_O2_DEBIT}},
                   rx_o2:{1:{rx_o2_mode:1, rx_o2_debit:DEF_O2_DEBIT}},
                   rx_o2_mode:{1:{rx_o2_debit:DEF_O2_DEBIT}},
                   rx_solu:{1:{rx_solu_jours:DEF_CORTICO_JOURS}},
                   pl_reimm_type:{1:{pl_rr_duree:RR_DUREE, pl_rr_pal6:PAL_RR.p6, pl_rr_pal3:PAL_RR.p3},
                                  2:{pl_rr_pal6:PAL_RR.p6, pl_rr_pal3:PAL_RR.p3}} };

/* Valeurs calculées mais modifiables : l'heure de fin de la table, la dose de corticoïde, le
   texte de l'ECG. On mémorise la dernière valeur proposée (clé « <k>_auto »). Tant que le champ
   est vide ou égal à elle, un nouveau calcul le met à jour ; dès qu'il a été modifié à la main,
   le calcul n'y touche plus. Un champ que l'on est en train de vider n'est pas rempli
   dans son dos : il le sera au prochain calcul, une fois la main levée. */
function autoSync(k, val){
  const d = REC.d, ak = k+'_auto';
  if(val==null || val===''){
    if(d[k]!=null && d[k]===d[ak]) delete d[k];
    delete d[ak]; return;
  }
  const ae = document.activeElement, enCours = !!(ae && ae.id==='i_'+k);
  if(d[k]==null || d[k]==='') { if(!enCours) d[k] = val; }
  else if(d[k]===d[ak]) d[k] = val;
  d[ak] = val;
}
/* les champs correspondants à l'écran suivent le calcul, sauf celui qui a le focus */
const AUTOKEYS = ['tb_h_fin','rx_solu_dose','ecg_txt','pl_dtr','pl_duree_tot','pl_rr_prof','pl_reimm_txt',
                  'pl_h_immersion','pl_h_depart_fond','pl_h_sortie'];
function refreshAutoFields(){
  AUTOKEYS.forEach(k=>{
    const el = document.getElementById('i_'+k);
    if(!el || el===document.activeElement) return;
    const v = REC.d[k]==null ? '' : String(REC.d[k]);
    if(el.value !== v) el.value = v;
    const p = document.getElementById('p_'+k); if(p && p.value !== v) p.value = v;
  });
}
function autofill(k){
  const a = AUTOFILL[k]; if(!a) return;
  const m = a[REC.d[k]]; if(!m) return;
  Object.keys(m).forEach(t=>{ if(REC.d[t]==null) REC.d[t] = m[t]; });
}
function setVal(k,v){ REC.d[k] = (REC.d[k]===v)?null:v; if(REC.d[k]==null) delete REC.d[k];
  const limb = Object.keys(LIMB_DEF).find(l=>LIMB_DEF[l]===k);
  if(limb){ limbAnswer(limb); pruneDeps(); touch(); renderForm(); return; }
  /* changer de type de consultation change les sections affichées */
  if(k==='im_echopp'){ pruneDeps(); touch(); renderForm(); return; }
  if(k==='fiche_type'){ TYPE_CHOISI = true; TYPE_PROPOSE = false;
                        if(ftype()===1) giveDefaults(); else dropDefaults();
                        pruneDeps(); touch(); renderForm(); return; }
  autofill(k);
  pruneDeps(); touch(); refreshField(k);
  if(ORL_KEYS.indexOf(k)>=0) refreshORL(); }
/* menu déroulant : la valeur choisie est le code de l'option, comme pour un bouton */
function setSel(k,val){
  const f = FIELDS[k]; if(!f) return;
  const o = f.o.find(x=>String(x.v)===String(val));
  if(!o) delete REC.d[k]; else REC.d[k] = o.v;
  autofill(k); pruneDeps(); touch(); refreshField(k);
}
/* case à cocher : cochée = 1, décochée = valeur absente */
function toggleCheck(k){
  if(REC.d[k]) delete REC.d[k]; else REC.d[k] = 1;
  pruneDeps(); touch(); refreshField(k);
}
let DOSSIER_T=null;
function setRaw(k,v){
  if(v==='') delete REC.d[k]; else REC.d[k]=v;

/* =====================================================================
   DOUCHETTE CODE-BARRES — écouteur global
   Une douchette USB ou Bluetooth se comporte comme un clavier : elle
   « tape » le code en quelques dizaines de millisecondes puis envoie
   Entrée. On reconnaît cette rafale et on la route vers le n° de dossier,
   quel que soit le champ qui avait le focus.
   ===================================================================== */
const WEDGE = {buf:'', last:0, start:0, el:null};
const WEDGE_GAP  = 50;  // ms au-delà desquelles on considère qu'une nouvelle rafale commence
const WEDGE_RATE = 15;  // ms par caractère au maximum, moyenne sur toute la rafale
const WEDGE_MIN  = 4;   // longueur minimale d'un code pour être pris au sérieux

/* Une douchette émet 1 à 5 ms par caractère. Un être humain, même très rapide,
   ne descend pas durablement sous 60 ms. Le critère de vitesse moyenne est donc
   ce qui distingue un scan d'une frappe, bien plus sûrement qu'un seuil par touche. */
function wedgeKey(e){
  if(!SET.wedge) return;
  if(e.ctrlKey || e.altKey || e.metaKey) return;
  const now = Date.now();
  if(e.key === 'Enter' || e.key === 'Tab'){
    const code = WEDGE.buf, n = code.length;
    WEDGE.buf = '';
    const rafale = n >= WEDGE_MIN &&
                   (now - WEDGE.last) <= WEDGE_GAP &&
                   (WEDGE.last - WEDGE.start) <= (n - 1) * WEDGE_RATE;
    if(rafale){ e.preventDefault(); e.stopPropagation(); handleScan(code, WEDGE.el); }
    return;
  }
  if(e.key.length !== 1) return;
  const ae = document.activeElement;
  // nouvelle rafale si le temps écoulé est trop long, ou si le focus a changé
  if(now - WEDGE.last > WEDGE_GAP || ae !== WEDGE.el){ WEDGE.buf=''; WEDGE.start=now; WEDGE.el=ae; }
  // une frappe trop lente pour une douchette : on repart de ce caractère
  else if(WEDGE.buf.length && (now - WEDGE.last) > WEDGE_RATE){ WEDGE.buf=''; WEDGE.start=now; }
  WEDGE.buf += e.key;
  WEDGE.last = now;
}
document.addEventListener('keydown', wedgeKey, true);

/* retire la chaîne du champ où elle est tombée par erreur, puis l'applique au dossier */
async function handleScan(raw, el){
  const dossEl = document.getElementById('i_dossier');
  if(el && el !== dossEl && el.tagName && /^(INPUT|TEXTAREA)$/.test(el.tagName)){
    const v = String(el.value || '');
    if(v.length >= raw.length && v.slice(-raw.length) === raw){
      el.value = v.slice(0, v.length - raw.length);
      const k = el.id && el.id.indexOf('i_')===0 ? el.id.slice(2) : null;
      if(k && FIELDS[k]){ if(el.value==='') delete REC.d[k]; else REC.d[k]=el.value; }
    }
  }
  await setDossierFromScan(raw);
}

/* applique un identifiant scanné ou saisi : extraction, pseudonymisation, recherche */
async function setDossierFromScan(raw){
  clearTimeout(DOSSIER_T);
  let code = String(raw||'').trim().replace(/[\u0000-\u001F\u007F]/g,'');
  if(SET.scanRe){
    try{ const m = new RegExp(SET.scanRe).exec(code); if(m) code = (m[1]!=null ? m[1] : m[0]); }
    catch(err){ toast("Règle d'extraction invalide, code pris tel quel"); }
  }
  if(!code){ toast('Code illisible'); return; }
  let val = code, pseudo = 0;
  if(SET.hash){
    const h = await pseudonymize(code);
    if(!h){ toast("Pseudonymisation impossible : sel absent ou navigateur sans crypto.subtle"); return; }
    val = h; pseudo = 1;
  }
  REC.d.dossier = val;
  REC.d.dossier_pseudo = pseudo;
  touch(); autofillFromDossier(); stampArrivee(); renderForm(); beep();
  toast(pseudo ? 'Identifiant pseudonymisé : '+val : 'Identifiant scanné : '+val);
}

/* SHA-256 salé, tronqué. Le sel n'est jamais écrit dans les fichiers exportés. */
async function pseudonymize(code){
  if(!SET.salt) return null;
  if(!(window.crypto && crypto.subtle && crypto.subtle.digest)) return null;
  try{
    const data = new TextEncoder().encode(SET.salt + '\u001F' + code);
    const buf  = await crypto.subtle.digest('SHA-256', data);
    const hex  = Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    return 'P-' + hex.slice(0, SET.hashLen||12).toUpperCase();
  }catch(e){ return null; }
}

/* court bip de confirmation, silencieux si l'audio n'est pas disponible */
function beep(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext; if(!Ctx) return;
    const c = new Ctx(), o = c.createOscillator(), g = c.createGain();
    o.type='square'; o.frequency.value=1180; g.gain.value=0.05;
    o.connect(g); g.connect(c.destination); o.start();
    setTimeout(()=>{ o.stop(); c.close(); }, 70);
  }catch(e){}
}

   et un identifiant dupliqué ferait pointer toutes les découpes vers la

let CLIPN = 0;
function dermClips(uid){

const dzRect = b => { const x0=(b[3]==null?0:b[3]), x1=(b[4]==null?100:b[4]);
  return 'M'+x0+','+b[1]+' H'+x1+' V'+b[2]+' H'+x0+' Z'; };

/* bandes d'un demi-corps pour une vue donnée */
function dermBands(view, mod, side, interactive, uid){
  return Object.keys(DZ[view]).map(part=>
    '<g clip-path="url(#clp_'+uid+'_'+part+')">'+
    DZ[view][part].map(b=>{
      const v = REC.d[dermKey(mod,b[0],side)];
      const st = v==null? null : dstate(v);
      const lv = DERM.find(x=>x.k===b[0]);
      return '<path class="mz'+(st?' on':'')+'" d="'+dzRect(b)+'"'+
        (st?' style="fill:'+st.fill+';stroke:'+st.col+';stroke-width:.9"':'')+
        ' data-k="'+dermKey(mod,b[0],side)+'" data-lvl="'+b[0]+'"'+
        ' data-lab="'+esc((lv?lv.l:b[0])+' '+side+(st?' — '+st.l:'')+(lv?' · '+lv.p:''))+'"'+
        (interactive?'':' style="pointer-events:none"')+'></path>';
    }).join('')+'</g>').join('');

/* Étiquettes de niveau. Elles sont dessinées hors des groupes miroir, sinon
   le texte de la moitié droite s'afficherait retourné : pour cette moitié,
   l'abscisse est simplement prise en miroir (200 - x). */
function dermLabels(view, half){
  const out=[], placed=[];
  const mir = x => half==='R' ? 200-x : x;
  /* une étiquette n'est posée que si la place est libre : deux bandes voisines
     et courtes produiraient sinon deux textes superposés */
  const libre = (x,y) => !placed.some(q=>Math.abs(q[0]-x)<11 && Math.abs(q[1]-y)<7);
  Object.keys(DZ[view]).forEach(part=>DZ[view][part].forEach(b=>{
    const h=b[2]-b[1]; if(h<8) return;
    const lv=DERM.find(x=>x.k===b[0]); if(!lv) return;
    const x0=(b[3]==null?0:b[3]), x1=(b[4]==null?100:b[4]);
    let cx=(x0+x1)/2, cy=(b[1]+b[2])/2;
    /* l'étiquette doit rester sur le corps : le tronc et les membres inférieurs
       vivent près de la ligne médiane, le membre supérieur à l'écart */
    if(part==='axe') cx = x1>=100 ? 90 : Math.max(cx, 78);
    if(part==='ms')  cx = Math.min(cx, 76);
    if(part==='mi')  cx = x1>=100 ? 90 : Math.max(cx, 78);
    if(!libre(cx,cy)) return;
    placed.push([cx,cy]);
    out.push('<text class="mlab" x="'+mir(cx).toFixed(1)+'" y="'+(cy+2.2).toFixed(1)+'">'+esc(lv.l)+'</text>');
  }));
  return out.join('');
}

/* =====================================================================
   RECHERCHE D'UN SUJET PAR NUMÉRO, NOM, PRÉNOM OU DATE DE NAISSANCE
   Un sujet est identifié par son numéro de dossier. Les fiches d'un même
   numéro forment une série ; c'est la plus récente qui sert de source au
   remplissage automatique de l'identité et des données de l'accident.
   ===================================================================== */
const norm = s => String(s==null?'':s).toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[^a-z0-9]+/g,' ').trim();

/* index des sujets présents dans la base locale */
function subjectIndex(){
  const by = {};
  DB.forEach(f=>{
    const k = f.d.dossier || '';
    if(!k) return;
    const s = by[k] || (by[k] = {dossier:k, n:0, last:null, nom:'', prenom:'', ddn:'', sexe:null, ads:[]});
    s.n++;
    /* numéros d'accident de plongée portés par les fiches du dossier */
    const ad = String(f.d.ad_num||'').trim(); if(ad && s.ads.indexOf(ad)<0) s.ads.push(ad);
    if(!s.last || stamp(f) > stamp(s.last)) s.last = f;
    ['nom','prenom','ddn'].forEach(a=>{ if(!s[a] && f.d[a]) s[a]=f.d[a]; });
    if(s.sexe==null && f.d.sexe!=null) s.sexe = f.d.sexe;
  });
  return Object.keys(by).map(k=>by[k])
    .sort((a,b)=>stamp(b.last).localeCompare(stamp(a.last)));
}

/* recherche libre : chaque mot de la requête doit se retrouver quelque part.
   Une date se cherche indifféremment en 12/04/1988 ou 1988-04-12. */
function searchSubjects(q){
  const terms = norm(q).split(' ').filter(Boolean);
  if(!terms.length) return [];
  return subjectIndex().filter(s=>{
    const hay = norm([s.dossier, s.ads.join(' '), s.nom, s.prenom, s.ddn, frDate(s.ddn),
                      s.last && s.last.d.examinateur].join(' '));
    return terms.every(t=>hay.indexOf(t)>=0);
  });
}

/* reprise d'un sujet : le numéro de dossier et l'identité passent dans la fiche
   courante, puis autofillFromDossier complète le reste depuis l'examen précédent. */
function applySubject(dossier, force){
  const s = subjectIndex().find(x=>x.dossier===dossier);
  if(!s){ toast('Sujet introuvable'); return; }
  REC.d.dossier = s.dossier;
  REC.d.dossier_pseudo = (s.last && s.last.d.dossier_pseudo) || 0;
  ID_KEYS.forEach(k=>{
    const v = s.last.d[k];
    if(v==null || v==='') return;
    if(force || REC.d[k]==null || REC.d[k]==='') REC.d[k]=v;
  });
  touch(); autofillFromDossier(); renderForm();
  toast('Sujet repris : '+(s.nom? s.nom.toUpperCase()+' '+(s.prenom||'') : s.dossier)+
        ' — '+s.n+' examen'+(s.n>1?'s':'')+' au dossier');
}

function openSubjectSearch(pre){
  const q = pre!=null ? pre : (REC.d.nom||'')+' '+(REC.d.prenom||'');
  modalHTML('<h3>Rechercher un sujet</h3>'+

/* proposition automatique quand l'identité est saisie avant le numéro de dossier */
function matchByIdentity(){
  const d = REC.d;
  if(d.dossier) return null;
  const nom = norm(d.nom), pre = norm(d.prenom), ddn = d.ddn;
  if(!nom && !ddn) return null;
  const cand = subjectIndex().filter(s=>{
    if(ddn && s.ddn && s.ddn!==ddn) return false;
    if(nom && norm(s.nom)!==nom) return false;
    if(pre && norm(s.prenom) && norm(s.prenom)!==pre) return false;
    return (nom && norm(s.nom)===nom) || (ddn && s.ddn===ddn);
  });
  return cand.length===1 ? cand[0] : (cand.length>1 ? {multi:cand.length} : null);
}

/* =====================================================================
   FORCE MOTRICE : FILTRE PAR MEMBRE
   Un membre déclaré sans déficit voit ses myotomes clés cotés 5 d'office.
   Le détail reste ouvrable pour corriger un item isolé : LIMBOPEN retient
   les membres dépliés à la main. C'est un état d'affichage, il ne part
   dans aucun export.
   ===================================================================== */
const LIMB_MYO = {
  msd:['f_c5_D','f_c6_D','f_c7_D','f_c8_D','f_t1_D','f_epaule_D','f_main_D'],
  msg:['f_c5_G','f_c6_G','f_c7_G','f_c8_G','f_t1_G','f_epaule_G','f_main_G'],
  mid:['f_l2_D','f_l3_D','f_l4_D','f_l5_D','f_s1_D'],
  mig:['f_l2_G','f_l3_G','f_l4_G','f_l5_G','f_s1_G'],
  sph:['vac','dap']
};
const LIMB_LAB = {msd:'membre supérieur droit', msg:'membre supérieur gauche',
                  mid:'membre inférieur droit', mig:'membre inférieur gauche', sph:'sphincter anal'};
const LIMB_DEF = {msd:'def_msd', msg:'def_msg', mid:'def_mid', mig:'def_mig', sph:'def_sph'};
const LIMBOPEN = {};

function limbOpen(l){ return REC.d[LIMB_DEF[l]]===1 || !!LIMBOPEN[l]; }
function limbToggle(l){ LIMBOPEN[l] = !LIMBOPEN[l]; renderForm(); }

/* valeurs posées automatiquement quand le membre est déclaré sans déficit */
function limbFill(l){
  const norm = (l==='sph') ? 1 : 5;
  LIMB_MYO[l].forEach(k=>{ REC.d[k] = norm; });
}
function limbAnswer(l){
  const v = REC.d[LIMB_DEF[l]];
  if(v===0){ limbFill(l); LIMBOPEN[l]=false; }
  /* réponse OUI : on ne touche à rien, l'examinateur cote lui-même */
}
/* un membre déclaré déficitaire mais coté 5 partout est une contradiction :
   on la signale plutôt que de la corriger en silence */
function limbContradiction(){
  return Object.keys(LIMB_DEF).filter(l=>{
    if(REC.d[LIMB_DEF[l]]!==1) return false;
    const norm = (l==='sph') ? 1 : 5;
    return LIMB_MYO[l].every(k=>REC.d[k]===norm);
  });
}

  const ko = limbContradiction();

  return '<div class="note" style="background:#fbeee4;border-color:#e3bd9a;margin:10px 0 0">'+

/* =====================================================================
   PIÈCES JOINTES PHOTOGRAPHIQUES
   ===================================================================== */
function pjList(){ return Array.isArray(REC.d.pj) ? REC.d.pj : []; }

/* réduction et ré-encodage : on passe par un canvas, sans dépendance externe */
function pjShrink(file){
  return new Promise((res, rej)=>{
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('lecture impossible'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('image illisible'));
      img.onload = () => {
        const r = Math.min(1, PJ_MAX_PX / Math.max(img.width, img.height));
        const w = Math.round(img.width * r), h = Math.round(img.height * r);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        res({data: c.toDataURL('image/jpeg', PJ_QUAL), w: w, h: h});
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

async function pjAdd(input, src){
  const files = Array.from(input.files || []);
  input.value = '';
  if(!files.length) return;
  const cur = pjList();
  if(cur.length + files.length > PJ_MAX_N){
    toast('Maximum '+PJ_MAX_N+' photos par fiche'); return;
  }
  toast(files.length>1 ? 'Traitement de '+files.length+' photos…' : 'Traitement de la photo…');
  const out = cur.slice();
  for(const f of files){
    if(f.type.indexOf('image/') !== 0){ toast('« '+f.name+' » n’est pas une image'); continue; }
    try{
      const im = await pjShrink(f);
      out.push({id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
                titre: src==='ordo' ? PJ_ORDO : '', src: src||'', nom:f.name, w:im.w, h:im.h,
                ko:Math.round(im.data.length*0.75/1024), data:im.data});
    }catch(e){ toast('« '+f.name+' » : '+e.message); }
  }
  REC.d.pj = out;
  touch(); renderForm();
  toast(out.length - cur.length + ' photo(s) ajoutée(s)');
}

/* =====================================================================
   CALCULS PROPRES À L'ACCIDENT DE PLONGÉE
   Les heures sont saisies sans date : une heure de sortie antérieure à
   l'heure d'immersion signifie qu'on a franchi minuit, et le calcul le
   prend en compte plutôt que de rendre une durée négative.
   ===================================================================== */
const hmin = s => { const m=/^(\d{1,2}):(\d{2})$/.exec(String(s||'')); return m? (+m[1])*60 + (+m[2]) : null; };
function deltaMin(a, b){                     // de a vers b, en minutes
  const x = hmin(a), y = hmin(b);
  if(x==null || y==null) return null;
  let d = y - x;
  if(d < -720) d += 1440;                    // passage de minuit
  if(d < 0)    d += 1440;
  return d;
}
function adpCalc(){
  const d = REC.d;
  const put = (k,v) => { if(v==null || isNaN(v)) delete d[k]; else d[k]=v; };

  /* en premier : il complète les heures du profil (DS, DF, HS), dont les délais ci-dessous dépendent */
  profilCalc(d, put);
  put('imc', (d.poids && d.taille) ? Math.round(d.poids/Math.pow(d.taille/100,2)*10)/10 : null);
  /* oxygénothérapie sur place : des 1ers soins sur place à la mise en pression au SMHEP */
  put('soin_o2_duree', d.soin_o2===1 ? deltaMin(d.heure_soins, d.tb_h_mep) : null);
  /* paquets-années : un paquet = 20 cigarettes */
  put('tabac_pa', (depMatch('tox',['tabac','tabac_sevre']) && d.tabac_cig!=null && d.tabac_ans!=null)
                    ? Math.round(d.tabac_cig/20*d.tabac_ans*10)/10 : null);
  put('pl_delai_symp', deltaMin(d.pl_h_sortie, d.pl_h_symp));
  put('delai_symp_pec', deltaMin(d.pl_h_symp, d.heure_pec));
  put('tb_delai',      deltaMin(d.pl_h_symp, d.tb_h_mep));
  put('plp_interval',  d.plp_faite===1 ? deltaMin(d.plp_heure, d.pl_h_immersion) : null);

  /* durée de la table choisie, et heure de fin proposée (modifiable) */
  put('tb_duree', tableDuree(d.tb_table));
  autoSync('tb_h_fin', (d.tb_h_mep && d.tb_duree!=null) ? addMin(d.tb_h_mep, d.tb_duree) : null);
  /* (méthyl)prednisolone : dose quotidienne proposée à 1 mg/kg, d'après le poids */
  autoSync('rx_solu_dose', (d.rx_solu===1 && d.poids>0) ? Math.round(d.poids*DEF_CORTICO_MGKG) : null);
  /* ECG : compte rendu rédigé à partir de la fréquence et du QTc, modifiable */
  autoSync('ecg_txt', (d.im_ecg===1 && (d.ecg_fc!=null || d.ecg_qtc!=null)) ? ecgTexte(d) : null);
}
/* =====================================================================
   DURÉES DU PROFIL : DT, DTR ET DTP
   Les trois durées se déduisent des heures (DS, DF, HS) ou se saisissent : on peut renseigner la
   DTR et/ou la DTP à la place des heures. Les relations : DT + DTR = DTP ; DT = DF − DS ;
   DTR = HS − DF ; DTP = HS − DS. Quand seule la DTP est connue, la DTR est estimée d'après la
   profondeur et les paliers, avec le modèle de remontée ci-dessous.

   Modèle de remontée : vitesse standard comprise entre 9 et 12 m/min jusqu'au premier palier ;
   entre deux paliers, et du dernier palier à la surface, 10 secondes par mètre. Les durées
   s'additionnent en secondes et l'arrondi à la minute supérieure se fait UNE fois, à la fin de la
   DTR (pas à chaque changement de palier).
   ===================================================================== */
const V_REM_MIN = 9, V_REM_MAX = 12;      // m/min
const S_PAR_M   = 10;                      // secondes par mètre entre deux paliers
const palListOf = d => Array.isArray(d.pl_pal) ? d.pl_pal : [];
/* paliers valides sous la profondeur P, du plus profond au plus superficiel */
function palStops(P, d){
  return palListOf(d || REC.d).filter(r=>r.p > 0 && r.p < P).map(r=>({p:+r.p, m:+r.m||0, s:!!r.s})).sort((a,b)=>b.p-a.p);
}
/* durée de remontée en secondes depuis la profondeur P à la vitesse v (m/min), paliers compris */
function dtrSecondes(P, st, v){
  if(!st.length) return P / v * 60;
  let sec = (P - st[0].p) / v * 60;
  st.forEach((x,i)=>{ sec += x.m*60 + (i ? (st[i-1].p - x.p) * S_PAR_M : 0); });
  return sec + st[st.length-1].p * S_PAR_M;
}
const minSup = sec => Math.ceil(sec/60 - 1e-9);
/* profondeur au départ du fond (DF), d'où part la remontée finale : Pmax, sauf pour une remontée
   progressive, qui se fait pendant DT et part donc d'une profondeur moindre */
function profDepartFond(d){
  const P = d.pl_prof > 0 ? +d.pl_prof : null; if(!P) return null;
  if(d.pl_profil_type!==4) return P;
  if(d.pl_prof_df > 0 && d.pl_prof_df < P) return +d.pl_prof_df;
  const st = palStops(P, d), p1 = st.length ? st[0].p : 0;
  return Math.min(P - 1, Math.max(Math.round(P*0.4), p1 + 3));
}
/* DTR attendue, en minutes : de la vitesse la plus rapide (12 m/min) à la plus lente (9 m/min) */
function dtrAttendue(d){
  const P0 = profDepartFond(d); if(!P0) return null;
  const st = palStops(P0, d);
  return {P0:P0, st:st, min:minSup(dtrSecondes(P0, st, V_REM_MAX)), max:minSup(dtrSecondes(P0, st, V_REM_MIN))};
}
const dtrEstimee = d => { const a = dtrAttendue(d); return a ? Math.ceil((a.min + a.max)/2) : null; };
/* vitesse de remontée déduite d'une DTR connue : distance jusqu'au premier palier ÷ temps de montée
   (DTR moins les paliers et les changements de palier) ; null si elle n'est pas calculable */
function vitesseDeduite(d, dtr){
  const a = dtrAttendue(d); if(!a || dtr==null) return null;
  const fixe = a.st.reduce((t,x,i)=> t + x.m + (i ? (a.st[i-1].p - x.p)*S_PAR_M/60 : 0), 0)
             + (a.st.length ? a.st[a.st.length-1].p*S_PAR_M/60 : 0);
  const reste = dtr - fixe, dist = a.P0 - (a.st.length ? a.st[0].p : 0);
  return reste > 0.2 ? dist / reste : null;
}
/* DS, DF, HS, DT, DTR et DTP : mis à jour à chaque saisie. On part de ce qui a été saisi à la main
   (heures et durées), puis on déduit ce qui peut l'être :
     deux heures donnent la durée qui les sépare (DS et DF : DT ; DF et HS : DTR ; DS et HS : DTP) ;
     une heure et une durée donnent l'heure voisine (HS et DTP : DS ; DS et DTP : HS ; HS et DTR : DF ;
     DF et DTR : HS ; DS et DT : DF ; DF et DT : DS), DT valant DTP − DTR quand les deux sont connues.
   Les heures et les durées déduites sont proposées dans leur champ et restent modifiables (voir
   autoSync) ; une valeur saisie à la main n'est jamais remplacée, ni confondue avec une proposition,
   même si elle lui est égale. Les durées proposées ne reposent que sur des heures saisies, jamais sur
   des heures elles-mêmes déduites : une heure déduite de la DTP ne vient donc pas « confirmer » cette DTP.
   La DTR estimée d'après la profondeur et les paliers n'est qu'une estimation : elle ne sert pas à
   déduire une heure. pl_dtr_src dit d'où vient la DTR : 1 heures, 2 saisie, 3 estimée, 4 DTP − DT. */
function profilCalc(d, put){
  /* valeur saisie à la main : présente, et différente de la dernière valeur proposée (clé <k>_auto) */
  const manuel = k => (d[k]!=null && d[k]!=='' && d[k]!==d[k+'_auto']) ? d[k] : null;
  /* une valeur saisie ne garde pas de proposition en mémoire : elle ne pourra jamais lui ressembler par hasard */
  const propose = (k, v) => { if(manuel(k)!=null) delete d[k+'_auto']; else autoSync(k, v); };
  const hS = manuel('pl_h_immersion'), hF = manuel('pl_h_depart_fond'), hH = manuel('pl_h_sortie');
  const dtT = deltaMin(hS, hF), dtrT = deltaMin(hF, hH), dtpT = deltaMin(hS, hH);
  const mDtr = manuel('pl_dtr'), mDtp = manuel('pl_duree_tot');
  const dtrBase = mDtr!=null ? mDtr : dtrT, dtpBase = mDtp!=null ? mDtp : dtpT;
  let propDtr = dtrT, propDtp = dtpT, estimee = false;
  if(propDtr==null && dtpBase!=null && dtT!=null) propDtr = dtpBase - dtT;
  if(propDtp==null && dtrBase!=null && dtT!=null) propDtp = dtT + dtrBase;
  if(propDtr==null && dtpBase!=null && dtT==null){
    const e = dtrEstimee(d);
    if(e!=null && e < dtpBase){ propDtr = e; estimee = true; }
  }
  if(propDtr!=null && propDtr < 0) propDtr = null;
  if(propDtp!=null && propDtp < 0) propDtp = null;
  propose('pl_dtr', propDtr);
  propose('pl_duree_tot', propDtp);
  const dtr = d.pl_dtr!=null ? d.pl_dtr : null, dtp = d.pl_duree_tot!=null ? d.pl_duree_tot : null;
  const dt = dtT!=null ? dtT : (dtp!=null && dtr!=null ? dtp - dtr : null);
  put('pl_dt', dt!=null && dt >= 0 ? dt : null);
  put('pl_dtr_src', dtr==null ? null : (mDtr!=null ? 2 : (dtrT!=null ? 1 : (estimee ? 3 : 4))));
  /* heures manquantes : une heure et une durée connues donnent l'heure voisine */
  const K = {s:hS, f:hF, h:hH}, dtrK = estimee ? null : dtr, dtK = (!estimee && dt!=null && dt >= 0) ? dt : null;
  for(let i = 0; i < 3; i++){
    if(!K.s && K.h && dtp!=null)  K.s = addMin(K.h, -dtp);
    if(!K.h && K.s && dtp!=null)  K.h = addMin(K.s, dtp);
    if(!K.f && K.h && dtrK!=null) K.f = addMin(K.h, -dtrK);
    if(!K.h && K.f && dtrK!=null) K.h = addMin(K.f, dtrK);
    if(!K.f && K.s && dtK!=null)  K.f = addMin(K.s, dtK);
    if(!K.s && K.f && dtK!=null)  K.s = addMin(K.f, -dtK);
  }
  propose('pl_h_immersion', K.s || null);
  propose('pl_h_depart_fond', K.f || null);
  propose('pl_h_sortie', K.h || null);
  /* ré-immersion : profondeur proposée = la moitié de Pmax ; description rédigée d'après les paramètres */
  autoSync('pl_rr_prof', (d.pl_reimm_type===1 && d.pl_prof>0) ? Math.round(d.pl_prof/2) : null);
  autoSync('pl_reimm_txt', d.pl_reimm_type ? reimmTexte(d) : null);
}
/* Procédure de ré-immersion. Remontée rapide (RR) : ré-immersion en moins de 3 min après l'émersion
   (sinon le plongeur interrompt sa remontée), retour à mi-profondeur pendant 5 min, remontée à
   vitesse standard, puis au minimum 1 min à 6 m et 5 min à 3 m. Remontée non conforme : au minimum
   1 min à 6 m et 5 min à 3 m. Toutes ces valeurs sont des propositions, modifiables. */
function reimmTexte(d){
  const pal = 'au minimum '+(d.pl_rr_pal6!=null ? d.pl_rr_pal6 : PAL_RR.p6)+' min à 6 m et '+
              (d.pl_rr_pal3!=null ? d.pl_rr_pal3 : PAL_RR.p3)+' min à 3 m';
  if(d.pl_reimm_type===2)
    return d.pl_reimm_faite===0 ? 'Remontée non conforme : paliers de rattrapage non réalisés.'
                                : 'Remontée non conforme : paliers de rattrapage, '+pal+'.';
  if(d.pl_reimm_faite===0) return 'Remontée rapide (RR) : procédure de ré-immersion non réalisée.';
  let t = 'Remontée rapide (RR) : ';
  if(d.pl_rr_emersion===1)
    t += 'ré-immersion '+(d.pl_rr_delai!=null ? 'à '+d.pl_rr_delai+' min de l’émersion' : 'en moins de '+RR_DELAI_MAX+' min après l’émersion');
  else if(d.pl_rr_emersion===0) t += 'remontée interrompue par le plongeur avant l’émersion, puis ré-immersion';
  else t += 'ré-immersion (en moins de '+RR_DELAI_MAX+' min en cas d’émersion)';
  t += ', retour à mi-profondeur'+(d.pl_rr_prof!=null ? ' ('+d.pl_rr_prof+' m)' : '')+' pendant '+
       (d.pl_rr_duree!=null ? d.pl_rr_duree : RR_DUREE)+' min, puis remontée à vitesse standard, puis '+pal+'.';
  return t;
}
/* Profil de plongée : phrase de synthèse et critères d'une plongée à yoyo (variations d'au
   moins YOYO_AMP_MIN m ; si la surface est atteinte, intervalle de surface <= YOYO_INT_MAX min). */
function yoyoCrit(d){
  if(d.pl_profil_type!==3 || d.pl_yoyo_amp==null) return null;
  if(d.pl_yoyo_amp < YOYO_AMP_MIN) return 0;
  if(d.pl_yoyo_surf===1 && d.pl_yoyo_int!=null && d.pl_yoyo_int > YOYO_INT_MAX) return 0;
  return 1;
}
function profilTexte(d){
  switch(d.pl_profil_type){
    case 1: return 'profil carré';
    case 2: {
      const x = [];
      if(d.pl_prof1!=null && d.pl_prof>0) x.push(d.pl_prof1+' m puis '+d.pl_prof+' m');
      if(d.pl_h_inv) x.push('arrivée à Pmax à '+TXT.hFr(d.pl_h_inv));
      return 'profil inversé'+(x.length ? ' ('+x.join(', ')+')' : '');
    }
    case 3: {
      const x = [];
      if(d.pl_yoyo_nb!=null) x.push(d.pl_yoyo_nb+' remontée'+(d.pl_yoyo_nb>1?'s':''));
      if(d.pl_yoyo_surf===1) x.push('jusqu’à la surface'); else if(d.pl_yoyo_surf===0) x.push('sans atteindre la surface');
      if(d.pl_yoyo_amp!=null) x.push('amplitude '+d.pl_yoyo_amp+' m');
      if(d.pl_yoyo_surf===1 && d.pl_yoyo_int!=null) x.push('intervalle de surface maximal '+d.pl_yoyo_int+' min');
      return 'plongée à yoyo'+(x.length ? ' ('+x.join(', ')+')' : '');
    }
    case 4: return 'remontée progressive'+(d.pl_prof_df!=null ? ' (départ du fond à '+d.pl_prof_df+' m)' : '');
  }
  return '';
}

/* Échographie pleuro-pulmonaire : 24 zones, clés ech_<partie>_<côté>_<rangée>_<champ>,
   cotées 1 = A, 2 = B, 3 = B++, 4 = C, 5 = PNO. La saisie se fait sur un thorax dessiné (echoBlock). */
const ECH_COT = [{v:1,t:'A',l:'profil A'},{v:2,t:'B',l:'lignes B'},{v:3,t:'B++',l:'lignes B coalescentes'},
                 {v:4,t:'C',l:'condensation'},{v:5,t:'PNO',l:'pneumothorax'}];
const ECH_PARTS = [{k:'a',l:'antérieur'},{k:'p',l:'postérieur'}];
const ECH_SIDES = [{k:'D',l:'droit'},{k:'G',l:'gauche'}];
const ECH_ROWS  = [{k:'s',l:'supérieur'},{k:'i',l:'inférieur'}];
const ECH_COLS  = [{k:'lat',l:'latéral'},{k:'mdn',l:'médian'},{k:'mdl',l:'médial'}];
const echKey = (p,s,r,c) => 'ech_'+p+'_'+s+'_'+r+'_'+c;
function echoZones(d){
  d = d || REC.d; const Z = [];
  ECH_PARTS.forEach(p=>ECH_SIDES.forEach(si=>ECH_ROWS.forEach(r=>ECH_COLS.forEach(c=>{
    const v = d[echKey(p.k,si.k,r.k,c.k)]; if(v) Z.push({p:p, si:si, r:r, c:c, v:v}); }))));
  return Z;
}
function echoTexte(){
  const Z = echoZones(); if(!Z.length) return '';
  const anom = Z.filter(z=>z.v!==1), nA = Z.length - anom.length;
  const t = 'Échographie pleuro-pulmonaire ('+Z.length+' zone'+(Z.length>1?'s':'')+' examinée'+(Z.length>1?'s':'')+') : ';
  if(!anom.length) return t+'profil A partout, sans ligne B, condensation ni pneumothorax.';
  const parts = [];
  [5,4,3,2].forEach(v=>{
    const L = anom.filter(z=>z.v===v); if(!L.length) return;
    const c = ECH_COT.find(x=>x.v===v);
    parts.push(c.l+(c.l.indexOf(c.t) >= 0 ? '' : ' ('+c.t+')')+' : '+L.map(z=>'poumon '+z.si.l+' '+z.p.l+' '+z.r.l+' '+z.c.l).join(', '));
  });
  return t+parts.join(' ; ')+(nA ? ' ; profil A dans les '+nA+' autre'+(nA>1?'s':'')+' zone'+(nA>1?'s':'') : '')+'.';
}

/* ---------- interface de l'échographie pleuro-pulmonaire ----------
   Deux thorax : face antérieure (on regarde le patient de face, son côté droit est à gauche
   de l'image) et face postérieure (vue de dos, son côté droit est à droite de l'image).
   Chaque poumon porte deux rangées (supérieure, inférieure) de trois champs, de l'extérieur
   vers la ligne médiane : latéral, médian, médial. Un clic cote la zone avec la cotation
   choisie ; un second clic avec la même cotation l'efface. */
const ECH_STY = {   // à l'écran : fond, trait, texte ; à l'impression (noir et blanc) : pf, pt
 1:{f:'#d9f0e2', s:'#2f8f5b', t:'#1b6b42', pf:'#ffffff', pt:'#000000'},
 2:{f:'#fff0b3', s:'#c9a100', t:'#7a6200', pf:'#e2e2e2', pt:'#000000'},
 3:{f:'#ffd0a1', s:'#d9730d', t:'#8a4300', pf:'#b9b9b9', pt:'#000000'},
 4:{f:'#f6c3bd', s:'#c0392b', t:'#8f1f14', pf:'#8a8a8a', pt:'#ffffff'},
 5:{f:'#cfc4ee', s:'#5b3fa0', t:'#3a2278', pf:'#000000', pt:'#ffffff'}
};
let EBRUSH = 1;                       // cotation appliquée au clic : 1 à 5, 0 pour la gomme
const ECH_LUNG = {
 L:'M40,46 H110 C119,46 126,53 126,62 V164 C126,174 118,180 108,180 H46 C32,180 26,170 26,156 V60 C26,52 32,46 40,46 Z',
 R:'M220,46 H150 C141,46 134,53 134,62 V164 C134,174 142,180 152,180 H214 C228,180 234,170 234,156 V60 C234,52 228,46 220,46 Z'
};
const ECH_TORSO = 'M102,2 V14 C86,19 58,23 36,29 C17,34 9,45 9,62 L13,190 C14,201 25,206 40,206 H220 C235,206 246,201 247,190 L251,62 C251,45 243,34 224,29 C202,23 174,19 158,14 V2';
/* emplacement des 12 champs d'une vue : moitié gauche de l'image = extérieur à gauche, moitié droite = extérieur à droite */
function echoLayout(view){
  const L = [], cw = 100/3, rh = 67;
  const left = view==='a' ? 'D' : 'G', right = view==='a' ? 'G' : 'D';
  [[left, 26, ['lat','mdn','mdl']], [right, 134, ['mdl','mdn','lat']]].forEach(h=>
    h[2].forEach((c,ci)=>ECH_ROWS.forEach((r,ri)=>
      L.push({side:h[0], col:c, row:r.k, x:h[1]+ci*cw, y:46+ri*rh, w:cw, h:rh}))));
  return L;
}
function echoZoneLab(view, side, row, col){
  const f = (arr,k) => arr.find(x=>x.k===k).l;
  return 'Poumon '+f(ECH_SIDES,side)+' — '+f(ECH_PARTS,view)+' — '+f(ECH_ROWS,row)+' — '+f(ECH_COLS,col);
}
function echoSVG(view, inter, prn){

  let s = '<svg class="echo" viewBox="0 0 260 210" role="img" aria-label="Thorax, '+(view==='a' ? 'face antérieure' : 'face postérieure')+
          '" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"'+(inter ? ' onclick="echoClick(event)"' : '')+'>';
  s += '<defs><clipPath id="'+id+'L"><path d="'+ECH_LUNG.L+'"/></clipPath><clipPath id="'+id+'R"><path d="'+ECH_LUNG.R+'"/></clipPath></defs>';
  s += '<path d="'+ECH_TORSO+'" fill="'+(prn ? '#fff' : '#f4f6fa')+'" stroke="'+ink+'" stroke-width="1.4" pointer-events="none"/>';
  /* repère médian : sternum vu de face, colonne vertébrale vue de dos */
  s += view==='a'
    ? '<rect x="126.5" y="40" width="7" height="92" rx="3.5" fill="'+(prn ? '#e6e6e6' : '#dde3ec')+'" stroke="'+ink+'" stroke-width=".9" pointer-events="none"/>'
    : '<path d="M130,40 V184" stroke="'+ink+'" stroke-width="1.2" stroke-dasharray="2 3" fill="none" pointer-events="none"/>';
  const lay = echoLayout(view);
  ['L','R'].forEach(h=>{
    s += '<g clip-path="url(#'+id+h+')">';
    lay.filter(z=>(h==='L') === (z.x < 130)).forEach(z=>{
      const k = echKey(view, z.side, z.row, z.col), v = REC.d[k] || 0, c = ECH_COT.find(x=>x.v===v), st = ECH_STY[v];
      s += '<rect class="z" data-k="'+k+'" x="'+z.x.toFixed(1)+'" y="'+z.y+'" width="'+z.w.toFixed(1)+'" height="'+z.h+'"'+
           ' fill="'+(v ? (prn ? st.pf : st.f) : '#ffffff')+'" stroke="'+(v ? (prn ? '#000' : st.s) : (prn ? '#555' : '#9aa5b4'))+'" stroke-width="1.1">'+
           (inter ? '<title>'+esc(echoZoneLab(view,z.side,z.row,z.col)+(c ? ' : '+c.t+' — '+c.l : ' : non examinée'))+'</title>' : '')+'</rect>';
      if(v) s += '<text x="'+(z.x+z.w/2).toFixed(1)+'" y="'+(z.y+z.h/2+4.5)+'" text-anchor="middle" font-size="13" font-weight="700" fill="'+
                 (prn ? st.pt : st.t)+'" pointer-events="none">'+esc(c.t)+'</text>';
    });
    s += '</g>';
  });
  s += '<path d="'+ECH_LUNG.L+'" fill="none" stroke="'+ink+'" stroke-width="1.6" pointer-events="none"/>'+
       '<path d="'+ECH_LUNG.R+'" fill="none" stroke="'+ink+'" stroke-width="1.6" pointer-events="none"/>';
  const lg = view==='a' ? 'D' : 'G', rg = view==='a' ? 'G' : 'D';
  s += '<text x="76" y="37" text-anchor="middle" font-size="13" font-weight="700" fill="'+ink+'">'+lg+'</text>'+
       '<text x="184" y="37" text-anchor="middle" font-size="13" font-weight="700" fill="'+ink+'">'+rg+'</text>';
  return s + '</svg>';
}
function echoBadge(){

}
function echoSummary(){

function echoFigs(){

function setEBrush(v){ EBRUSH = v; $$('#s_echo .eb').forEach(b=>b.classList.toggle('on', Number(b.dataset.v)===v));

/* Un clic applique la cotation choisie aux 24 champs d'un coup, ceux déjà cotés compris ;

function echoFillAllLabel(){

function echoClick(e){
  const p = e.target.closest('rect.z'); if(!p) return;
  const k = p.dataset.k, cur = REC.d[k] || 0;
  const nv = (EBRUSH===0 || cur===EBRUSH) ? 0 : EBRUSH;
  if(nv) REC.d[k] = nv; else delete REC.d[k];
  touch(); refreshEcho();
}
function echoKeys(){
  const K = [];
  ECH_PARTS.forEach(p=>ECH_SIDES.forEach(si=>ECH_ROWS.forEach(r=>ECH_COLS.forEach(c=>K.push(echKey(p.k,si.k,r.k,c.k))))));
  return K;
}
function echoFillEmpty(){
  let n = 0; echoKeys().forEach(k=>{ if(!REC.d[k]){ REC.d[k] = 1; n++; } });
  if(!n){ toast('Tous les champs sont déjà cotés'); return; }
  touch(); refreshEcho(); toast(n+' champ'+(n>1?'s':'')+' coté'+(n>1?'s':'')+' A');
}
function echoClear(){
  echoKeys().forEach(k=>delete REC.d[k]);
  touch(); refreshEcho(); toast('Schéma de l’échographie effacé');
}

/* Diagnostic retenu, en une phrase : « Accident de désaturation sévère (médullaire, vestibulaire) ;
   barotraumatisme (oreille moyenne). Diagnostic principal : accident de désaturation. » */
function diagnosticTexte(d){
  const sel = Array.isArray(d.dg_liste) ? d.dg_liste : [];
  const T = TXT;
  const labs = (arr, k) => (Array.isArray(d[k]) ? d[k] : []).map(v=>{ const o = arr.find(x=>x.v===v); return o ? T.lc1(o.l) : v; });
  const lib = v => {
    const o = DG.find(x=>x.v===v); let t = o ? T.lc1(o.l) : v;
    if(v==='add' && d.dg_add_grave) t += ' sévère';
    const sub = v==='add' ? labs(DG_ADD,'dg_add_types') : v==='baro' ? labs(DG_BARO,'dg_baro_types')
              : v==='bioch' ? labs(DG_BIOCH,'dg_bioch_types') : [];
    return t + (sub.length ? ' ('+T.lst(sub)+')' : '');
  };
  const parts = DG.filter(o=>sel.indexOf(o.v)>=0).map(o=>lib(o.v));
  if(d.dg_txt) parts.push(T.lc1(T.flat(d.dg_txt).replace(/\.$/,'')));
  if(!parts.length) return '';
  let t = T.cap(parts.join(' ; '))+'.';
  if(sel.length>1 && d.dg_principal){
    const o = DG.find(x=>x.v===d.dg_principal);
    if(o) t += ' Diagnostic principal : '+T.lc1(o.l)+'.';
  }
  return t;
}

/* durée en minutes d'une table de recompression, d'après son code ; null hors liste */
function tableDuree(code){ const t = TABLES.find(x=>x.v===code); return t && t.m!=null ? t.m : null; }
function tableLib(d){
  const t = TABLES.find(x=>x.v===d.tb_table); if(!t) return d.tb_table_autre ? String(d.tb_table_autre) : '';
  return t.v===9 ? (d.tb_table_autre ? String(d.tb_table_autre) : 'autre table') : t.l;
}
/* heure HH:MM + n minutes, au-delà de minuit comprise */
function addMin(hm, n){
  const m = hmin(hm); if(m==null || n==null || isNaN(n)) return null;
  const t = (((m + Number(n)) % 1440) + 1440) % 1440;
  return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
}
/* ECG normal, à compléter : fréquence et QTc manquants restent « xx » pour être vus */
function ecgTexte(d){
  const fc = d.ecg_fc!=null ? d.ecg_fc : 'xx', q = d.ecg_qtc!=null ? d.ecg_qtc : 'xx';
  return 'RSR à '+fc+' bpm, d’axe non dévié, sans trouble de la conduction ni de la repolarisation. QTc à '+q+' ms.';
}

/* =====================================================================
   PROFIL DE PLONGÉE ET PALIERS
     DS   départ surface (heure d'immersion)     DF   départ fond (heure)
     HS   heure de sortie de l'eau               Pmax profondeur maximale atteinte
     DT   durée de travail = DF − DS             DTR  durée totale de remontée = HS − DF
     DTP  durée totale de plongée = HS − DS      (DTR = DTP − DT)
   Le schéma est reconstitué à partir de ces grandeurs et des paliers saisis.
   Il est indicatif : descente et remontée sont tracées à vitesse constante
   entre deux points connus.

   Un palier se note par trois paramètres : gaz, profondeur, durée à la profondeur.
   Les paliers sont rangés dans REC.d.pl_pal : [{g:gaz, p:profondeur, m:minutes, s:1 si de sécurité}].
   Un palier « de sécurité » est réalisé sans être obligatoire ; les valeurs
   usuelles (1 min à 6 m, 5 min à 3 m) sont proposées et restent modifiables.
   ===================================================================== */
const PAL_MAX  = 12;                                   // paliers saisissables par plongée
const PAL_SECU = [{p:6, m:1}, {p:3, m:5}];             // paliers de sécurité usuels
function palList(){ return Array.isArray(REC.d.pl_pal) ? REC.d.pl_pal : []; }
function palClone(){ return palList().map(r=>Object.assign({}, r)); }
function palGazDefaut(){ return REC.d.pl_gaz || 1; }
function palCommit(L){
  if(L.length) REC.d.pl_pal = L; else delete REC.d.pl_pal;
  touch(); computeAll();
}
function palAdd(){
  const L = palClone();
  if(L.length >= PAL_MAX){ toast(PAL_MAX+' paliers au maximum'); return; }
  L.push({g:palGazDefaut()});
  palCommit(L); refreshPal(); softRefresh();
}
function palDel(i){
  const L = palClone(); L.splice(i,1);
  palCommit(L); refreshPal(); softRefresh();
}
function palSet(i, k, v){
  const L = palClone(); if(!L[i]) return;
  if(k==='s'){ if(v) L[i].s = 1; else delete L[i].s; }
  else if(k==='g'){ L[i].g = Number(v) || 1; }
  else if(v==='' || v==null) delete L[i][k];
  else { const n = Number(String(v).replace(',','.')); if(isNaN(n)) return; L[i][k] = n; }
  palCommit(L);
  if(k==='s') refreshPal();            // la case change le décompte et la case maîtresse
  softRefresh();
}
/* case maîtresse « paliers de sécurité » : la cocher propose les paliers usuels,
   la décocher retire ceux qui sont marqués de sécurité */
function palSecuMaster(){
  let L = palClone();
  if(L.some(r=>r.s)) L = L.filter(r=>!r.s);
  else PAL_SECU.forEach(x=>{ if(L.length < PAL_MAX) L.push({g:palGazDefaut(), p:x.p, m:x.m, s:1}); });
  palCommit(L); refreshPal(); softRefresh();
}
function refreshPal(){
  const el = document.getElementById('r_pl_palier');
  if(el) el.outerHTML = fieldHTML(FIELDS.pl_palier);
}
const gazLab = g => { const o = GAZ.find(x=>x.v===g); return o ? o.l.toLowerCase() : ''; };
/* « 5 min à 3 m (air, sécurité) » */
function palTxt(r){

}

/* points du profil, en minutes depuis l'immersion et en mètres.
   Le séjour au fond (de la descente au départ du fond, DF) se dessine selon le type de profil :
   carré (plateau), inversé (1re phase moins profonde, puis passage à Pmax), yoyo (remontées et
   réimmersions répétées), remontée progressive (remontée lente pendant DT, de Pmax jusqu'à la
   profondeur du départ du fond). Sans type choisi, ou quand les durées saisies ne laissent pas la
   place d'un type, le profil carré est tracé. La remontée finale (DTR) part de la profondeur du
   départ du fond : premier trajet jusqu'au premier palier pour la durée qui reste une fois
   retirés les paliers et les changements de palier (10 s par mètre). */
function profilPts(){
  const d = REC.d, type = d.pl_profil_type || 1;
  const pmax = d.pl_prof > 0 ? d.pl_prof : null;
  const P = pmax || 30;                                  // profondeur de tracé quand Pmax est inconnue
  const PDF = type===4 ? (profDepartFond(d) || P*0.4) : P;     // profondeur au départ du fond
  const st = palStops(PDF);
  const dt = d.pl_dt, dtr = d.pl_dtr;
  let td = pmax ? Math.max(1, pmax/20) : 2;              // descente schématique à 20 m/min
  if(dt != null && td > dt*0.5) td = Math.max(dt*0.5, 0.5);
  const tb = (dt != null && dt > td) ? dt : td + (dt == null ? 6 : 0.5);   // départ du fond

  let pts = [[0,0],[td,P],[tb,P]];
  if(type===2){
    /* inversé : plateau moins profond, puis seconde descente à la même vitesse jusqu'à Pmax */
    const P1 = (d.pl_prof1 > 0 && d.pl_prof1 < P) ? +d.pl_prof1 : P*0.55;
    const t1 = td * P1 / P, dd = Math.max(0.2, td * (P - P1) / P);
    const libre = tb - t1 - dd;                          // temps laissé aux deux plateaux
    if(libre > 0.4){
      let t2 = (d.pl_h_inv && d.pl_h_immersion) ? deltaMin(d.pl_h_immersion, d.pl_h_inv) : null;   // arrivée à Pmax
      if(t2 == null || t2 < t1 + dd + 0.2 || t2 > tb - 0.1) t2 = t1 + dd + 0.7*libre;
      pts = [[0,0],[t1,P1],[t2-dd,P1],[t2,P],[tb,P]];
    }
  } else if(type===3 && tb - td > 0.8){
    /* yoyo : n remontées, jusqu'à la surface ou d'une amplitude donnée, séparées de plateaux au fond */
    const n = Math.max(1, Math.min(12, Math.round(d.pl_yoyo_nb || 2)));
    const amp = d.pl_yoyo_amp > 0 ? Math.min(+d.pl_yoyo_amp, P) : Math.max(YOYO_AMP_MIN, P/2);
    const surface = d.pl_yoyo_surf===1 || (d.pl_yoyo_surf==null && !(d.pl_yoyo_amp > 0 && d.pl_yoyo_amp < P));
    const haut = surface ? 0 : Math.max(0, P - amp);
    const u = (tb - td) / ((n + 1) + 1.8*n);
    pts = [[0,0],[td,P]];
    let tt = td;
    for(let i=0; i<=n; i++){
      tt += u; pts.push([tt,P]);                         // plateau au fond
      if(i < n){ tt += 0.9*u; pts.push([tt,haut]); tt += 0.9*u; pts.push([tt,P]); }
    }
    pts[pts.length-1][0] = tb;                           // le dernier plateau finit au départ du fond
  } else if(type===4 && tb - td > 0.8){
    /* remontée progressive : elle se fait pendant DT, de Pmax à la profondeur du départ du fond,
       en ondulant ; le départ du fond (DF) marque la fin de cette montée lente */
    const t0 = td + Math.min(1.5, (tb - td)*0.12), N = 18, ond = Math.min(3, (P - PDF)*0.08);
    pts = [[0,0],[td,P],[t0,P]];
    for(let j=1; j<N; j++){
      const fr = j/N, dep = P - (P - PDF)*fr + ond*Math.sin(fr*Math.PI*6)*Math.sin(fr*Math.PI);
      pts.push([t0 + (tb - t0)*fr, Math.min(P, Math.max(0, dep))]);
    }
    pts.push([tb, PDF]);
  }

  /* remontée finale : du départ du fond à la surface, par les paliers */
  const plat = [];
  const somme = st.reduce((x,r)=>x + r.m, 0);
  const chg = st.length ? (st.reduce((x,r,i)=> x + (i ? st[i-1].p - r.p : 0), 0) + st[st.length-1].p) * S_PAR_M/60 : 0;
  const premiere = st.length ? PDF - st[0].p : PDF;
  let t1 = dtr != null ? dtr - somme - chg : premiere / ((V_REM_MIN + V_REM_MAX)/2);
  t1 = Math.max(t1, Math.max(0.3, premiere/30));
  let t = tb, cur = PDF;
  st.forEach((r,i)=>{
    t += i===0 ? t1 : (st[i-1].p - r.p) * S_PAR_M/60;
    pts.push([t, r.p]);
    if(r.m > 0){ plat.push({t0:t, t1:t+r.m, p:r.p, s:r.s}); t += r.m; pts.push([t, r.p]); }
    cur = r.p;
  });
  t += st.length ? cur * S_PAR_M/60 : t1;
  pts.push([t, 0]);
  return {pmax:pmax, P:P, PDF:PDF, pts:pts, plat:plat, T:t, tb:tb, type:type};
}

/* Schéma au trait. prn = true : noir et blanc pour l'impression. */
function profilSVG(prn){
  const d = REC.d, G = profilPts();
  /* à l'impression le schéma est plus ramassé : la page 1 est déjà pleine */
  const W = 640, H = prn ? 188 : 268, X0 = 80, X1 = 616, Y0 = prn ? 44 : 54, Y1 = prn ? 116 : 190;
  const X = t => X0 + t/G.T*(X1-X0), Y = p => Y0 + p/G.P*(Y1-Y0);
  const f = v => v.toFixed(1);
  const ink = prn ? '#000' : '#14181f', mut = prn ? '#444' : '#5a6472', blue = prn ? '#000' : '#1b4f8f';
  const orange = prn ? '#000' : '#b4531a', vert = prn ? '#000' : '#1f7a4d';
  const hh = k => d[k] ? ' '+d[k] : '';
  const mn = v => v==null ? '—' : v+' min';
  /* halo de la couleur du fond : un repère en pointillés ne barre pas une étiquette */
  const halo = prn ? '#fff' : '#fbfcfe';
  const txt = (x, y, anchor, s, bold) => '<text x="'+f(x)+'" y="'+f(y)+'" text-anchor="'+anchor+'" font-size="11.5"'+
    (bold?' font-weight="700"':'')+' fill="'+ink+'" stroke="'+halo+'" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">'+esc(s)+'</text>';
  const line = G.pts.map((p,i)=>(i?'L':'M')+f(X(p[0]))+','+f(Y(p[1]))).join(' ');
  const yb1 = prn ? 142 : 220, yb2 = prn ? 166 : 246;    // lignes des durées
  const br = (t1, t2, y, label) => {
    const x1 = X(t1), x2 = X(t2), hw = label.length*3.4;       // demi-largeur approchée de l'étiquette
    const cx = Math.max(hw + 2, Math.min(W - hw - 2, (x1 + x2)/2));   // l'étiquette ne déborde pas du cadre
    return '<path d="M'+f(x1)+','+(y-5)+' V'+(y+5)+' M'+f(x1)+','+y+' H'+f(x2)+' M'+f(x2)+','+(y-5)+' V'+(y+5)+
           '" fill="none" stroke="'+ink+'" stroke-width="1.2"/>'+txt(cx, y+15, 'middle', label);
  };
  let s = '<svg class="pfig" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Schéma du profil de plongée" '+
          'xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">';
  if(!prn) s += '<path d="'+line+' L'+f(X(G.T))+','+f(Y0)+' Z" fill="#e8f0fa"/>';
  /* surface et lignes de repère */
  s += '<path d="M'+(X0-16)+','+Y0+' H'+(X1+14)+'" stroke="'+mut+'" stroke-width="1" stroke-dasharray="5 3" fill="none"/>';
  s += '<path d="M'+f(X(0))+','+Y0+' V'+yb2+' M'+f(X(G.T))+','+Y0+' V'+yb2+
       ' M'+f(X(G.tb))+','+f(Y(G.PDF))+' V'+yb1+'" stroke="'+mut+'" stroke-width="1" stroke-dasharray="2 3" fill="none"/>';
  /* profil */
  s += '<path d="'+line+'" fill="none" stroke="'+blue+'" stroke-width="2.4" stroke-linejoin="round"/>';
  G.plat.forEach(p=>{
    s += '<path d="M'+f(X(p.t0))+','+f(Y(p.p))+' H'+f(X(p.t1))+'" fill="none" stroke-width="5" stroke-linecap="butt" '+
         (p.s ? 'stroke="'+vert+'" stroke-dasharray="5 2"' : 'stroke="'+orange+'"')+'/>';
  });
  [[0,Y0],[G.tb,Y(G.PDF)],[G.T,Y0]].forEach(m=>{
    s += '<circle cx="'+f(X(m[0]))+'" cy="'+f(m[1])+'" r="3.8" fill="#fff" stroke="'+ink+'" stroke-width="1.6"/>';
  });
  /* points DS, DF, HS, et titre du type de profil au centre de la ligne de surface */
  s += txt(X(0), Y0-12, 'start', 'DS'+hh('pl_h_immersion'), true);
  s += txt(X(G.T), Y0-12, 'end', 'HS'+hh('pl_h_sortie'), true);
  const tp = PROFIL_TYPES.find(x=>x.v===d.pl_profil_type);
  if(tp) s += txt((X0+X1)/2, Y0-12, 'middle', tp.t, false);
  s += txt(X(G.tb), Y(G.PDF)+17, 'middle', 'DF'+hh('pl_h_depart_fond'), true);
  /* Pmax : flèche verticale le long de l'axe */
  s += '<path d="M62,'+(Y0+3)+' V'+(Y1-3)+'" stroke="'+ink+'" stroke-width="1.2" fill="none"/>'+
       '<path d="M62,'+Y0+' l-4,8 h8 z M62,'+Y1+' l-4,-8 h8 z" fill="'+ink+'"/>';
  s += txt(4, (Y0+Y1)/2 - 2, 'start', 'Pmax', true) + txt(4, (Y0+Y1)/2 + 13, 'start', G.pmax!=null ? G.pmax+' m' : '—');
  /* durées */
  s += br(0, G.tb, yb1, 'DT '+mn(d.pl_dt));
  s += br(G.tb, G.T, yb1, 'DTR '+mn(d.pl_dtr)+(d.pl_dtr_src===3 ? ' (estimée)' : ''));
  s += br(0, G.T, yb2, 'DTP '+mn(d.pl_duree_tot));
  return s + '</svg>';
}

/* liste lisible des paliers saisis, durées attendues pour la remontée, et alertes de cohérence sous le schéma */
function profilLegende(){
  const L = palList().filter(r=>r.p!=null || r.m!=null);
  const warn = [], info = [];
  const d = REC.d;
  const dtT = deltaMin(d.pl_h_immersion, d.pl_h_depart_fond), dtrT = deltaMin(d.pl_h_depart_fond, d.pl_h_sortie), dtpT = deltaMin(d.pl_h_immersion, d.pl_h_sortie);
  if(dtT!=null && dtrT!=null && dtpT!=null && dtT + dtrT !== dtpT)
    warn.push('DF ne se place pas entre DS et HS : vérifiez les trois heures saisies.');
  else if(d.pl_dtr!=null && d.pl_duree_tot!=null && d.pl_dtr > d.pl_duree_tot)
    warn.push('La DTR saisie dépasse la DTP.');
  else if(d.pl_dtr!=null && d.pl_duree_tot!=null && dtT!=null && dtT + d.pl_dtr !== d.pl_duree_tot)
    warn.push('DT + DTR ne donne pas la DTP : l’une des trois durées a été saisie à la main.');
  if(d.pl_prof > 0 && palList().some(r=>r.p >= d.pl_prof))
    warn.push('Un palier est saisi à une profondeur supérieure ou égale à Pmax.');
  /* alertes propres au type de profil */
  if(d.pl_profil_type===2 && d.pl_prof1 > 0 && d.pl_prof > 0 && d.pl_prof1 >= d.pl_prof)
    warn.push('Profil inversé : la 1re phase doit être moins profonde que Pmax.');
  if(d.pl_profil_type===3){
    if(d.pl_yoyo_amp!=null && d.pl_yoyo_amp < YOYO_AMP_MIN)
      warn.push('Une variation de profondeur de moins de '+YOYO_AMP_MIN+' m ne compte pas comme une remontée de yoyo.');
    if(d.pl_yoyo_surf===1 && d.pl_yoyo_int!=null && d.pl_yoyo_int > YOYO_INT_MAX)
      warn.push('Intervalle de surface supérieur à '+YOYO_INT_MAX+' min : au-delà, ce ne sont plus des remontées de yoyo mais des plongées successives.');
    if(d.ff_ludion!==1)
      warn.push('Le facteur favorisant « Plongées ludion (yo-yo) » n’est pas coché OUI dans les facteurs favorisants.');
  }
  if(d.pl_profil_type===4 && d.pl_prof_df > 0 && d.pl_prof > 0 && d.pl_prof_df >= d.pl_prof)
    warn.push('Remontée progressive : la profondeur au départ du fond doit être inférieure à Pmax.');
  /* remontée : durée attendue et vitesse déduite */
  const A = dtrAttendue(d), nf = v => v.toFixed(1).replace('.', ',');
  if(A){
    info.push('DTR attendue pour cette remontée depuis '+A.P0+' m : '+A.min+(A.max>A.min ? ' à '+A.max : '')+' min ('+V_REM_MIN+' à '+V_REM_MAX+
              ' m/min jusqu’au premier palier, '+S_PAR_M+' s par mètre entre les paliers, arrondie à la minute supérieure).');
    if(d.pl_dtr_src===3) info.push('DTR estimée à '+d.pl_dtr+' min, milieu de la fourchette : saisissez-la si vous la connaissez.');
    else if(d.pl_dtr!=null){
      const v = vitesseDeduite(d, d.pl_dtr);
      if(v!=null){
        const t = 'Vitesse de remontée déduite de la DTR : '+nf(v)+' m/min'+(v > V_REM_MAX+0.05 ? ' — remontée plus rapide que '+V_REM_MAX+' m/min' : v < V_REM_MIN-0.05 ? ' — remontée plus lente que '+V_REM_MIN+' m/min' : '')+'.';
        if(v > V_REM_MAX+0.05) warn.push(t); else info.push(t);
      } else if(d.pl_dtr < A.min) warn.push('DTR inférieure au minimum attendu ('+A.min+' min) : paliers écourtés ou remontée très rapide.');
    }
  }
  const pt = profilTexte(d);
  return (pt ? '<div class="pcap2"><b>Profil :</b> '+esc(pt)+'</div>' : '')+
         (L.length ? '<div class="pcap2"><b>Paliers :</b> '+L.map(r=>esc(palTxt(r))).join(' · ')+'</div>' : '')+
         info.map(w=>'<div class="pcap2" style="color:var(--ink2);font-size:11.5px">'+esc(w)+'</div>').join('')+
         warn.map(w=>'<div class="note" style="margin:6px 0 0;background:#fbeee4;border-color:#e3bd9a">'+esc(w)+'</div>').join('');
}

/* =====================================================================
   SCORE MEDSUBHYP
   Chaque item est déduit de ce qui a déjà été saisi. La déduction est
   affichée, et reste remplaçable à la main : l'examinateur tranche, pas
   le calcul. Une valeur posée à la main est marquée comme telle.
   ===================================================================== */
function mshAuto(item){
  const d = REC.d;
  switch(item.auto){
    case 'age':    return (d.age==null) ? null : (d.age>=42 ? 1 : 0);
    case 'rachis': return (d.sf_rachis==null) ? null : (d.sf_rachis===1 ? 1 : 0);
    case 'sens':   return (d.sens_examinee===0 || d.sens_obj==null) ? null : (d.sens_obj===1 ? 1 : 0);
    case 'moteur': {
      const vals = MYO.map(m=>['D','G'].map(s=>d[myoKey(m.k,s)])).reduce((a,b)=>a.concat(b),[]);
      if(vals.every(v=>v==null)) return null;
      const bas = MYO_LE.map(k=>['D','G'].map(s=>d[myoKey(k,s)])).reduce((a,b)=>a.concat(b),[])
                        .filter(v=>v!=null);
      /* paraplégie : aucun mouvement utile aux membres inférieurs */
      if(bas.length && bas.every(v=>v<=1)) return 2;
      if(vals.some(v=>v!=null && v<5)) return 1;
      return 0;
    }
    case 'sphincter': {
      const r = d.mict_residu_post;
      if(d.vac===0) return 1;
      if(d.mict_type===3) return 1;
      if(r!=null && r>100) return 1;
      if(d.mict==null && d.vac==null && d.mict_type==null) return null;
      return 0;
    }
  }
  /* évolution avant recompression : même codage que le champ de l'anamnèse */
  if(item.k==='msh_evol') return (REC.d.evol_avant_rec==null) ? null : REC.d.evol_avant_rec;
  return null;
}
/* moment proposé d'après le délai entre les premiers symptômes et l'examen */
function mshMomentAuto(){
  const d = REC.d;
  if(!d.date_acc || !d.date_ex) return null;
  const a = new Date(d.date_acc+'T'+(d.pl_h_symp||d.heure_acc||'12:00'));
  const e = new Date(d.date_ex+'T'+(d.heure_ex||'12:00'));
  if(isNaN(a)||isNaN(e)) return null;
  const h = (e-a)/3600000;
  if(h < 6)  return 't0';
  if(h < 18) return 't12';
  if(h < 30) return 't24';
  return 'nr';
}
function mshCalc(){
  const d = REC.d;
  const moment = d.msh_moment || mshMomentAuto();
  const R = {moment:moment, items:[], total:null, manque:0, manuels:0};
  if(moment === 'nr'){ R.horsFenetre = true; return R; }
  MSH.forEach(it=>{
    const manuel = d[it.k];
    const auto   = mshAuto(it);
    const v = (manuel!=null) ? manuel : auto;
    const opt = it.o.find(o=>o.v===v);
    if(manuel!=null && manuel!==auto) R.manuels++;
    if(v==null) R.manque++;
    R.items.push({k:it.k, l:it.l, v:v, auto:auto, manuel:manuel!=null, p:opt?opt.p:null, lab:opt?opt.l:null});
  });
  if(!R.manque) R.total = R.items.reduce((s,i)=>s+i.p,0);
  R.grave = (R.total!=null) && (R.total >= MSH_SEUIL);
  return R;
}

/* =====================================================================
   SCORE VESTIBULAIRE
   Grille du service (constante VEST). Chaque item est déduit de l'examen quand c'est
   possible ; une cotation posée à la main (d[k]) l'emporte sur la déduction.
   Les règles de déduction suivent la formulation des modalités :
   - vertige : « non » à la question « Vertiges » donne Absent ; « oui » ne dit pas
     s'il est permanent, l'examinateur tranche ;
   - nystagmus : selon les positions du regard où il est vu, par rapport au sens de sa
     secousse rapide (1 : seulement vers la secousse rapide, 2 : aussi regard centré,
     3 : aussi vers la secousse lente) ;
   - instabilité : verticalisation impossible 3, perte de l'équilibre yeux ouverts 2,
     yeux fermés seulement 1 (ou Romberg positif), équilibre conservé dans les deux cas 0 ;
   - symptômes cochléaires : troubles de l'audition ou acouphènes.
   ===================================================================== */
function vestAuto(it, d){
  switch(it.auto){
    case 'vertige': return d.fs_vertiges===0 ? 0 : null;
    case 'nystagmus': {
      if(d.nys===0) return 0;
      if(d.nys!==1) return null;
      const rg = Array.isArray(d.nys_regard) ? d.nys_regard : [];
      const rapide = d.nys_cote===1 ? 'lat_d' : d.nys_cote===2 ? 'lat_g' : null;   // regard vers la secousse rapide
      if(!rapide || !rg.length) return null;
      const lente = rapide==='lat_d' ? 'lat_g' : 'lat_d';
      if(rg.indexOf(lente)>=0) return 3;
      if(rg.indexOf('centre')>=0) return 2;
      if(rg.indexOf(rapide)>=0) return 1;
      return null;
    }
    case 'instab': {
      if(d.vertic===0) return 3;
      if(d.vertic!==1) return null;
      if(d.equil_yo===0) return 2;
      if(d.equil_yf===0 || d.romberg===1) return 1;
      if(d.equil_yo===1 && d.equil_yf===1) return 0;
      return null;
    }
    case 'cochl': {
      if(d.fs_audition===1 || d.fs_acouph===1) return 1;
      if(d.fs_audition===0 && d.fs_acouph===0) return 0;
      return null;
    }
  }
  return null;
}
/* d : données d'une fiche (par défaut la fiche courante), pour que l'export lise le même calcul */
function vestCalc(d){
  d = d || REC.d;
  const items = VEST.items.map(it=>{
    const manuel = d[it.k], auto = vestAuto(it, d);
    const v = (manuel!=null) ? manuel : auto;
    const opt = it.o.find(o=>o.v===v);
    return {k:it.k, l:it.l, s:it.s, v:v, auto:auto, manuel:manuel!=null, p:opt?opt.p:null, lab:opt?opt.l:null};
  });
  const manque = items.filter(i=>i.p==null).length;
  return {nom:VEST.nom, items:items, manque:manque, max:VEST_MAX, seuil:VEST.seuil,
          total: manque ? null : items.reduce((s,i)=>s+i.p,0),
          manuels: items.filter(i=>i.manuel && i.v!==i.auto).length};
}


/* Les totaux des deux scores sont recopies dans la fiche : le CSV et le PDF
   lisent une valeur figee, ils ne rejouent pas le calcul. */
function scoresWrite(){
  const d = REC.d;
  const kill = k => { delete d[k]; };
  const R = mshCalc();
  /* Le moment retenu est enregistre, qu'il ait ete choisi ou deduit du delai :
     un score sans moment ne s'analyse pas. Un second champ dit lequel des deux. */
  if(R.moment){ d.msh_moment_eff = R.moment; d.msh_moment_auto = d.msh_moment ? 0 : 1; }
  else { kill('msh_moment_eff'); kill('msh_moment_auto'); }
  if(R.horsFenetre || R.total==null){ kill('msh_total'); kill('msh_grave'); kill('msh_manuels'); }
  else { d.msh_total = R.total; d.msh_grave = R.grave?1:0; d.msh_manuels = R.manuels; }
  const V = vestCalc();
  kill('vest_grille'); kill('vest_max');          // colonnes de la grille libre des premiers essais
  if(V.total==null) kill('vest_total'); else d.vest_total = V.total;
}

      .filter(Boolean).join(' · ');
  return '<div class="note" id="orlbox" style="background:'+col.bg+';border-color:'+col.bd+';margin:10px 0 0">'+
