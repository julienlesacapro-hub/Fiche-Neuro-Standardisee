/* ---------- CSV ---------- */
function csvCell(v,sep){
  if(v==null) return '';
  const s=String(v);
  return (/["\n\r]/.test(s) || s.indexOf(sep)>=0) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function buildCSV(recs,sep,pii){
  const C=columns(pii), L=[C.map(c=>csvCell(c.k,sep)).join(sep)];
  recs.forEach(r=>L.push(C.map(c=>{ let v; try{v=c.get(r);}catch(e){v='';}
    return csvCell(v==null?'':v,sep); }).join(sep)));
  return '﻿'+L.join('\r\n')+'\r\n';
}
function buildDict(sep,pii){
  const C=columns(pii), L=[['variable','libelle','codage'].map(x=>csvCell(x,sep)).join(sep)];
  C.forEach(c=>L.push([c.k,c.l,c.codes].map(x=>csvCell(x,sep)).join(sep)));
  return '﻿'+L.join('\r\n')+'\r\n';
}
function parseCSV(txt,sep){
  txt=txt.replace(/^﻿/,''); const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<txt.length;i++){ const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===sep){ row.push(cur); cur=''; }
    else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else if(c!=='\r') cur+=c;
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.length>1||r[0]!=='');
}

/* =====================================================================
   BASE LOCALE (IndexedDB)
   ===================================================================== */
let idb=null;
/* Base propre à l'application ADP (fiches et réglages). Elle est distincte de celle des
   versions d'essai antérieures, dont les fiches ne sont ni lues ni converties. */
function openDB(){ return new Promise((res,rej)=>{
  const rq=indexedDB.open('adp',1);
  rq.onupgradeneeded=e=>{ const db=e.target.result;
    if(!db.objectStoreNames.contains('fiches')) db.createObjectStore('fiches',{keyPath:'id'});
    if(!db.objectStoreNames.contains('meta'))   db.createObjectStore('meta',{keyPath:'k'});
 };
  rq.onsuccess=e=>{idb=e.target.result;res();}; rq.onerror=e=>rej(e); }); }
const tx=(st,mode)=>idb.transaction(st,mode).objectStore(st);
function idbAll(){ return new Promise(r=>{ const q=tx('fiches','readonly').getAll(); q.onsuccess=()=>r(q.result||[]); q.onerror=()=>r([]); }); }
function idbPut(o){ return new Promise(r=>{ const q=tx('fiches','readwrite').put(o); q.onsuccess=()=>r(1); q.onerror=()=>r(0); }); }
function idbDel(id){ return new Promise(r=>{ const q=tx('fiches','readwrite').delete(id); q.onsuccess=()=>r(1); q.onerror=()=>r(0); }); }
/* Écrit la fiche si elle est absente de la base ou plus récente que celle qui s'y trouve, en une seule transaction :
   une fiche enregistrée pendant la lecture d'un dossier ne peut pas être écrasée par une version plus ancienne.
   Résultat : add | upd | same | err. */
function idbMerge(r){
  return new Promise(res=>{
    let out = 'same';
    const t = idb.transaction('fiches','readwrite'), s = t.objectStore('fiches'), g = s.get(r.id);
    g.onsuccess = ()=>{
      const cur = g.result;
      if(!cur){ s.put(r); out = 'add'; }
      else if((r.updated||'') > (cur.updated||'')){ s.put(r); out = 'upd'; }
    };
    t.oncomplete = ()=>res(out); t.onerror = ()=>res('err'); t.onabort = ()=>res('err');
  });
}
function metaGet(k){ return new Promise(r=>{ const q=tx('meta','readonly').get(k); q.onsuccess=()=>r(q.result?q.result.v:null); q.onerror=()=>r(null); }); }
function metaSet(k,v){ return new Promise(r=>{ const q=tx('meta','readwrite').put({k:k,v:v}); q.onsuccess=()=>r(1); q.onerror=()=>r(0); }); }



/* renumerote num_ex pour chaque dossier, et persiste, apres toute modification de la base */
async function renumberAll(){
  const by={};
  DB.forEach(f=>{ const k=f.d.dossier||''; if(!k) return; (by[k]=by[k]||[]).push(f); });
  const changed=[];
  Object.keys(by).forEach(k=>{
    by[k].sort((a,b)=>stamp(a).localeCompare(stamp(b)))
         .forEach((f,i)=>{ if(f.d.num_ex!==i+1){ f.d.num_ex=i+1; changed.push(f); } });
  });
  for(const f of changed) await idbPut(f);
  if(changed.length) DB = await idbAll();
}
/* ordre du fichier statistique : par dossier, puis chronologique */
function sortedDB(){
  return DB.slice().sort((a,b)=>{
    const c=String(a.d.dossier||'').localeCompare(String(b.d.dossier||''),'fr',{numeric:true});
    return c!==0 ? c : stamp(a).localeCompare(stamp(b));
  });
}

/* =====================================================================
   DOSSIER DE DONNÉES SUR LE DISQUE (File System Access API)
   Un dossier, choisi une seule fois, reçoit à chaque enregistrement :
     fiches/fiche_<id>.json      la fiche entière, un fichier par fiche ; le nom du fichier ne porte
                                 aucune donnée du patient
     donnees_neuro.csv           le fichier statistique, une ligne par fiche
     dictionnaire_variables.csv  le codage des colonnes
   À l'ouverture, l'outil relit ce dossier (et le dossier de recherche, s'il est distinct) : les fiches
   qu'il contient et que ce poste ne connaît pas rejoignent la base locale, ce qui rend la recherche par
   nom, prénom, naissance ou numéro valable pour toutes les fiches du dossier. Un fichier déjà lu et
   inchangé n'est pas relu (taille et date de modification mémorisées par dossier).
   Le navigateur mémorise le dossier choisi : il n'est jamais redemandé. Il peut en revanche exiger une
   autorisation à chaque session ; un clic suffit (bandeau, ou premier clic dans la page), et le choix
   « autoriser à chaque visite » de Chrome et d'Edge la rend définitive.
   Une fiche supprimée sur ce poste n'est jamais effacée du disque : son fichier passe dans
   fiches/supprimees. La suppression est mémorisée (TOMB) pour qu'une relecture ne la ressuscite pas.
   Ce dossier suppose un navigateur qui offre l'API (Chrome, Edge sur ordinateur). Sur un autre navigateur, l'outil
   l'explique (diagnostic) et propose ce qui fonctionne : « Exporter tout en JSON » (dossier choisi, ou archive
   ZIP), téléchargement du JSON à chaque enregistrement, import d'un dossier ou d'une archive.
   ===================================================================== */
const APP_VERSION = '7.3.3';
/* hasPicker teste une fonction de l'API au moment de s'en servir : une extension ou un réglage du navigateur peut la retirer */
const hasPicker = name => { try{ return typeof window[name] === 'function'; }catch(e){ return false; } };
let FSA = hasPicker('showDirectoryPicker');
/* save : dossier d'enregistrement (lecture et écriture) ; search : dossier de recherche distinct, en lecture
   seule, facultatif. état : none (rien de choisi) | ok | need (autorisation à redonner) | lost (dossier
   introuvable) | unsupported (navigateur sans écriture directe) */
const FD = {save:{h:null, state:FSA?'none':'unsupported'}, search:{h:null, state:FSA?'none':'unsupported'}};
const DIR_FICHES = 'fiches', DIR_TRASH = 'supprimees';
let SYNCMAP = {save:{}, search:{}};   // par dossier : chemin -> [taille, date de modification, [[id, updated], ...]]
let TOMB = {};                        // fiches supprimées sur ce poste : id -> date de suppression (ISO)
let DIR_ASKED = false;                // le sélecteur de dossier a déjà été proposé à un enregistrement
let SYNCINFO = '';                    // avancement de la lecture ou de l'écriture, affiché dans la barre
let LASTSYNC = null;                  // bilan de la dernière lecture
let FLOCK = Promise.resolve();        // une seule opération sur les dossiers à la fois
const withFolderLock = fn => { const p = FLOCK.then(fn); FLOCK = p.then(()=>{}, ()=>{}); return p; };
const roleMode = role => role==='save' ? 'readwrite' : 'read';
const roleKey  = role => role==='save' ? 'dir' : 'sdir';
const errTxt   = e => (e && (e.message || e.name)) || String(e);
const modalOpen = () => $('#mask').classList.contains('on');

const ficheFile = id => 'fiche_'+String(id).replace(/[^A-Za-z0-9_-]/g,'')+'.json';
/* Le fichier d'une fiche est une sauvegarde à une seule fiche : la même enveloppe que la sauvegarde JSON
   complète, donc lisible par « Importer / Fusionner ». Le bloc resume n'est là que pour l'œil. */
function ficheJSON(rec){
  const d = rec.d || {};
  return JSON.stringify({
    format:'fiche-neuro-v1', app:'ADP '+APP_VERSION, exported:new Date().toISOString(),
    resume:{dossier:d.dossier||'', nom:d.nom||'', prenom:d.prenom||'', ddn:d.ddn||'', ad_num:d.ad_num||'',
            date_ex:d.date_ex||'', heure_ex:d.heure_ex||'', fiche_type:d.fiche_type||1},
    fiches:[rec]}, null, 1);
}
/* enveloppes acceptées : une fiche seule, une liste, {fiches:[...]} (sauvegarde, ou fichier d'une fiche) */
function recsFromJSON(o){
  if(Array.isArray(o)) return o;
  if(o && Array.isArray(o.fiches)) return o.fiches;
  if(o && o.fiche && o.fiche.d) return [o.fiche];
  if(o && o.d && o.id) return [o];
  return [];
}
const validRec = r => !!(r && typeof r==='object' && typeof r.id==='string' && /^[A-Za-z0-9_.-]{1,80}$/.test(r.id) &&
                         r.d && typeof r.d==='object' && !Array.isArray(r.d));

async function persistSync(){ try{ await metaSet('syncmap', SYNCMAP); }catch(e){} }
async function persistTomb(){ try{ await metaSet('deleted', TOMB); }catch(e){} }
/* tous les réglages dans un seul enregistrement : écrire seulement une partie perdrait les autres */
async function persistSettings(){
  await metaSet('settings',{poste:SET.poste, sep:SET.sep, pii:SET.pii, wedge:SET.wedge, scanRe:SET.scanRe,
                            hash:SET.hash, hashLen:SET.hashLen, searchSame:SET.searchSame, autoDl:SET.autoDl});
}

/* ---------- dossiers : choix, mémorisation, autorisation ---------- */
function folderFailed(role, e){
  const n = e && e.name;
  if(n==='NotAllowedError' || n==='SecurityError') FD[role].state = 'need';
  else if(n==='NotFoundError') FD[role].state = 'lost';
  updateBar();
}
async function permOf(h, mode){ try{ return await h.queryPermission({mode:mode}); }catch(e){ return 'denied'; } }
async function restoreDirs(){
  if(!FSA) return;
  for(const role of ['save','search']){
    let h = null; try{ h = await metaGet(roleKey(role)); }catch(e){}
    if(!h || typeof h.queryPermission!=='function') continue;
    FD[role].h = h;
    FD[role].state = (await permOf(h, roleMode(role)))==='granted' ? 'ok' : 'need';
  }
}
/* ---------- diagnostic du navigateur ---------- */
/* Quand le navigateur n'offre pas l'écriture directe, ou que le sélecteur échoue, l'utilisateur doit voir
   pourquoi, et disposer de ce qui fonctionne malgré tout : archive ZIP, téléchargement automatique du JSON,
   import d'un dossier. Ce diagnostic ne contient aucune donnée de fiche. */
function envInfo(){
  const n = navigator, ua = n.userAgent || '';
  const tryv = f => { try{ return !!f(); }catch(e){ return false; } };
  return {
    ua: ua,
    brands: ((n.userAgentData && n.userAgentData.brands) || []).filter(b=>!/^Not.{1,3}A.{1,3}Brand/i.test(b.brand))
              .map(b=>b.brand+' '+b.version).join(', '),
    mobile: /Android|iPhone|iPad|iPod/i.test(ua) || !!(n.userAgentData && n.userAgentData.mobile),
    proto: location.protocol,
    secure: window.isSecureContext !== false,
    top: tryv(()=>window.top === window),
    native: pwaNative(),
    brave: !!n.brave,
    dir: hasPicker('showDirectoryPicker'),
    save: hasPicker('showSaveFilePicker'),
    folderIn: tryv(()=>'webkitdirectory' in document.createElement('input')),
    zip: typeof CompressionStream === 'function' && typeof DecompressionStream === 'function'
  };
}
function envCause(i){
  if(i.dir) return 'L’écriture directe dans un dossier est disponible dans ce navigateur.';
  if(i.native) return 'Cette version est une application native : le système n’y offre pas l’écriture directe dans un dossier.';
  if(!i.secure) return 'La page est ouverte en connexion non sécurisée ('+esc(i.proto)+'), ce qui masque cette fonction. '+
    'Ouvrez le fichier <code>index.html</code> directement depuis le disque, ou la page en HTTPS.';
  if(!i.top) return 'La page est affichée dans un cadre d’une autre page : le navigateur n’y autorise pas le choix d’un dossier. '+
    'Ouvrez-la dans sa propre fenêtre.';
  if(i.brave) return 'Brave désactive cette fonction par défaut. Saisissez <code>brave://flags/#file-system-access-api</code> '+
    'dans la barre d’adresse, choisissez Activé, puis relancez le navigateur.';
  if(/Firefox\//.test(i.ua)) return 'Firefox ne gère pas l’écriture directe dans un dossier.';
  if(i.mobile) return 'Sur téléphone et sur tablette, les navigateurs n’offrent pas l’écriture directe dans un dossier.';
  if(/Safari\//.test(i.ua) && !/Chrome\/|Chromium\/|Edg\/|OPR\//.test(i.ua)) return 'Safari ne gère pas l’écriture directe dans un dossier.';
  return 'La page ne permet pas d’en connaître la cause : un mode protégé du navigateur, une extension ou une stratégie de '+
    'l’établissement peut désactiver cette fonction. Chrome et Edge sur ordinateur la proposent normalement.';
}
function diagHTML(i){
  const yes = '<b style="color:var(--ok)">oui</b>', no = '<b style="color:var(--bad)">non</b>', yn = v => v ? yes : no;
  const rows = [
    ['Navigateur', esc(i.brands || 'non indiqué')+'<br><span style="color:var(--ink2);font-size:11px">'+esc(i.ua)+'</span>'],
    ['Adresse de la page', esc(i.proto)+' · contexte sécurisé : '+yn(i.secure)],
    ['Page dans sa propre fenêtre', yn(i.top)],
    ['Choisir un dossier (<code>showDirectoryPicker</code>)', yn(i.dir)],
    ['Enregistrer à l’endroit voulu (<code>showSaveFilePicker</code>)', yn(i.save)],
    ['Charger un dossier en lecture', yn(i.folderIn)],
    ['Compression ZIP', i.zip ? yes : '<b style="color:var(--warn)">non</b> : l’archive est alors créée sans compression'],
    ['Application native', i.native ? 'oui' : 'non']
  ];
  return '<table style="margin:8px 0">'+rows.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>').join('')+'</table>';
}
function envText(i){
  const yn = v => v ? 'oui' : 'non';
  return ['ADP '+APP_VERSION+' : diagnostic du navigateur',
    'Navigateur : '+(i.brands || 'non indiqué'), 'Agent : '+i.ua,
    'Adresse : '+i.proto+' (contexte sécurisé : '+yn(i.secure)+')', 'Fenêtre principale : '+yn(i.top),
    'showDirectoryPicker : '+yn(i.dir), 'showSaveFilePicker : '+yn(i.save),
    'Chargement de dossier : '+yn(i.folderIn), 'Compression ZIP : '+yn(i.zip), 'Application native : '+yn(i.native),
    'Cause probable : '+envCause(i).replace(/<[^>]+>/g, '')].join('\n');
}
function copyDiag(){
  const t = envText(envInfo());
  (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(t) : Promise.reject())
    .then(()=>toast('Diagnostic copié'), ()=>toast('Copie impossible'));
}
function openDiag(){
  const i = envInfo();
  modalHTML('<h3>Diagnostic du navigateur</h3><div class="note">'+envCause(i)+'</div>'+diagHTML(i)+
    '<button class="tb" onclick="copyDiag()">Copier le diagnostic</button>');
}
/* ce qui reste possible sans écriture directe dans un dossier */
function altActionsHTML(){
  const box = h => '<div style="border:1px solid var(--bd2);border-radius:6px;padding:8px 10px;margin-bottom:8px">'+h+'</div>';
  return box('<b>Exporter tout en JSON</b> : toutes les fiches, une par fichier, réunies dans une archive ZIP enregistrée dans '+
      'Téléchargements, ou à l’endroit que le navigateur vous laisse choisir.'+
      '<div style="margin-top:6px"><button class="tb pri" onclick="closeModal();openExportJSON()">Exporter tout en JSON…</button></div>')+
    box('<label style="cursor:pointer"><input type="checkbox" onchange="setAutoDl(this.checked)"'+(SET.autoDl?' checked':'')+'> '+
      '<b>Télécharger le JSON de la fiche à chaque enregistrement</b></label><br>'+
      '<span style="color:var(--ink2)">'+(pwaNative()
        ? 'Le fichier <code>fiche_….json</code> est enregistré dans les documents de l’application, puis la feuille de partage du système s’ouvre.'
        : 'Le fichier <code>fiche_….json</code> part dans le dossier de téléchargement du navigateur. '+
          'Pour le fixer une fois : paramètres du navigateur, Téléchargements, Emplacement, puis désactiver « Demander où enregistrer '+
          'chaque fichier avant de le télécharger ».')+'</span>')+
    box('<b>Reprendre des fiches déjà exportées</b> : « Importer / Fusionner » lit un fichier .json, une archive .zip ou un dossier entier.'+
      '<div style="margin-top:6px"><button class="tb" onclick="closeModal();openImport()">Importer / Fusionner…</button></div>');
}
async function setAutoDl(v){
  SET.autoDl = !!v; await persistSettings(); updateBar();
  toast(v ? 'Le JSON de chaque fiche sera téléchargé à l’enregistrement' : 'Téléchargement automatique du JSON désactivé');
}
/* navigateur sans écriture directe : l'explication, puis les solutions qui fonctionnent quand même */
function noFolderModal(){
  const i = envInfo();
  modalHTML('<h3>Dossier de données : indisponible dans ce navigateur</h3>'+
    '<div class="note" style="background:#fbeee4;border-color:#e3bd9a"><b>Ce navigateur ne propose pas l’écriture directe dans un dossier</b> '+
    '(API File System Access). '+envCause(i)+
    (i.native ? '' : '<br><br>Pour choisir un dossier une seule fois et y retrouver chaque fiche à l’enregistrement, ouvrez ce fichier avec '+
    '<b>Microsoft Edge</b> ou <b>Google Chrome</b> sur ordinateur (clic droit sur <code>index.html</code>, <i>Ouvrir avec</i>).')+'</div>'+
    '<h4 style="margin:12px 0 6px">Ce qui fonctionne quand même ici</h4>'+altActionsHTML()+
    '<h4 style="margin:12px 0 6px">Diagnostic</h4>'+diagHTML(i)+
    '<button class="tb" onclick="copyDiag()">Copier le diagnostic</button>');
}
/* le sélecteur a échoué pour une autre raison que l'annulation par l'utilisateur */
function pickerErrorModal(e, retry){
  const n = e && e.name;
  const why = n==='SecurityError'
      ? 'Le navigateur a refusé ce dossier ou ce geste : dossier système, Documents, Téléchargements ou Bureau choisis eux-mêmes, '+
        'ou accès interdit par un réglage du navigateur ou de l’établissement. Choisissez un <b>sous-dossier dédié</b> '+
        '(par exemple « ADP-fiches »).'
    : n==='NotAllowedError'
      ? 'L’accès a été refusé ou bloqué (réglage « Modifier des fichiers » du site, ou stratégie de l’établissement).'
    : 'Le navigateur n’a pas pu ouvrir le sélecteur de dossier.';
  modalHTML('<h3>Le choix du dossier a échoué</h3>'+
    '<div class="note" style="background:#fbeee4;border-color:#e3bd9a">'+why+
    (envInfo().top ? '' : '<br><br>'+envCause({dir:false, native:false, secure:true, top:false}))+'<br><br>'+
    '<span style="color:var(--ink2)">Réponse du navigateur : <code>'+esc(n || 'erreur')+'</code> '+esc(errTxt(e))+'</span></div>'+
    (retry ? '<p style="margin:10px 0 6px"><button class="tb pri" onclick="'+retry+'">Réessayer</button></p>' : '')+
    '<h4 style="margin:12px 0 6px">Ce qui fonctionne quand même</h4>'+altActionsHTML()+
    '<p style="margin:8px 0 0;font-size:11.5px"><a href="#" onclick="openDiag();return false">Diagnostic du navigateur</a></p>');
}
/* Le sélecteur ne s'ouvre que sur un geste de l'utilisateur : cette fonction doit donc être appelée avant
   tout await, depuis un clic ou une touche. */
async function chooseFolder(role, opt){
  opt = opt || {};
  if(!hasPicker('showDirectoryPicker')){ noFolderModal(); return false; }
  let h;
  try{ h = await window.showDirectoryPicker({mode:roleMode(role), id:role==='save'?'ficheneuro':'ficherecherche', startIn:'documents'}); }
  catch(e){
    if(e && e.name==='AbortError') return false;
    pickerErrorModal(e, role==='save' ? 'chooseSave()' : 'chooseSearch()');
    return false;
  }
  FD[role].h = h; FD[role].state = 'ok';
  try{ await metaSet(roleKey(role), h); }
  catch(e){ toast('Dossier utilisable pour cette session seulement : ce navigateur ne peut pas le mémoriser'); }
  SYNCMAP[role] = {}; await persistSync();
  if(role==='search'){ SET.searchSame = false; await persistSettings(); }
  updateBar();
  if(!opt.noAfter) await afterConnect({announce:true});
  return true;
}
/* nouvelle autorisation du dossier déjà choisi : appelée dans le geste de l'utilisateur */
const REGRANTING = {};
function regrant(role){
  role = role==='search' ? 'search' : 'save';
  if(REGRANTING[role]) return REGRANTING[role];                       // une seule demande à la fois par dossier
  const o = FD[role];
  const run = (async()=>{
    if(!o.h){ const ok = await chooseFolder(role); return ok ? 'granted' : 'denied'; }
    let p;
    try{ p = await o.h.requestPermission({mode:roleMode(role)}); }
    catch(e){ toast('Autorisation impossible : '+errTxt(e)); updateBar(); return 'error'; }
    if(p!=='granted'){ toast('Accès au dossier refusé'); updateBar(); return 'denied'; }
    o.state = 'ok'; updateBar();
    await afterConnect({announce:true});
    return 'granted';
  })();
  REGRANTING[role] = run;
  const done = () => { delete REGRANTING[role]; };
  run.then(done, done);
  return run;
}
const needsGrant = role => !!(FD[role].h && FD[role].state==='need' && (role==='save' || !SET.searchSame));
function regrantNeeded(){ return regrant(needsGrant('save') ? 'save' : 'search'); }
/* Au premier clic de la session, le navigateur redemande l'autorisation du dossier : l'utilisateur n'a rien à
   chercher ni à rechoisir. Le dossier de recherche, s'il est distinct, suit au clic suivant. */
let RECO_ARMED = false;
function armReconnect(){
  if(RECO_ARMED || !(needsGrant('save') || needsGrant('search'))) return;
  RECO_ARMED = true;
  const go = ev => {
    /* pas depuis une fenêtre ouverte, ni depuis le bandeau ou la barre d'état, qui ont leur propre bouton */
    if(ev && ev.target && ev.target.closest && ev.target.closest('#mask, #folderbanner, #dbstate')) return;
    /* le navigateur n'accepte la demande que sur un geste valide : à la souris dès l'appui, au toucher au relâchement */
    if(navigator.userActivation && !navigator.userActivation.isActive) return;
    document.removeEventListener('pointerdown', go, true); document.removeEventListener('pointerup', go, true); RECO_ARMED = false;
    const role = needsGrant('save') ? 'save' : 'search';
    regrant(role).then(r=>{ if(r==='granted' && (needsGrant('save') || needsGrant('search'))) armReconnect(); });
  };
  document.addEventListener('pointerdown', go, true);
  document.addEventListener('pointerup', go, true);
}
/* À l'enregistrement : dossier prêt, ou à autoriser, ou à choisir pour la première fois. Appelée avant tout
   await (geste de l'utilisateur). Résultat : {ok, fresh} ; fresh = le dossier vient d'être connecté, il faut
   donc le lire avant d'y écrire. */
function ensureFolderOnSave(){
  const o = FD.save;
  if(!FSA) return Promise.resolve({ok:false});
  if(o.state==='ok') return Promise.resolve({ok:true, fresh:false});
  if(o.state==='need' && o.h){
    let pr; try{ pr = o.h.requestPermission({mode:'readwrite'}); }catch(e){ return Promise.resolve({ok:false}); }
    return pr.then(p=>{ if(p==='granted'){ o.state = 'ok'; return {ok:true, fresh:true}; } return {ok:false}; }, ()=>({ok:false}));
  }
  if(o.state==='none' && !DIR_ASKED){
    DIR_ASKED = true; metaSet('dirasked', 1);
    return chooseFolder('save', {noAfter:true}).then(ok=>({ok:ok, fresh:ok}));
  }
  return Promise.resolve({ok:false});
}

/* ---------- lecture et écriture des fichiers ---------- */
/* Un antivirus ou l'indexation de Windows peut verrouiller un instant le fichier en cours d'écriture : deux nouveaux
   essais, sauf pour une erreur qui ne se règle pas en attendant. */
async function writeIn(dir, name, txt){
  let last;
  for(let t=0; t<3; t++){
    let w = null;
    try{
      const fh = await dir.getFileHandle(name, {create:true});
      w = await fh.createWritable();
      await w.write(new Blob([txt], {type:'application/json'})); await w.close(); w = null;
      return fh;
    }catch(e){
      last = e;
      if(w){ try{ await w.abort(); }catch(_){} }
      const n = e && e.name;
      if(n==='NotAllowedError' || n==='SecurityError' || n==='NotFoundError' || n==='TypeMismatchError' || n==='QuotaExceededError') break;
      if(t < 2) await new Promise(r=>setTimeout(r, 150*(t+1)));
    }
  }
  throw last;
}
async function writeFicheFile(rec){
  const dir = await FD.save.h.getDirectoryHandle(DIR_FICHES, {create:true}), name = ficheFile(rec.id);
  const fh = await writeIn(dir, name, ficheJSON(rec));
  const f = await fh.getFile();
  SYNCMAP.save[DIR_FICHES+'/'+name] = [f.size, f.lastModified, [[rec.id, rec.updated||'']]];
}
/* le fichier d'une fiche supprimée passe dans fiches/supprimees, avec une copie complète de la fiche */
async function trashFicheFileLocked(rec){
  const dir = await FD.save.h.getDirectoryHandle(DIR_FICHES, {create:true}), name = ficheFile(rec.id);
  let exists = true;
  try{ await dir.getFileHandle(name); }catch(e){ exists = false; }
  const td = await dir.getDirectoryHandle(DIR_TRASH, {create:true});
  await writeIn(td, name, ficheJSON(rec));
  if(exists) await dir.removeEntry(name);
  delete SYNCMAP.save[DIR_FICHES+'/'+name];
}
/* identifiants des fiches déjà supprimées (par un autre poste, le cas échéant) : id -> date de suppression en ms */
async function listTrashLocked(){
  const out = new Map();
  try{
    const dir = await FD.save.h.getDirectoryHandle(DIR_FICHES), td = await dir.getDirectoryHandle(DIR_TRASH);
    for await (const [name, h] of td.entries()){
      const m = /^fiche_(.+)\.json$/.exec(name);
      if(m && h.kind==='file'){ const f = await h.getFile(); out.set(m[1], f.lastModified); }
    }
  }catch(e){}
  return out;
}
/* les fichiers JSON à la racine (sauvegardes, fiches isolées) et tous ceux du sous-dossier fiches */
async function listJsonFiles(dir){
  const out = [];
  for await (const [name, h] of dir.entries()){
    if(h.kind==='file' && /^(fiche_|sauvegarde_neuro).*\.json$/i.test(name)) out.push({path:name, h:h});
    else if(h.kind==='directory' && name===DIR_FICHES){
      for await (const [n2, h2] of h.entries()) if(h2.kind==='file' && /\.json$/i.test(n2)) out.push({path:DIR_FICHES+'/'+n2, h:h2});
    }
  }
  return out;
}

/* ---------- fusion des fiches lues dans la base locale ---------- */
/* Une fiche lue dans un fichier ne doit pas pouvoir injecter du HTML par ses champs d'affichage : les dates et
   les heures sont contrôlées, les nombres doivent en être. Les textes libres sont échappés à l'affichage. */
function sanitizeRec(r){
  const d = r.d;
  Object.keys(d).forEach(k=>{
    const f = FIELDS[k]; if(!f) return;
    const v = d[k];
    if(f.t==='date' && !(typeof v==='string' && /^\d{4}-\d{2}-\d{2}$/.test(v))) delete d[k];
    else if(f.t==='time' && !(typeof v==='string' && /^\d{1,2}:\d{2}$/.test(v))) delete d[k];
    else if((f.t==='num' || f.t==='calc') && typeof v!=='number') delete d[k];
  });
  r.created = typeof r.created==='string' ? r.created : '';
  r.updated = typeof r.updated==='string' ? r.updated : r.created;
  return r;
}
/* Une fiche inconnue est ajoutée ; une fiche connue n'est remplacée que si la version lue est plus récente ;
   une fiche supprimée ici n'est pas reprise, sauf si elle a été modifiée depuis (force : import manuel). */
async function mergeOne(r, st, force){
  sanitizeRec(r);
  if(!force){ const t = TOMB[r.id]; if(t && (r.updated||'') <= t){ st.ignored++; return 'tomb'; } }
  const res = await idbMerge(r);
  if(res==='add') st.add++; else if(res==='upd') st.upd++; else if(res==='same') st.same++; else st.bad++;
  return res;
}
async function scanFolderLocked(role, st){
  const o = FD[role], map = SYNCMAP[role] || (SYNCMAP[role] = {});
  let files;
  try{ files = await listJsonFiles(o.h); }
  catch(e){ folderFailed(role, e); st.errors.push(role); return; }
  const seen = {}, trash = [];
  let i = 0;
  for(const x of files){
    seen[x.path] = 1; i++;
    let f; try{ f = await x.h.getFile(); }catch(e){ st.bad++; continue; }
    const old = map[x.path];
    if(old && old[0]===f.size && old[1]===f.lastModified) continue;                  // inchangé depuis la dernière lecture
    SYNCINFO = 'lecture du dossier : '+i+'/'+files.length; if(i%10===0) updateBar();
    let recs;
    try{ recs = recsFromJSON(JSON.parse(await f.text())); }
    catch(e){ st.bad++; map[x.path] = [f.size, f.lastModified, []]; continue; }
    const ids = []; let failed = false;
    for(const r of recs){
      if(!validRec(r)){ st.bad++; continue; }
      ids.push([r.id, r.updated||'']);
      const res = await mergeOne(r, st, false);
      if(res==='err') failed = true;
      if(res==='tomb' && role==='save' && x.path.indexOf(DIR_FICHES+'/')===0) trash.push(r);
    }
    if(!failed){ map[x.path] = [f.size, f.lastModified, ids]; st.files++; }       // un échec d'écriture fait relire le fichier la fois suivante
  }
  Object.keys(map).forEach(p=>{ if(!seen[p]) delete map[p]; });
  for(const r of trash){ try{ await trashFicheFileLocked(r); }catch(e){} }           // fiche supprimée ici, fichier resté dans le dossier
}
/* lit les dossiers prêts (enregistrement, et recherche s'il est distinct) ; null si aucun n'est lisible */
async function syncLocked(){
  const roles = ['save','search'].filter(r=>FD[r].state==='ok' && FD[r].h && (r==='save' || !SET.searchSame));
  if(!roles.length) return null;
  const st = {files:0, add:0, upd:0, same:0, bad:0, ignored:0, errors:[]};
  SYNCINFO = 'lecture du dossier…'; updateBar();
  /* un fichier déjà lu dont une fiche manque à la base locale (données effacées, échec d'écriture) est relu */
  const have = new Set(DB.map(f=>f.id));
  Object.keys(SYNCMAP).forEach(role=>Object.keys(SYNCMAP[role]||{}).forEach(p=>{
    if((SYNCMAP[role][p][2]||[]).some(x=>!have.has(x[0]) && !TOMB[x[0]])) delete SYNCMAP[role][p];
  }));
  try{
    for(const role of roles) await scanFolderLocked(role, st);
    if(st.add || st.upd){ DB = await idbAll(); await renumberAll(); }
    await persistSync();
  }finally{ SYNCINFO = ''; }
  LASTSYNC = {at:new Date().toISOString(), files:st.files, add:st.add, upd:st.upd, bad:st.bad};
  return st;
}
/* écrit dans le dossier d'enregistrement les fiches qu'il n'a pas, ou qu'il a en version plus ancienne
   (force : toutes). Une fiche supprimée ailleurs, et non modifiée depuis, n'est pas réécrite. */
async function exportPendingLocked(force){
  if(FD.save.state!=='ok' || !FD.save.h) return 0;
  /* seuls les fichiers du sous-dossier fiches comptent : une fiche qui ne figure que dans une sauvegarde
     agrégée à la racine reçoit son propre fichier */
  const fu = new Map();
  Object.keys(SYNCMAP.save).filter(p=>p.indexOf(DIR_FICHES+'/')===0)
    .forEach(p=>(SYNCMAP.save[p][2]||[]).forEach(x=>{ if(!fu.has(x[0]) || x[1] > fu.get(x[0])) fu.set(x[0], x[1]); }));
  const trashed = force ? new Map() : await listTrashLocked();
  const todo = DB.filter(r=>{
    if(force) return true;
    const u = fu.get(r.id);
    if(u!=null && (r.updated||'') <= u) return false;
    const t = trashed.get(r.id);
    if(t!=null && (r.updated||'') <= new Date(t).toISOString()) return false;
    return true;
  });
  let n = 0;
  try{
    for(const r of todo){
      SYNCINFO = 'écriture des fiches : '+(n+1)+'/'+todo.length; if(n%10===0) updateBar();
      await writeFicheFile(r); n++;
    }
  }finally{ SYNCINFO = ''; }
  return n;
}
async function writeDataLocked(silent){
  if(FD.save.state!=='ok' || !FD.save.h) return false;
  try{
    const recs = sortedDB(), dir = FD.save.h;
    await writeIn(dir, 'donnees_neuro.csv', buildCSV(recs, SET.sep, SET.pii));
    await writeIn(dir, 'dictionnaire_variables.csv', buildDict(SET.sep, SET.pii));
    if(!silent) toast('Fichier de données et dictionnaire mis à jour');
    return true;
  }catch(e){ folderFailed('save', e); if(!silent) toast('Écriture impossible : '+errTxt(e)); return false; }
}
/* le fichier statistique et son dictionnaire (réglages modifiés, fiche supprimée, import) */
function writeDataFiles(silent){ return withFolderLock(()=>writeDataLocked(silent)); }

/* ---------- enchaînements ---------- */
function refreshAfterSync(st){
  if(st && (st.add || st.upd)){
    /* la fiche ouverte a pu être remplacée par une version plus récente du dossier */
    if(REC && !DIRTY){ const f = DB.find(x=>x.id===REC.id); if(f && (f.updated||'') > (REC.updated||'')) REC = JSON.parse(JSON.stringify(f)); }
    if(REC && REC.d && REC.d.dossier) autofillFromDossier();
    renderList(); renderForm();
  }
  updateBar();
}
function reportSync(st, nExp, announce){
  if(!st){ if(announce) toast('Aucun dossier lisible'); return; }
  const p = [];
  if(st.add) p.push(st.add+' fiche'+(st.add>1?'s':'')+' ajoutée'+(st.add>1?'s':''));
  if(st.upd) p.push(st.upd+' mise'+(st.upd>1?'s':'')+' à jour');
  if(nExp) p.push(nExp+' fiche'+(nExp>1?'s':'')+' écrite'+(nExp>1?'s':'')+' dans le dossier');
  if(st.bad) p.push(st.bad+' fichier'+(st.bad>1?'s':'')+' illisible'+(st.bad>1?'s':''));
  if(p.length) toast('Dossier de données : '+p.join(', '));
  else if(announce) toast('Dossier relu : rien de nouveau');
}
/* dossier qui vient d'être connecté ou autorisé, ou relecture demandée : lire, compléter, mettre à jour le CSV */
function afterConnect(opt){
  opt = opt || {};
  return withFolderLock(async()=>{
    let st = null, n = 0;
    try{
      st = await syncLocked();
      if(FD.save.state==='ok' && FD.save.h){
        n = await exportPendingLocked(false);
        if(n || (st && (st.add || st.upd)) || opt.csv) await writeDataLocked(true);
      }
      await persistSync();
    }catch(e){ folderFailed('save', e); }
    finally{ SYNCINFO = ''; }
    refreshAfterSync(st);
    reportSync(st, n, opt.announce);
    return st;
  });
}
/* après l'enregistrement d'une fiche : son fichier JSON, puis le CSV et le dictionnaire */
function afterSave(rec, fresh){
  return withFolderLock(async()=>{
    if(FD.save.state!=='ok' || !FD.save.h) return false;
    let st = null;
    try{
      if(fresh){ st = await syncLocked(); await exportPendingLocked(false); }         // première connexion : lire avant d'écrire
      else await writeFicheFile(rec);
      await writeDataLocked(true);
      await persistSync();
    }catch(e){ folderFailed('save', e); return false; }
    finally{ SYNCINFO = ''; updateBar(); }
    if(st) refreshAfterSync(st);
    return true;
  });
}
/* bouton « Réécrire tout le dossier » : relire, réécrire toutes les fiches, le CSV et le dictionnaire */
function rewriteFolder(){
  return withFolderLock(async()=>{
    if(FD.save.state!=='ok' || !FD.save.h){ toast('Dossier d’enregistrement non connecté'); return false; }
    try{
      const st = await syncLocked();
      const n = await exportPendingLocked(true);
      await writeDataLocked(true); await persistSync();
      refreshAfterSync(st);
      toast('Dossier réécrit : '+n+' fiche'+(n>1?'s':'')+', fichier de données et dictionnaire');
      return true;
    }catch(e){ folderFailed('save', e); toast('Écriture impossible : '+errTxt(e)); return false; }
    finally{ SYNCINFO = ''; updateBar(); }
  });
}
/* à l'ouverture : relire le dossier pendant que la fiche s'affiche, ou demander l'autorisation au premier clic */

  if(FD.save.state==='ok' || (!SET.searchSame && FD.search.state==='ok')) await afterConnect({});

/* =====================================================================
   ENREGISTREMENT / NAVIGATION
   ===================================================================== */
async function saveFiche(){
  computeAll();
  if(!REC.d.dossier){ toast('Le numero de dossier est obligatoire'); const i=$('#i_dossier'); if(i){i.classList.add('req');i.focus();} return; }
  if(!REC.d.date_ex||!REC.d.heure_ex){ toast("Date et heure de l'examen obligatoires"); return; }
  /* Dossier de données : prêt, à autoriser, ou à choisir pour la première fois. Lancé avant tout await, car
     le navigateur n'ouvre le sélecteur ou la demande d'autorisation que sur un geste de l'utilisateur. */
  const folder = ensureFolderOnSave();
  REC.updated=new Date().toISOString();
  /* les saisies de dates en cours de frappe sont un état d'affichage, pas une donnée */
  const snap = JSON.parse(JSON.stringify(REC));
  delete snap._badDate; delete snap._badTime;
  await idbPut(snap);
  DB = await idbAll();
  await renumberAll();
  const me = DB.find(x=>x.id===REC.id); if(me) REC.d.num_ex = me.d.num_ex;
  DIRTY=false;
  await metaSet('draft',null);
  renderList(); updateBar();          // la fiche est enregistrée dans le navigateur, même si le sélecteur de dossier est encore ouvert
  /* le JSON de la fiche, puis le CSV et le dictionnaire, dans le dossier de données */
  const fo = await folder;
  const w = (fo && fo.ok) ? await afterSave(me || snap, !!fo.fresh) : false;
  /* pas de dossier de données prêt : le JSON de la fiche est téléchargé si l'option est cochée */
  const dn = (!w && SET.autoDl) ? downloadFiche(me || snap) : '';
  renderList(); renderForm(); updateBar();
  toast('Fiche enregistrée'+saveNote(w, dn));
}
/* le JSON d'une fiche, téléchargé : il part dans le dossier de téléchargement du navigateur */
function downloadFiche(rec){
  const name = ficheFile(rec.id);
  dl(name, ficheJSON(rec), 'application/json');
  return name;
}
let NOFSA_HINTED = false;
function saveNote(w, dn){
  if(w) return ' — JSON écrit dans le dossier « '+(FD.save.h ? FD.save.h.name : '')+' »';
  if(dn) return ' — JSON téléchargé ('+dn+')';
  if(!FSA){
    if(NOFSA_HINTED) return '';
    NOFSA_HINTED = true;                                   // dit une fois par session, pas à chaque enregistrement
    return ' — JSON non écrit : ce navigateur n’écrit pas dans un dossier (bouton « Dossier de données »)';
  }
  switch(FD.save.state){
    case 'ok':   return ' — écriture dans le dossier impossible';
    case 'need': return ' — dossier de données à autoriser';
    case 'lost': return ' — dossier de données introuvable';
    default:     return ' — aucun dossier de données choisi (bouton « Dossier de données »)';
  }
}
function newFiche(){
  if(DIRTY && !confirm('La fiche en cours contient des modifications non enregistrees. Continuer ?')) return;
  REC=blank(); DIRTY=false; PAGE=1; TYPE_CHOISI=false; renderForm(); renderList(); updateBar();
  window.scrollTo(0,0); setTimeout(()=>{const i=$('#i_dossier'); if(i)i.focus();},60);
}
function newFollowUp(){
  if(DIRTY && !confirm('Modifications non enregistrees. Continuer ?')) return;
  const src=JSON.parse(JSON.stringify(REC.d));
  /* les photographies appartiennent à l'examen où elles ont été prises : un ré-examen repart sans elles */
  const keep=['dossier','nom','prenom','sexe','ddn','date_acc','heure_acc','ad_num','examinateur'];
  const nd={}; keep.forEach(k=>{ if(src[k]!=null) nd[k]=src[k]; });
  const now=new Date(); nd.date_ex=iso(now); nd.heure_ex=hhmm(now);
  /* Un re-examen du meme sujet est une fiche de suivi : les encarts de plongee
     appartiennent a la fiche initiale et ne sont pas ressaisis. */
  nd.fiche_type = 2;
  REC=blank(); REC.d=nd; DIRTY=true; PAGE=1; TYPE_CHOISI=true; renderForm(); renderList(); updateBar();
  window.scrollTo(0,0); toast('Nouvel examen pour le dossier '+(nd.dossier||'-'));
}
function loadFiche(id){
  if(DIRTY && !confirm('Modifications non enregistrees. Continuer ?')) return;
  const f=DB.find(x=>x.id===id); if(!f) return;
  REC=JSON.parse(JSON.stringify(f)); DIRTY=false; PAGE=1; TYPE_CHOISI=true; renderForm(); renderList(); updateBar(); window.scrollTo(0,0);
}
async function delFiche(id,ev){
  ev.stopPropagation();
  const f=DB.find(x=>x.id===id); if(!f) return;
  if(!confirm('Supprimer la fiche du dossier '+(f.d.dossier||'-')+' du '+frDate(f.d.date_ex)+' ?'+
              (FD.save.state==='ok' ? '\n\nSon fichier JSON est déplacé dans fiches/supprimees, il n’est pas effacé du disque.' : ''))) return;
  /* la suppression est mémorisée : une relecture du dossier ne doit pas ressusciter la fiche */
  TOMB[id] = new Date().toISOString(); await persistTomb();
  await idbDel(id); DB=await idbAll(); await renumberAll();
  if(FD.save.state==='ok'){
    await withFolderLock(async()=>{ try{ await trashFicheFileLocked(f); await persistSync(); }catch(e){ folderFailed('save', e); } });
  }
  await writeDataFiles(true);
  if(REC.id===id){ REC=blank(); DIRTY=false; }
  renderList(); renderForm(); updateBar(); toast('Fiche supprimee');
}

    .filter(f=>{
      if(!q) return true;
      const hay = norm([f.d.dossier, f.d.ad_num, f.d.examinateur, f.d.nom, f.d.prenom, f.d.ddn, frDate(f.d.ddn)].join(' '));
      return norm(q).split(' ').filter(Boolean).every(t=>hay.indexOf(t)>=0);
    });
  const el=$('#list'); if(!el) return;
  el.innerHTML = recs.length? recs.map(f=>'<div class="fitem'+(REC&&f.id===REC.id?' cur':'')+'" onclick="loadFiche(\''+f.id+'\')">'+
    '<div class="d">'+esc(f.d.dossier||'(sans numero de dossier)')+(f.d.num_ex?' <span class="badge">ex. '+f.d.num_ex+'</span>':'')+'</div>'+
    '<div class="m">'+frDate(f.d.date_ex)+' '+(f.d.heure_ex||'')+(f.d.ad_num?' &middot; AD n&deg; '+esc(f.d.ad_num):'')+(f.d.examinateur?' &middot; '+esc(f.d.examinateur):'')+
    '<button class="clr" style="float:right" title="Supprimer" onclick="delFiche(\''+f.id+'\',event)">&#10006;</button></div></div>').join('')
    : '<div style="color:#8a94a3;font-size:12px;padding:6px">Aucune fiche enregistree.</div>';
}

/* Dans un WebView natif, <a download> et les URL blob ne declenchent aucun
   telechargement. On ecrit alors le fichier dans les documents de
   l'application puis on ouvre la feuille de partage du systeme. */
function dlBlob(name,blob){
  const C = window.Capacitor && window.Capacitor.Plugins;
  if(C && C.Filesystem){
    const rd = new FileReader();
    rd.onload = async()=>{
      try{
        const r = await C.Filesystem.writeFile({
          path: name, data: String(rd.result).split(',')[1] || '', directory: 'DOCUMENTS', recursive: true });
        if(C.Share){
          await C.Share.share({ title: name, url: r.uri,
            dialogTitle: 'Enregistrer ou envoyer ' + name });
        }else{
          toast('Enregistre dans les documents : ' + name);
        }
      }catch(e){ toast('Enregistrement impossible : ' + e); }
    };
    rd.readAsDataURL(blob);
    return;
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},10000);
}
function dl(name,txt,type){
  const C = window.Capacitor && window.Capacitor.Plugins;
  if(C && C.Filesystem){
    (async()=>{
      try{
        const r = await C.Filesystem.writeFile({
          path: name, data: txt, directory: 'DOCUMENTS', encoding: 'utf8', recursive: true });
        if(C.Share){
          await C.Share.share({ title: name, url: r.uri,
            dialogTitle: 'Enregistrer ou envoyer ' + name });
        }else{
          toast('Enregistre dans les documents : ' + name);
        }
      }catch(e){ toast('Enregistrement impossible : ' + e); }
    })();
    return;
  }
  dlBlob(name, new Blob([txt],{type:type||'text/csv;charset=utf-8'}));
}

/* =====================================================================
   ARCHIVE ZIP : écriture et lecture, sans bibliothèque
   Noms en UTF-8, pas de ZIP64 (65 535 fichiers et 4 Gio au plus). Écriture : compression deflate quand le
   navigateur la propose (CompressionStream), sinon stockage tel quel. Lecture : stocké et deflate, somme de
   contrôle vérifiée pour chaque fichier.
   ===================================================================== */
const CRC_T = (function(){
  const t = new Uint32Array(256);
  for(let n=0; n<256; n++){ let c = n; for(let k=0; k<8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for(let i=0; i<u8.length; i++) c = CRC_T[(c ^ u8[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
const hasCompression = () => typeof CompressionStream === 'function' && typeof Blob === 'function' && !!Blob.prototype.stream;
async function flate(u8, Stream){
  const s = new Blob([u8]).stream().pipeThrough(new Stream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function zipBuild(files){
  if(files.length > 65000) throw new Error('trop de fichiers pour une archive ZIP');
  const enc = new TextEncoder(), now = new Date();
  const dtime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const ddate = ((Math.max(now.getFullYear(), 1980) - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  const parts = [], central = [];
  let off = 0, csize = 0;
  for(const f of files){
    const name = enc.encode(f.name), raw = f.data, crc = crc32(raw);
    let method = 0, body = raw;
    if(hasCompression() && raw.length > 100){
      try{ const z = await flate(raw, CompressionStream); if(z.length < raw.length){ method = 8; body = z; } }catch(e){}
    }
    const need = method ? 20 : 10;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, need, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, method, true); lh.setUint16(10, dtime, true); lh.setUint16(12, ddate, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, body.length, true); lh.setUint32(22, raw.length, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(lh.buffer, name, body);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, need, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, method, true); ch.setUint16(12, dtime, true); ch.setUint16(14, ddate, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, body.length, true); ch.setUint32(24, raw.length, true);
    ch.setUint16(28, name.length, true); ch.setUint32(42, off, true);
    central.push(ch.buffer, name);
    off += 30 + name.length + body.length; csize += 46 + name.length;
    if(off + csize + 22 > 0xFFFFFFFF) throw new Error('archive trop volumineuse (4 Gio au plus)');
  }
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, csize, true); end.setUint32(16, off, true);
  return new Blob(parts.concat(central, [end.buffer]), {type:'application/zip'});
}
/* contenu d'une archive : [{name, bytes, error}] ; bytes est null quand le fichier est illisible (error le dit) */
async function zipRead(blob){
  const buf = new Uint8Array(await blob.arrayBuffer()), dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let e = -1;
  for(let i = buf.length - 22; i >= 0 && i >= buf.length - 22 - 65535; i--){ if(dv.getUint32(i, true) === 0x06054b50){ e = i; break; } }
  if(e < 0) throw new Error('archive ZIP illisible : fin de l’archive introuvable');
  const n = dv.getUint16(e + 10, true), dec = new TextDecoder('utf-8'), out = [];
  let p = dv.getUint32(e + 16, true);
  for(let k=0; k<n; k++){
    if(p + 46 > buf.length || dv.getUint32(p, true) !== 0x02014b50) throw new Error('archive ZIP illisible : répertoire central');
    const flag = dv.getUint16(p + 8, true), method = dv.getUint16(p + 10, true), crc = dv.getUint32(p + 16, true),
          csz = dv.getUint32(p + 20, true), usz = dv.getUint32(p + 24, true), nl = dv.getUint16(p + 28, true),
          xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lo = dv.getUint32(p + 42, true);
    const name = dec.decode(buf.subarray(p + 46, p + 46 + nl)).replace(/\\/g, '/');
    p += 46 + nl + xl + cl;
    if(name.slice(-1) === '/') continue;                                   // entrée de dossier
    const ent = {name:name, bytes:null, error:''};
    out.push(ent);
    try{
      if(flag & 1) throw new Error('fichier chiffré');
      if(csz === 0xFFFFFFFF || usz === 0xFFFFFFFF || lo === 0xFFFFFFFF) throw new Error('ZIP64 non géré');
      if(lo + 30 > buf.length || dv.getUint32(lo, true) !== 0x04034b50) throw new Error('en-tête local absent');
      const start = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true);
      if(start + csz > buf.length) throw new Error('données tronquées');
      const body = buf.subarray(start, start + csz);
      let data;
      if(method === 0) data = body;
      else if(method === 8){
        if(typeof DecompressionStream !== 'function') throw new Error('décompression indisponible dans ce navigateur');
        data = await flate(body, DecompressionStream);
      }else throw new Error('méthode de compression '+method+' non gérée');
      if(crc32(data) !== crc) throw new Error('somme de contrôle incorrecte');
      ent.bytes = data;
    }catch(err){ ent.error = errTxt(err); }
  }
  return out;
}

/* =====================================================================

   Un fichier JSON par fiche, au format du dossier de données (fiche_<id>.json, lisible par « Importer / Fusionner ») :

function exportEntries(){

  return sortedDB().map(r=>{

    used.add(name.toLowerCase());
    return {name:name, rec:r};
  });
}

const sizeTxt = n => n < 1048576 ? Math.max(1, Math.round(n / 1024))+' Ko' : (n / 1048576).toFixed(n < 10485760 ? 1 : 0)+' Mo';
/* Le sélecteur est appelé avant tout await : il n'est accepté que juste après un clic. Un seul export à la fois,

const NUMKEYS = (function(){
  const s=new Set(['age','delai_min','gcs_tot','num_ex','sens_obj','dossier_pseudo',
                   'subj_nb','subj_nb_D','subj_nb_G','cut_nb','cut_nb_D','cut_nb_G',
                   'asia_lt','asia_pp','asia_uems','asia_lems','asia_sacral']);
  SPEC.forEach(sec=>sec.f.forEach(f=>{
    if(f.t==='choice'||f.t==='select'||f.t==='check'||f.t==='calc'||f.t==='num') s.add(f.k);
    if((f.t==='choice'||f.t==='select') && f.o.some(o=>typeof o.v==='string')) s.delete(f.k);
    if(f.flags) f.flags.forEach(fl=>s.add(f.k+'_'+fl.k));
  }));
  /* les trois modalités du Glasgow acceptent la valeur texte NC : les convertir
     en nombre à l'import la ferait disparaître silencieusement */
  ['gcs_y','gcs_v','gcs_m'].forEach(k=>s.delete(k));
  VEST.items.forEach(it=>s.add(it.k));
  echoKeys().forEach(k=>s.add(k));
  MODAL.filter(m=>m.mode==='derm').forEach(m=>{
    const p='sens_'+m.k+'_';
    ['score','score_D','score_G','nt','nb'].forEach(x=>s.add(p+x));
    DERM.forEach(lv=>['D','G'].forEach(sd=>s.add(dermKey(m.k,lv.k,sd))));
  });
  const pp='sens_pal_';
  ['nb','nb_D','nb_G'].forEach(x=>s.add(pp+x));
  SSTATE.forEach(st=>s.add(pp+'nb_'+st.k));
  ['tetecou','MS','tronc','MI'].forEach(r=>['D','G'].forEach(sd=>s.add(pp+r+'_'+sd)));
  LANDMARKS.forEach(l=>{ if(l.uni) s.add(landKey(l,null)); else ['D','G'].forEach(sd=>s.add(landKey(l,sd))); });
  SUBJT.forEach(t=>s.add('subj_'+t.k+'_nb'));
  CUTT.forEach(t=>s.add('cut_'+t.k+'_nb'));
  ['tetecou','MS','tronc','MI'].forEach(r=>['D','G'].forEach(sd=>{ s.add('subj_'+r+'_'+sd); s.add('cut_'+r+'_'+sd); }));
  VIEWS.forEach(v=>SLOTS.forEach(sl=>['D','G'].forEach(sd=>{ s.add(subjKey(v.v,sl.s,sd)); s.add(cutKey(v.v,sl.s,sd)); })));
  return s;
})();
/* Cles pour lesquelles 0 signifie « pas de cotation » et non une valeur clinique.
   Les metameres en sont exclus : pour eux, 0 veut dire sensibilite absente. */
const ZERODROP = (function(){
  const s=new Set();
  LANDMARKS.forEach(l=>{ if(l.uni) s.add(landKey(l,null)); else ['D','G'].forEach(sd=>s.add(landKey(l,sd))); });
  const pp='sens_pal_';
  ['nb','nb_D','nb_G'].forEach(x=>s.add(pp+x));
  SSTATE.forEach(st=>s.add(pp+'nb_'+st.k));
  ['tetecou','MS','tronc','MI'].forEach(r=>['D','G'].forEach(sd=>{
    s.add(pp+r+'_'+sd); s.add('subj_'+r+'_'+sd); s.add('cut_'+r+'_'+sd); }));
  ['subj','cut'].forEach(pfx=>['nb','nb_D','nb_G'].forEach(x=>s.add(pfx+'_'+x)));
  SUBJT.forEach(t=>s.add('subj_'+t.k+'_nb'));
  CUTT.forEach(t=>s.add('cut_'+t.k+'_nb'));
  VIEWS.forEach(v=>SLOTS.forEach(sl=>['D','G'].forEach(sd=>{ s.add(subjKey(v.v,sl.s,sd)); s.add(cutKey(v.v,sl.s,sd)); })));
  SPEC.forEach(sec=>sec.f.forEach(f=>{ if(f.flags) f.flags.forEach(fl=>s.add(f.k+'_'+fl.k)); }));
  return s;
})();

const MULTIKEYS = (function(){ const s={}; SPEC.forEach(sec=>sec.f.forEach(f=>{ if(f.t==='multi') s[f.k]=f.o.map(o=>o.v); })); return s; })();

function recFromRow(head0,row){
  const rec={id:'',created:'',updated:'',d:{}};
  head0.forEach((h,i)=>{
    if(h==null) return;
    const raw=(row[i]==null?'':String(row[i]).trim());
    if(h==='fiche_id'){ rec.id=raw; return; }
    if(h==='created'||h==='updated'){ rec[h]=raw; return; }
    if(h==='poste') return;
    if(MULTIKEYS[h]){ if(raw) rec.d[h]=raw.split('|').filter(Boolean); return; }
    if(Object.keys(MULTIKEYS).some(k=>h.indexOf(k+'_')===0 && MULTIKEYS[k].indexOf(h.slice(k.length+1))>=0)) return;
    if(raw==='') return;
    if(NUMKEYS.has(h)){ const n=Number(raw.replace(',','.'));
      // 0 vaut « absent de cotation » pour les reliefs, les schemas et les qualites de reflexe : on ne le stocke pas.
      // En revanche 0 est une valeur CLINIQUE pour un metamere (sensibilite absente) : on la conserve.
      if(!isNaN(n)){ if(n!==0 || !ZERODROP.has(h)) rec.d[h]=n; } }
    else rec.d[h]=raw;
  });
  if(!rec.id) rec.id='F'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,6).toUpperCase();
  if(!rec.created) rec.created=new Date().toISOString();
  if(!rec.updated) rec.updated=rec.created;
  return rec;
}

/* les fiches supprimées d'un dossier de données sont rangées dans fiches/supprimees : un import de dossier les ignore */
const inTrash = p => /(^|\/)supprimees\//i.test(String(p).replace(/\\/g, '/'));
/* fiches contenues dans un fichier : JSON (toutes enveloppes) ou CSV des données ; null si le fichier est illisible */
function recsFromText(name, txt){
  if(/\.json$/i.test(name)){
    try{ return recsFromJSON(JSON.parse(txt)); }catch(e){ return null; }
  }
  const first = (txt.charCodeAt(0) === 0xFEFF ? txt.slice(1) : txt).split(/\r?\n/)[0] || '';
  const sep = first.split(';').length>first.split(',').length ? ';' : (first.indexOf('\t')>=0?'\t':',');
  const rows = parseCSV(txt, sep); if(rows.length<2) return null;
  const head = rows[0].map(h=>h.trim());
  return rows.slice(1).filter(r=>r.join('').trim()!=='').map(r=>recFromRow(head,r));
}
/* files : fichiers choisis ; opt.folder : fichiers d'un dossier entier (JSON seulement, corbeille exclue).
   Une archive .zip est ouverte : ses fichiers .json sont lus comme des fichiers isolés. */
async function doImport(files, opt){
  opt = opt || {};
  const st = {add:0, upd:0, same:0, bad:0, ignored:0};
  let seen = 0;
  const wait = $('#impRes'); if(wait) wait.innerHTML = '<span style="color:var(--ink2)">Lecture des fichiers…</span>';
  const take = async (name, txt) => {
    const recs = recsFromText(name, txt);
    if(!recs){ st.bad++; return; }
    for(const r of recs){
      if(!validRec(r)){ st.bad++; continue; }
      seen++;
      /* un import volontaire l'emporte sur une suppression antérieure */
      const res = await mergeOne(r, st, true);
      if(res==='add' || res==='upd') delete TOMB[r.id];
    }
  };
  for(const file of Array.from(files || [])){
    if(/\.zip$/i.test(file.name)){
      let ents; try{ ents = await zipRead(file); }catch(e){ st.bad++; continue; }
      for(const z of ents){
        if(!/\.json$/i.test(z.name) || inTrash(z.name)) continue;
        if(!z.bytes){ st.bad++; continue; }
        await take(z.name, new TextDecoder('utf-8').decode(z.bytes));
      }
      continue;
    }
    if(opt.folder && (!/\.json$/i.test(file.name) || inTrash(file.webkitRelativePath || file.name))) continue;
    let txt; try{ txt=await file.text(); }catch(e){ st.bad++; continue; }
    await take(file.name, txt);
  }
  await persistTomb();
  DB=await idbAll(); await renumberAll(); await afterConnect({csv:true}); renderList(); renderForm(); updateBar();
  const resEl=$('#impRes'); if(!resEl) return;
  resEl.innerHTML='<div class="note" style="background:#e6f4ec;border-color:#9ccdb3">'+
    '<b>Fusion terminée.</b><br>'+seen+' fiche(s) lue(s)<br>'+st.add+' ajoutée(s)<br>'+st.upd+' mise(s) à jour (version importée plus récente)<br>'+
    st.same+' déjà à jour, ignorée(s)<br>'+st.bad+' fichier(s) ou ligne(s) illisible(s)<br><br>Base locale : <b>'+DB.length+'</b> fiche(s).</div>';
}

  const a = new Uint8Array(24); crypto.getRandomValues(a);
  return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function testScanRe(){
  const re=$('#setScanRe'), t=$('#setScanTest'), out=$('#scanPrev');
  if(!re||!t||!out) return;
  const v=t.value.trim();
  if(!v){ out.innerHTML='<span style="color:#8a94a3">Saisissez un code pour voir le résultat.</span>'; return; }
  if(!re.value){ out.innerHTML='Résultat : <b>'+esc(v)+'</b> <span style="color:#5a6472">(aucune règle, code pris tel quel)</span>'; return; }
  try{
    const m=new RegExp(re.value).exec(v);
    out.innerHTML = m ? 'Résultat : <b style="color:#1f7a4d">'+esc(m[1]!=null?m[1]:m[0])+'</b>'
                      : '<span style="color:#a32020">La règle ne correspond pas à ce code.</span>';
  }catch(e){ out.innerHTML='<span style="color:#a32020">Expression régulière invalide : '+esc(e.message)+'</span>'; }
}
function genSalt(){ const i=$('#setSalt'); if(i){ i.value=randSalt(); toast('Sel généré, pensez à le sauvegarder'); } }
function copySalt(){ const i=$('#setSalt'); if(!i||!i.value) return;
  navigator.clipboard.writeText(i.value).then(()=>toast('Sel copié'),()=>toast('Copie impossible')); }
function dlSalt(){ const i=$('#setSalt'); if(!i||!i.value){ toast('Aucun sel à enregistrer'); return; }

async function saveScanSettings(){
  const w=$('#setWedge'), r=$('#setScanRe'), h=$('#setHash'), sa=$('#setSalt');

  if(r.value){ try{ new RegExp(r.value); }catch(e){ toast("Expression régulière invalide"); return; } }

}

/* =====================================================================
   PWA : manifeste, service worker, installation
   Le fichier HTML unique reste utilisable tel quel en double-clic
   (protocole file://). Les liens vers le manifeste et le service worker
   ne sont poses que si la page est servie en http(s), sinon le navigateur
   leverait une erreur sur des ressources absentes.
   ===================================================================== */
let PWA_PROMPT = null;      // evenement beforeinstallprompt mis en attente
let SW_REG     = null;      // enregistrement du service worker
let SW_WAITING = null;      // version en attente d'activation

function pwaNative(){ return !!(window.Capacitor || window.cordova); }
function pwaWeb(){
  if(pwaNative()) return false;   // l'application native embarque deja tout le code
  return location.protocol === 'http:' || location.protocol === 'https:';
}
function pwaInstalled(){
  return window.matchMedia('(display-mode: standalone)').matches ||
         window.matchMedia('(display-mode: fullscreen)').matches ||
         window.navigator.standalone === true;
}
function pwaIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
         (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

function initPWA(){
  if(!pwaWeb()) return;
  const head = document.head;
  const lk = (rel,href,extra) => {
    const l = document.createElement('link');
    l.rel = rel; l.href = href;
    if(extra) Object.keys(extra).forEach(k=>l.setAttribute(k,extra[k]));
    head.appendChild(l);
  };
  lk('manifest','manifest.webmanifest');
  lk('apple-touch-icon','icons/apple-touch-icon.png',{sizes:'180x180'});

  window.addEventListener('beforeinstallprompt', e=>{
    e.preventDefault(); PWA_PROMPT = e; updateBar();
  });
  window.addEventListener('appinstalled', ()=>{
    PWA_PROMPT = null; updateBar(); toast('Application installée');
  });

  if(!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('sw.js').then(reg=>{
    SW_REG = reg;
    if(reg.waiting){ SW_WAITING = reg.waiting; updateBar(); }
    reg.addEventListener('updatefound', ()=>{
      const nw = reg.installing; if(!nw) return;
      nw.addEventListener('statechange', ()=>{
        if(nw.state === 'installed' && navigator.serviceWorker.controller){
          SW_WAITING = nw; updateBar();
          toast('Mise à jour disponible — menu « Installation »');
        }
      });
    });
  }).catch(()=>{ /* hors ligne ou service worker refuse : sans effet */ });

  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(reloaded) return; reloaded = true; location.reload();
  });
}

async function pwaInstall(){
  if(!PWA_PROMPT){ openInstall(); return; }
  PWA_PROMPT.prompt();
  try{ await PWA_PROMPT.userChoice; }catch(e){}
  PWA_PROMPT = null; updateBar();
}
function pwaUpdate(){
  if(!SW_WAITING){ toast('Aucune mise à jour en attente'); return; }
  SW_WAITING.postMessage({type:'SKIP_WAITING'});
}
async function pwaClearCache(){
  if(!('caches' in window)) { toast('Cache non disponible'); return; }
  const ks = await caches.keys();
  await Promise.all(ks.map(k=>caches.delete(k)));
  if(SW_REG) await SW_REG.unregister();
  toast('Cache vidé — rechargement');
  setTimeout(()=>location.reload(true), 700);
}

function openInstall(){
  const mode = pwaInstalled() ? 'installée'
             : (!pwaWeb() ? 'fichier local'
             : (PWA_PROMPT ? 'installable' : 'navigateur'));
  let h = '<h3>Installation hors ligne</h3>';

  if(pwaNative()){
    h += '<div class="note ok"><b>Application native installée.</b> Tout le code est embarqué dans '+
         'l\'application : elle fonctionne hors ligne sans service worker ni cache navigateur. '+
         'Les mises à jour passent par le magasin d\'applications ou par une nouvelle installation.</div>';
    modalHTML(h); return;
  }
  if(mode === 'fichier local'){
    h += '<div class="note"><b>Vous utilisez le fichier HTML seul.</b><br>'+
         'Il fonctionne déjà entièrement hors ligne : tout le code, la mise en page et la base locale '+
         'sont contenus dans ce fichier unique. Aucune installation nécessaire.<br><br>'+
         'Pour obtenir une <b>icône sur l\'écran d\'accueil</b> et une ouverture en plein écran, '+
         'publiez le dossier <code>web/</code> (voir le README) sur GitHub Pages ou sur un serveur interne, '+
         'puis ouvrez cette adresse depuis le téléphone ou la tablette.</div>';
  } else if(mode === 'installée'){
    h += '<div class="note ok"><b>Application installée.</b> Elle démarre hors ligne et se met à jour '+
         'automatiquement dès qu\'une connexion est disponible.</div>';
  } else if(mode === 'installable'){
    h += '<p>Ce navigateur peut installer la fiche comme une application : icône sur l\'écran d\'accueil, '+
         'ouverture plein écran, fonctionnement hors ligne complet.</p>'+
         '<p><button class="tb pri" style="padding:11px 16px" onclick="closeModal();pwaInstall()">'+
         '&#11015; Installer l\'application</button></p>';
  } else if(pwaIOS()){
    h += '<p><b>iPhone / iPad (Safari)</b></p><ol>'+
         '<li>Touchez le bouton <b>Partager</b> (carré avec flèche vers le haut).</li>'+
         '<li>Choisissez <b>Sur l\'écran d\'accueil</b>.</li>'+
         '<li>Validez. L\'icône apparaît avec les autres applications.</li></ol>'+
         '<div class="note">Safari est le seul navigateur iOS qui installe une application web. '+
         'Chrome et Firefox sur iPhone ne proposent pas cette option.</div>';
  } else {
    h += '<p><b>Android (Chrome, Edge, Samsung Internet)</b><br>'+
         'Menu &#8942; puis <b>Installer l\'application</b> ou <b>Ajouter à l\'écran d\'accueil</b>.</p>'+
         '<p><b>Ordinateur (Chrome, Edge)</b><br>'+
         'Icône d\'installation à droite de la barre d\'adresse, ou menu &#8942; &rsaquo; <b>Installer</b>.</p>'+
         '<div class="note">Si rien n\'apparaît, la page n\'est pas servie en HTTPS ou l\'application est déjà installée.</div>';
  }

  if(pwaWeb()){
    h += '<h4 style="margin:14px 0 6px">Mises à jour</h4>'+
         '<p>'+ (SW_WAITING
           ? '<b>Une nouvelle version est prête.</b> '+
             '<button class="tb pri" onclick="pwaUpdate()">Appliquer maintenant</button>'
           : 'Aucune mise à jour en attente. L\'application vérifie à chaque ouverture connectée.') + '</p>'+
         '<p><button class="tb" onclick="pwaClearCache()">Vider le cache et recharger</button> '+
         '<small style="color:var(--ink2)">Les fiches enregistrées ne sont pas touchées : '+
         'elles vivent dans la base locale, pas dans le cache.</small></p>';
  }
  modalHTML(h);
}


/* =====================================================================
   INITIALISATION
   ===================================================================== */
async function saveDraft(){ if(DIRTY && REC) await metaSet('draft',JSON.parse(JSON.stringify(REC))); }

(async function init(){
  $('#patholder').innerHTML = patternDefs();
  try{ await openDB(); }catch(e){ alert("Impossible d'ouvrir la base locale du navigateur : "+e); }
  DB = await idbAll();
  const s = await metaGet('settings');
  if(s){ SET.poste=s.poste||''; SET.sep=s.sep||';'; SET.pii=!!s.pii;
         SET.wedge = s.wedge!==false; SET.scanRe=s.scanRe||''; SET.hash=!!s.hash; SET.hashLen=s.hashLen||12;
         SET.searchSame = s.searchSame!==false; SET.autoDl = !!s.autoDl; }
  SET.salt = (await metaGet('salt')) || '';
  TOMB = (await metaGet('deleted')) || {};
  SYNCMAP = Object.assign({save:{}, search:{}}, (await metaGet('syncmap')) || {});
  DIR_ASKED = !!(await metaGet('dirasked'));
  await restoreDirs();
  const wantNew = /[?&]action=new\b/.test(location.search);
  const draft = await metaGet('draft');
  if(!wantNew && draft && draft.d && Object.keys(draft.d).length>2){ REC=draft; DIRTY=true; }
  else REC=blank();
  renderForm(); renderList(); updateBar();
  initPWA();
  setInterval(saveDraft,4000);
  startupSync().catch(e=>console.error('dossier de données :', e));      // sans attendre : le dossier est relu pendant que la fiche s'affiche
})();

window.addEventListener('beforeprint',()=>{ if(REC){ computeAll(); $('#print-root').innerHTML=buildPrint(); } });
window.addEventListener('beforeunload',e=>{ if(DIRTY){ e.preventDefault(); e.returnValue=''; } });
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){ e.preventDefault(); saveFiche(); }
  if(e.key==='Escape') closeModal();
});

function helpBtn(key){
  if(!key || !HELP[key]) return '';
  return '<button class="hb" title="'+esc(HELP[key].t)+'" onclick="event.stopPropagation();openHelpItem(\''+key+'\')">?</button>';
}
function openHelpItem(key){
  const H = HELP[key]; if(!H){ toast('Aide indisponible'); return; }
  modalHTML('<h3>'+esc(H.t)+'</h3>'+
    '<div class="helpdoc">'+H.h+'</div>'+
    (H.svg && HELP_SVG[H.svg] ? '<div style="text-align:center;margin:12px 0">'+HELP_SVG[H.svg]+'</div>' : ''));
}
function openHelpLib(){
  const keys = Object.keys(HELP);
  modalHTML('<h3>Aides à l\'examen</h3>'+
    '<p style="margin:0 0 10px;color:var(--ink2);font-size:12.5px">'+
    keys.length+' fiches techniques : manœuvre, résultat normal, ce qui compte comme pathologique, '+
    'et les pièges. Le bouton <b>?</b> à côté d\'un item ouvre la sienne.</p>'+
    '<div style="max-height:56vh;overflow:auto">'+
    keys.map(k=>'<button class="tb" style="width:100%;text-align:left;margin-bottom:6px;padding:10px 12px" '+
      'onclick="openHelpItem(\''+k+'\')">'+esc(HELP[k].t)+'</button>').join('')+
    '</div>');
}
