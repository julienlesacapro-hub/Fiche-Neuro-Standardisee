function lab(k){ const f=FIELDS[k]; if(!f||!f.o) return REC.d[k];
  const o=f.o.find(x=>x.v===REC.d[k]); return o?o.l:null; }
const cote = v => v===1?'à droite':v===2?'à gauche':v===3?'des deux côtés':'';
const cot2 = v => v===1?'droite':v===2?'gauche':'';
const has  = k => REC.d[k]!=null && REC.d[k]!=='';
function frDate(s){ if(!s)return ''; const p=String(s).split('-'); return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s; }

function multiLab(k,short){
  const f=FIELDS[k], a=REC.d[k];
  if(!f||!Array.isArray(a)||!a.length) return '';
  return a.map(v=>{ const o=f.o.find(x=>x.v===v); return o?((short&&o.s)||o.l):v; }).join(', ');
}
const hasMulti = k => Array.isArray(REC.d[k]) && REC.d[k].length>0;

function refFlags(k){
  const out=[]; RFLAGS.forEach(fl=>{ if(REC.d[k+'_'+fl.k]) out.push(fl.l); });
  return out.length? ' ('+out.join(', ')+')' : '';
}

/* Résumé compact d'une modalité métamérique : les niveaux contigus de même
   cotation sont regroupés en intervalles, et les deux côtés fusionnés quand
   ils coïncident. Sur une section complète, cela remplace une liste de
   quarante-six items par deux intervalles. Utilisé par la synthèse rédigée
   et par l'impression ; la colonne CSV détaillée reste inchangée. */
function dermResume(mod){
  const d=REC.d;
  const ETAT = {0:'anesthésie', 1:'hypoesthésie', 3:'hyperesthésie', 9:'non testable'};
  const runs = {};                       /* runs[cote] = [{v, i0, i1}] */
  ['D','G'].forEach(sd=>{
    const out=[]; let cur=null;
    DERM.forEach((lv,i)=>{
      const v=d[dermKey(mod,lv.k,sd)];
      const anormal = (v===0 || v===1 || v===3 || v===9);
      if(anormal && cur && cur.v===v && cur.i1===i-1){ cur.i1=i; return; }
      if(anormal){ cur={v:v, i0:i, i1:i}; out.push(cur); }
      else cur=null;
    });
    runs[sd]=out;
  });
  const label = r => (r.i0===r.i1) ? ('en '+DERM[r.i0].l)
                                   : ('de '+DERM[r.i0].l+' à '+DERM[r.i1].l);
  const key = r => r.v+':'+r.i0+':'+r.i1;
  const mD = new Map(runs.D.map(r=>[key(r),r])), mG = new Map(runs.G.map(r=>[key(r),r]));
  const parts=[];
  runs.D.forEach(r=>{ if(mG.has(key(r))) parts.push(ETAT[r.v]+' '+label(r)+' des deux côtés');
                      else parts.push(ETAT[r.v]+' '+label(r)+' à droite'); });
  runs.G.forEach(r=>{ if(!mD.has(key(r))) parts.push(ETAT[r.v]+' '+label(r)+' à gauche'); });
  return parts.join(', ');
}
/* Les listes de zones (relevés, colonnes du fichier de données) sont séparées par une barre verticale :
   dans le texte rédigé, elles le sont par un point-virgule. */
const zonesTxt = s => String(s==null?'':s).split(/\s*\|\s*/).map(x=>x.trim()).filter(Boolean).join(' ; ');

/* ---------------------------------------------------------------------
   Établissement où le patient est pris en charge : il figure dans la phrase
   d'évacuation (« héliporté sur l'HNIA Sainte-Anne »). */
const HOPITAL_PEC = 'HNIA Sainte-Anne';
const NATIO_F = {1:'française',2:'belge',3:'allemande',4:'suisse',5:'italienne',6:'espagnole',7:'américaine (US)',8:'anglaise'};

/* Score MEDSUBHYP de tous les examens du dossier, un par moment : « 9/22 à
   l'arrivée ; 21/22 à H12 ». L'examen en cours remplace celui de même moment. */
function mshSerie(){
  const d = REC.d, out = {};
  const note = (m, t) => { if(m && m!=='nr' && t!=null) out[m] = t; };
  if(d.dossier) DB.forEach(f=>{ if(f.id!==REC.id && f.d.dossier===d.dossier) note(f.d.msh_moment_eff||f.d.msh_moment, f.d.msh_total); });
  const R = mshCalc(); if(!R.horsFenetre && R.total!=null) note(R.moment, R.total);
  return [['t0','à l’arrivée'],['t12','à H12'],['t24','à H24']].filter(x=>out[x[0]]!=null)
         .map(x=>({lab:x[1], t:out[x[0]]}));
}

/* =====================================================================
   SYNTHÈSE RÉDIGÉE
   Elle suit le plan d'une observation d'entrée écrite à la main :
     Histoire de l'accident · Antécédents · Examen clinique d'entrée
     (constantes, puis « A l'examen : … En revanche, il existe … »)
     Au total · Examens paracliniques · Conduite à tenir.
   Chaque affirmation vient d'un champ renseigné : une négation (« pas de
   déficit », « pas de signe cérébral ») n'est écrite que si l'item a été
   examiné, jamais par défaut. Le texte est fait de phrases, pas de listes
   de champs ; les titres sortent en gras à l'écran, sur le PDF et dans la
   copie destinée à un traitement de texte.
   ===================================================================== */
/* Petits utilitaires de rédaction, partagés par la synthèse et l'impression */
const TXT = {
  lst:  a => { a = a.filter(Boolean); return a.length<2 ? (a[0]||'') : a.slice(0,-1).join(', ')+' et '+a[a.length-1]; },
  cap:  s => s ? s.charAt(0).toUpperCase()+s.slice(1) : s,
  low:  s => String(s==null?'':s).toLowerCase(),
  /* minuscule initiale d'un texte libre inséré au milieu d'une liste (« Foramen… » → « foramen… ») */
  lc1:  s => String(s==null?'':s).replace(/^[A-ZÀÂÉÈÊÎÔÛÇŒ](?=[a-zàâéèêîôûçœ])/, c=>c.toLowerCase()),
  flat: s => String(s==null?'':s).replace(/\s*\n+\s*/g,' ').replace(/\s+/g,' ').trim(),
  fin:  s => { s = TXT.flat(s); return s ? s.replace(/[.;,:\s]+$/,'')+'.' : ''; },
  hFr:  s => s ? String(s).replace(/^0(?=\d:)/,'').replace(':',' h ') : '',
  dureeFr: m => m==null ? '' : (m<60 ? m+' min' : Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')),
  /* Le texte généré ne contient aucun signe spécial : exposants et indices (SpO₂, cmH₂O, m²), barres
     verticales, étoiles, flèches, degrés, signes de comparaison. Il est collé dans un dossier
     hospitalier qui ne les reconnaît pas toujours. Les phrases sont déjà écrites sans eux ; ce filtre
     rattrape ceux qui viennent d'un libellé de l'application ou d'un texte libre, en les récrivant
     en lettres. */
  clean: s => String(s==null?'':s)
    .replace(/[₀-₉]/g, c=>String(c.charCodeAt(0)-0x2080))
    .replace(/[⁰¹²³⁴-⁹]/g, c=>String('⁰¹²³⁴⁵⁶⁷⁸⁹'.indexOf(c)))
    .replace(/[ʳᵉᵈˢᵗʰⁿᵒ]/g,
             c=>({'ʳ':'r','ᵉ':'e','ᵈ':'d','ˢ':'s','ᵗ':'t','ʰ':'h','ⁿ':'n','ᵒ':'o'}[c]))
    .replace(/\s*\(\s*\d\s*[★☆*]+\s*\)/g, '')                    // « N2 (2★) » devient « N2 »
    .replace(/[★☆∗✱✳✴*]/g, '')                // étoiles et astérisques restants
    .replace(/\s*[|¦│┃]\s*/g, ' ; ')                         // barres verticales : séparateur de liste
    .replace(/\s*(?:[→⇒➔➜➡⟶]|-+>)\s*/g, ' puis ')   // flèches vers la droite
    .replace(/\s*[↑⇑⬆]\s*/g, ' en hausse ')
    .replace(/\s*[↓⇓⬇]\s*/g, ' en baisse ')
    .replace(/[←↔⇐⇔↖-↙]/g, ' ')
    .replace(/\s*≥\s*/g, ' supérieur ou égal à ').replace(/\s*≤\s*/g, ' inférieur ou égal à ')
    .replace(/\s*±\s*/g, ' plus ou moins ').replace(/\s*≈\s*/g, ' environ ').replace(/\s*×\s*/g, ' x ')
    .replace(/\bT°\s*/g, 'température ').replace(/\bn°\s*/gi, 'numéro ')
    .replace(/\s*°\s*C\b/g, ' degrés').replace(/(\d)\s*°/g, '$1 degrés').replace(/°/g, '')
    .replace(/\s+[—–]\s+/g, ', ')                                 // tirets longs entre deux groupes de mots
    .replace(/…/g, '...').replace(/[^\S\r\n]/g, ' ')
    .replace(/(?:\s*;){2,}/g, ' ;').replace(/ {2,}/g, ' ').replace(/ +([.,])/g, '$1')
};

/* Antécédents, traitement, toxiques, antécédents de plongée et certificat médical,
   écrits en groupes de mots. Une seule source pour la synthèse et pour le papier. */
function terrainTextes(){
  const d = REC.d, {lst, low, lc1, flat} = TXT;
  const multi = k => Array.isArray(d[k]) ? d[k] : [];
  const am = multi('atcd_med'), atcd = [], neg = [], pos = [];
  if(am.indexOf('aucun_med')>=0) neg.push('médical');
  if(am.indexOf('aucun_chir')>=0) neg.push('chirurgical');
  if(am.indexOf('hta')>=0) pos.push('hypertension artérielle');
  if(am.indexOf('diabete')>=0) pos.push('diabète');
  if(am.indexOf('asthme')>=0) pos.push('asthme');
  if(am.indexOf('cardio')>=0) pos.push('cardiopathie'+(d.atcd_cardio?' ('+flat(d.atcd_cardio)+')':''));
  if(am.indexOf('pneumo')>=0){
    const pd = [d.atcd_pneumo_type ? low(lab('atcd_pneumo_type')) : '', flat(d.atcd_pneumo_date)].filter(Boolean);
    pos.push('pneumothorax'+(pd.length?' ('+pd.join(', ')+')':''));
  }
  if(neg.length) atcd.push('aucun antécédent '+neg.join(' ni ')+' notable');
  if(pos.length) atcd.push(lst(pos));
  if(d.atcd) atcd.push(lc1(flat(d.atcd).replace(/\.$/,'')));
  const trait = [];
  if(d.traitement) trait.push('traitement habituel : '+lc1(flat(d.traitement).replace(/\.$/,'')));
  if(d.allergie) trait.push('allergies : '+lc1(flat(d.allergie).replace(/\.$/,'')));
  if(d.contracept===1) trait.push('contraception orale');
  if(d.regles) trait.push('dernières règles le '+frDate(d.regles));
  if(d.rachianesth===1) trait.push('rachianesthésie récente');
  const tx = multi('tox'), tox = [];
  if(tx.indexOf('aucune')>=0) tox.push('aucune habitude toxique');
  if(tx.indexOf('tabac')>=0 || tx.indexOf('tabac_sevre')>=0){
    const det = [];
    if(d.tabac_cig!=null) det.push(d.tabac_cig+' cigarette'+(d.tabac_cig>1?'s':'')+' par jour');
    if(d.tabac_ans!=null) det.push((tx.indexOf('tabac')>=0?'depuis ':'pendant ')+d.tabac_ans+' an'+(d.tabac_ans>1?'s':''));
    if(d.tabac_pa!=null) det.push(d.tabac_pa+' PA');
    if(tx.indexOf('tabac')>=0) tox.push('tabagisme actif'+(det.length?' ('+det.join(', ')+')':''));
    else tox.push('tabagisme sevré'+(d.tabac_sevre_date?' depuis le '+frDate(d.tabac_sevre_date):'')+(det.length?' ('+det.join(', ')+')':''));
  }
  const stadeAlc = k => d[k] ? 'stade '+d[k]+', '+low(lab(k).replace(/^Stade \d — /,'')) : '';
  if(tx.indexOf('alcool')>=0) tox.push('consommation d’alcool'+(d.alcool_stade ? ' ('+stadeAlc('alcool_stade')+')' : ''));
  if(tx.indexOf('alcool_sevre')>=0){
    const det = [d.alcool_sevre_date ? 'depuis le '+frDate(d.alcool_sevre_date) : '',
                 d.alcool_sevre_stade ? 'évaluation antérieure : '+stadeAlc('alcool_sevre_stade') : ''].filter(Boolean);
    tox.push('alcool sevré'+(det.length ? ' ('+det.join(' ; ')+')' : ''));
  }
  if(tx.indexOf('cannabis')>=0) tox.push('cannabis'+(d.cannabis_freq?' (consommation '+low(lab('cannabis_freq'))+')':''));
  if(tx.indexOf('autre')>=0) tox.push('autre toxique'+(d.tox_autre_txt?' : '+flat(d.tox_autre_txt):''));
  if(d.toxiques) tox.push(lc1(flat(d.toxiques).replace(/\.$/,'')));
  const ap = multi('atcdp'), plongee = [];
  if(ap.indexOf('aucun')>=0) plongee.push('aucun antécédent en plongée antérieur');
  if(ap.indexOf('add')>=0)  plongee.push('accident de désaturation'+(d.atcdp_add_txt?' ('+flat(d.atcdp_add_txt)+')':''));
  if(ap.indexOf('opi')>=0)  plongee.push('œdème pulmonaire d’immersion'+(d.atcdp_opi_txt?' ('+flat(d.atcdp_opi_txt)+')':''));
  if(ap.indexOf('baro')>=0) plongee.push('barotraumatisme'+(d.atcdp_baro_txt?' ('+flat(d.atcdp_baro_txt)+')':''));
  if(ap.indexOf('bio')>=0)  plongee.push('accident biochimique'+(d.atcdp_bio_txt?' ('+flat(d.atcdp_bio_txt)+')':''));
  if(d.atcd_plongee) plongee.push(lc1(flat(d.atcd_plongee).replace(/\.$/,'')));
  const certif = [];
  if(d.certif_date) certif.push('dernier du '+frDate(d.certif_date)+
    (d.certif_medecin ? ' (qualification du médecin : '+(d.certif_medecin===9 ? flat(d.certif_medecin_autre||'autre') : low(lab('certif_medecin')))+')' : ''));
  if(d.certif_absent===1) certif.push('aucun de moins d’un an'+(d.certif_comment?' ('+flat(d.certif_comment)+')':''));
  const niv = k => d[k]==null ? '' : (d[k]===99 ? flat(d[k+'_autre']||'autre') : lab(k));
  const niveaux = [];
  if(d.niv_loisir!=null) niveaux.push('loisir '+niv('niv_loisir'));
  if(d.niv_pro!=null)    niveaux.push('professionnel '+niv('niv_pro'));
  if(d.niv_ens!=null)    niveaux.push('enseignement '+niv('niv_ens'));
  if(d.organisme!=null)  niveaux.push('organisme '+niv('organisme'));
  if(d.niveau_date)      niveaux.push('obtenu le '+frDate(d.niveau_date));
  return {atcd:atcd, trait:trait, tox:tox, plongee:plongee, certif:certif, niveaux:niveaux};
}

function narrativeBlocks(){
  const d = REC.d, TY = d.fiche_type||1, B = [];
  const F = d.sexe===2;
  const {lst, cap, low, lc1, flat, fin, hFr, dureeFr} = TXT;
  const sect = (h, lines, inline) => {
    lines = lines.map(x=>TXT.clean(x).trim()).filter(Boolean);
    if(lines.length) B.push({h:h, lines:lines, inline:!!inline});
  };
  /* libellé d'une option, ou texte « à préciser » quand le menu porte le code 99 ; au milieu d'une phrase, sans majuscule */
  const niv = k => d[k]==null ? '' : (d[k]===99 ? flat(d[k+'_autre']||'autre') : lc1(lab(k)));
  const multi = k => Array.isArray(d[k]) ? d[k] : [];

  /* ---------- en-tête, comme sur la feuille d'observation ---------- */
  const titre = TY===2 ? 'Observation de suivi' : TY===3 ? 'Compte rendu de séjour' : 'Observation d’entrée';
  const hd = [titre, 'Date : '+(d.date_ex ? frDate(d.date_ex) : '')];
  hd.push(TY===1 ? 'Heure de prise en charge : '+hFr(d.heure_pec||d.heure_ex||'') : 'Heure de l’examen : '+hFr(d.heure_ex||''));
  /* le numéro de dossier et le rang de l'examen ne servent pas dans un compte rendu : il porte déjà l'identité */
  if(d.examinateur) hd.push(fin('Examinateur : '+d.examinateur));
  B.push({title:true, lines:hd.map(x=>TXT.clean(x))});

  /* ---------- histoire de l'accident ---------- */
  if(TY!==2){
    /* le plongeur */
    const pa = [];
    if(d.age!=null) pa.push(' de '+d.age+' ans');
    if(d.nationalite && d.nationalite!==1){
      const nat = d.nationalite===9 ? flat(d.nationalite_autre) : NATIO_F[d.nationalite];
      if(nat) pa.push(', de nationalité '+nat);
    }
    if(d.profession) pa.push(', profession : '+flat(d.profession));
    const adr = (()=>{
      switch(d.adresse_par){
        case 1: return 'le SAMU 83';
        case 2: return 'le SCMM';
        case 3: return 'un autre SAMU'+(d.adresse_samu?' ('+flat(d.adresse_samu)+')':'');
        case 4: { const ty = {1:'SAU',2:'centre hyperbare',3:''}[d.adresse_etab_type]||'';
                  const det = [ty, flat(d.adresse_etab)].filter(Boolean).join(', ');
                  return 'un autre établissement de santé'+(det?' ('+det+')':''); }
      } return '';
    })();
    if(adr) pa.push(', '+(F?'adressée':'adressé')+' par '+adr);
    /* niveau, organisme et expérience */
    const nv = [];
    if(d.niv_loisir!=null) nv.push('niveau loisir '+niv('niv_loisir'));
    if(d.niv_pro!=null)    nv.push('niveau professionnel '+niv('niv_pro'));
    if(d.niv_ens!=null)    nv.push('niveau d’enseignement '+niv('niv_ens'));
    const ex = [];
    if(d.organisme!=null) ex.push('organisme '+niv('organisme'));
    if(d.plongee_depuis!=null) ex.push('plongeur depuis '+d.plongee_depuis);
    if(d.nb_plongees_an!=null) ex.push(d.nb_plongees_an+' plongée'+(d.nb_plongees_an>1?'s':'')+' par an en moyenne sur les 2 dernières années');
    if(nv.length || ex.length) pa.push(', '+(nv.length ? lst(nv) : 'pratique')+(ex.length ? ' ('+ex.join(' ; ')+')' : ''));
    if(d.auto_encadre===1) pa.push(', plongée auto-encadrée');
    const l1 = [];
    if(pa.length) l1.push(fin((F ? 'Plongeuse' : 'Plongeur')+pa.join('')));

    /* la plongée */
    const dv = [];
    const TYPPL = {1:'de loisir',2:'d’instruction',3:'professionnelle',4:'militaire',5:'en apnée'};
    dv.push('Plongée'+(d.pl_type?' '+TYPPL[d.pl_type]:'')+(d.pl_lieu?' ('+flat(d.pl_lieu)+')':''));
    if(d.pl_gaz){
      const g = d.pl_gaz===1 ? 'à l’air' : d.pl_gaz===9 ? 'avec un autre mélange'
              : (d.pl_gaz===4||d.pl_gaz===5) ? 'à l’'+low(lab('pl_gaz')) : 'au '+low(lab('pl_gaz'));
      dv.push(g+(d.pl_gaz_autre?' ('+flat(d.pl_gaz_autre)+')':''));
    }
    if(d.pl_prof!=null) dv.push(d.pl_prof+' m');
    const pft = profilTexte(d); if(pft) dv.push(pft);
    const du = [];
    if(d.pl_dt!=null) du.push('DT '+d.pl_dt+' min');
    if(d.pl_dtr!=null) du.push('DTR '+d.pl_dtr+' min');
    if(d.pl_duree_tot!=null) du.push('DTP '+d.pl_duree_tot+' min');
    if(du.length) dv.push(du.join(', '));
    if(d.pl_proc){
      const pr = {1:()=>'ordinateur'+(d.pl_ordi_modele?' '+flat(d.pl_ordi_modele):'')+(d.pl_ordi_reglage?' (réglage '+flat(d.pl_ordi_reglage)+')':''),
                  2:()=>'tables MN23', 5:()=>'tables MT 92',
                  3:()=>'tables'+(d.pl_proc_autre?' '+flat(d.pl_proc_autre):' autres'),
                  4:()=>'sans procédure de décompression'}[d.pl_proc];
      if(pr) dv.push('procédure : '+pr());
    }
    const PL = palList().filter(r=>r.p!=null || r.m!=null);
    const palShort = r => (r.m!=null ? r.m+' min' : '?')+' à '+(r.p!=null ? r.p+' m' : '?')+
                          (r.s ? ' de sécurité' : '')+((r.g||1)!==1 ? ' ('+gazLab(r.g)+')' : '');
    if(PL.length || d.pl_paliers){
      let p = PL.length ? 'paliers : '+lst(PL.map(palShort)) : 'paliers';
      if(d.pl_paliers) p += (PL.length ? ' (' : ' : ')+low(flat(d.pl_paliers).replace(/\.$/,''))+(PL.length ? ')' : '');
      dv.push(p);
    }
    const hs = [];
    if(d.pl_h_immersion) hs.push('immersion à '+hFr(d.pl_h_immersion));
    if(d.pl_h_depart_fond) hs.push('départ du fond à '+hFr(d.pl_h_depart_fond));
    if(d.pl_h_sortie) hs.push('sortie de l’eau à '+hFr(d.pl_h_sortie));
    if(hs.length) dv.push('('+hs.join(', ')+')');
    if(dv.length>1 || d.pl_type || d.pl_lieu) l1.push(fin(dv.join(', ').replace(/, \(/,' (')));
    if(d.pl_reimm_txt) l1.push(fin(d.pl_reimm_txt));

    /* ce qui s'est passé, puis les premiers signes */
    if(d.histoire) l1.push(fin(d.histoire));
    if(d.pl_h_symp){
      let q = 'Premiers symptômes à '+hFr(d.pl_h_symp);
      if(d.pl_delai_symp!=null) q += ', soit '+d.pl_delai_symp+' min après la sortie de l’eau';
      l1.push(fin(q));
    }
    if(d.sf_arrivee) l1.push(fin('Signes fonctionnels à l’arrivée : '+lc1(flat(d.sf_arrivee))));
    /* plongée précédente et facteurs favorisants */
    if(d.plp_faite===1){
      const pp = [];
      if(d.plp_date) pp.push('le '+frDate(d.plp_date));
      if(d.plp_heure) pp.push('sortie de l’eau à '+hFr(d.plp_heure));
      if(d.plp_prof!=null) pp.push(d.plp_prof+' m');
      if(d.plp_duree_fond!=null) pp.push('durée au fond '+d.plp_duree_fond+' min');
      if(d.plp_duree_tot!=null) pp.push('durée totale '+d.plp_duree_tot+' min');
      if(d.plp_paliers) pp.push('paliers : '+flat(d.plp_paliers));
      if(d.plp_interval!=null) pp.push('intervalle de surface '+dureeFr(d.plp_interval));
      l1.push(fin('Plongée dans les 24 heures précédentes'+(pp.length?' : '+pp.join(', '):'')));
    } else if(d.plp_faite===0) l1.push('Pas de plongée dans les 24 heures précédentes.');
    const FS = SPEC.find(x=>x.id==='facteurs') || {f:[], norm:{}}, nrm = FS.norm || {};
    const fr = FS.f.filter(f=>f.o && d[f.k]!=null && d[f.k]!==nrm[f.k])
                   .map(f=>{ if(f.k==='ff_proc') return 'procédure de décompression non respectée';
                             const o = f.o.find(x=>x.v===d[f.k]);
                             return low(f.l)+(o && o.l!=='OUI' ? ' : '+low(o.l) : ''); });
    if(fr.length) l1.push(fin('Facteurs favorisants : '+fr.join(', ')));
    else if(FS.f.some(f=>f.o && d[f.k]!=null)) l1.push('Pas de facteur favorisant retrouvé, procédure de décompression respectée.');
    /* les conditions environnementales se décrivent à part : « mer calme » n'est pas un facteur favorisant */
    if(d.ff_env) l1.push(fin('Conditions environnementales : '+lc1(flat(d.ff_env))));

    /* soins sur place */
    const sp = [];
    if(d.soin_o2===1){
      let o = 'Mis sous ONB';
      if(d.soin_o2_debit!=null) o += ' à '+d.soin_o2_debit+' L/min';
      if(d.soin_o2_duree!=null) o += ' pendant '+dureeFr(d.soin_o2_duree);
      if(d.heure_soins) o += ' (début à '+hFr(d.heure_soins)+')';
      sp.push(o);
    } else if(d.soin_o2===0) sp.push('Pas d’oxygénothérapie normobare sur place');
    else if(d.heure_soins) sp.push('Premiers soins sur place à '+hFr(d.heure_soins));
    if(d.soin_aspirine===1) sp.push('aspirine');
    if(d.soin_hydrat!=null) sp.push('hydratation de '+d.soin_hydrat+' mL');
    if(d.soin_autres) sp.push(flat(d.soin_autres).replace(/\.$/,''));
    let l2 = sp.join(', ');
    if(has('evol_avant_rec')) l2 += (l2?'. ':'')+'Évolution avant recompression : '+low(lab('evol_avant_rec'));
    /* alerte, évacuation et prise en charge */
    const ev = [];
    if(d.heure_appel) ev.push('Alerte à '+hFr(d.heure_appel));
    const evm = {1:'Venu par ses propres moyens', 2:'Transporté par VSAV / pompiers à l’'+HOPITAL_PEC,
                 3:'Transporté par SMUR routier à l’'+HOPITAL_PEC, 7:'Héliporté sur l’'+HOPITAL_PEC+' (hélicoptère médicalisé)',
                 8:'Héliporté sur l’'+HOPITAL_PEC+' (hélicoptère non médicalisé)',
                 6:'Évacué par '+(d.evac_autre?flat(d.evac_autre):'un autre moyen')}[d.evac_moyen];
    if(evm) ev.push(evm);
    if(d.heure_pec){
      let pe = 'Prise en charge au SMHEP à '+hFr(d.heure_pec);
      if(d.delai_symp_pec!=null) pe += ', '+dureeFr(d.delai_symp_pec)+' après les premiers symptômes';
      ev.push(pe);
    }
    sect('Histoire de l’accident', [l1.filter(Boolean).join(' '), l2 ? fin(l2) : '', ev.map(fin).join(' ')], true);

    /* ---------- antécédents, traitement, toxiques ---------- */
    const TX = terrainTextes();
    sect('Antécédents et terrain', [
      TX.atcd.length ? fin('Antécédents médico-chirurgicaux : '+TX.atcd.join(' ; ')) : '',
      TX.trait.length ? fin(cap(TX.trait.join(' ; '))) : '',
      TX.tox.length ? fin('Habitudes toxiques : '+TX.tox.join(' ; ')) : '',
      TX.plongee.length ? fin('Antécédents de plongée : '+TX.plongee.join(' ; ')) : '',
      TX.certif.length ? fin('Certificat médical : '+TX.certif.join(' ; ')) : ''
    ]);
  }

  /* ---------- évolution (suivi et compte rendu de séjour) ---------- */
  if(TY!==1){ const et = evolTexte(); if(et) sect('Évolution depuis la consultation précédente', [et], true); }

  /* ---------- examen clinique ---------- */
  const CS = Array.isArray(d.cst) ? d.cst : [];
  const c0 = TY===1 ? CS[0] : CS[CS.length-1];
  const mes = [];
  if(d.poids!=null) mes.push('Poids : '+d.poids+' kg');
  if(d.taille!=null) mes.push('Taille : '+d.taille+' cm');
  if(d.imc!=null) mes.push('IMC : '+String(d.imc).replace('.',','));
  if(c0){
    if(c0.tas!=null && c0.tad!=null) mes.push('TA : '+c0.tas+'/'+c0.tad+' mmHg');
    if(c0.pouls!=null) mes.push('Pouls : '+c0.pouls+'/min');
    if(c0.spo2!=null) mes.push('SpO2 : '+c0.spo2+' %');
    if(c0.temp!=null) mes.push('Température : '+String(c0.temp).replace('.',',')+' degrés');
  }

  const ng = [], ps = [];            // constats normaux / constats anormaux (domaine, texte)
  /* conscience, signes cérébraux */
  const cer = [];
  if(has('avpu') && d.avpu!==1) cer.push('conscience altérée (AVPU : '+lab('avpu')+')');
  if(d.fs_comport===1) cer.push('troubles du comportement');
  if(d.fs_dts===1) cer.push('désorientation temporo-spatiale');
  if(d.fs_parole===1) cer.push('troubles de la parole');
  if(d.fs_visuel===1) cer.push('troubles visuels '+cote(d.fs_visuel_cote));
  if(d.par_fac===1) cer.push('paralysie faciale '+cote(d.par_fac_cote)+(d.par_oeil===1?', sans fermeture de l’œil':''));
  const pu = [];
  if(d.pup_sym===0 && d.pup_aniso!==1) pu.push('pupilles asymétriques');
  if(d.pup_aniso===1) pu.push('anisocorie'+(d.pup_aniso_cote?' (pupille la plus large '+(d.pup_aniso_cote===1?'à droite':'à gauche')+')':''));
  if(d.pup_myd===1) pu.push('mydriase '+cote(d.pup_myd_cote));
  if(d.pup_myo===1) pu.push('myosis '+cote(d.pup_myo_cote));
  if(d.pup_rpm===0) pu.push('réflexe photomoteur aboli '+cote(d.pup_rpm_cote));
  if(pu.length) cer.push(pu.join(', ').replace(/\s+,/g,','));
  if(cer.length) ps.push(['signes cérébraux', 'des signes cérébraux : '+cer.map(x=>x.trim()).join(', ')]);
  else if(['avpu','fs_comport','fs_dts','fs_parole','fs_visuel','par_fac','pup_sym','pup_rpm'].some(has)) ng.push('pas de signe cérébral');
  if(d.gcs_tot!=null){
    if(d.gcs_tot===15) ng.push('GCS 15');
    else ps.push(['conscience', 'un score de Glasgow à '+d.gcs_tot+' (Y'+d.gcs_y+' V'+d.gcs_v+' M'+d.gcs_m+')']);
  } else if(d.gcs_nc) ng.push('Glasgow non calculable (modalité non cotable)');
  /* vestibulo-cochléaire et ORL */
  const ves = [];
  if(d.fs_vertiges===1) ves.push('vertiges');
  if(d.nys===1){
    let n = 'nystagmus';
    if(d.nys_cote) n += ' à secousse rapide '+cot2(d.nys_cote);
    if(hasMulti('nys_regard')) n += ', regard '+multiLab('nys_regard',1);
    if(has('nys_type')) n += ', '+low(lab('nys_type'));
    ves.push(n);
  }
  if(d.vns===1){
    if(d.vns_spont===1) ves.push(('nystagmus spontané sous VNS '+cot2(d.vns_spont_cote)).trim());
    if(d.vns_niv===1) ves.push(('NIV présent '+cot2(d.vns_niv_cote)).trim());
  }
  if(d.fs_audition===1) ves.push('troubles de l’audition '+cote(d.fs_audition_cote));
  if(d.fs_acouph===1) ves.push('acouphènes '+cote(d.fs_acouph_cote));
  /* épreuves vestibulaires anormales, avec leur côté */
  const epr = (k, nom) => nom+' '+(k==='romberg' ? 'positif' : (k==='etoile' || k==='funambule') ? 'anormale' : 'anormal');
  const eprCote = k => d[k+'_cote'] ? ' ('+(k==='romberg'
    ? ({1:'chute à droite',2:'chute à gauche',3:'chute non latéralisée'}[d.romberg_cote])
    : 'déviation '+cote(d[k+'_cote']))+')' : '';
  [['romberg','Romberg'],['fukuda','Fukuda'],['etoile','marche en étoile'],['funambule','marche funambule']]
    .forEach(x=>{ if(d[x[0]]===1) ves.push(epr(x[0], x[1])+eprCote(x[0])); });
  const eprFaites = ['romberg','fukuda','etoile','funambule'].some(has);
  if(ves.length) ps.push(['signes vestibulo-cochléaires', 'des signes vestibulo-cochléaires : '+ves.map(x=>x.trim()).join(', ')]);
  else if(['fs_vertiges','nys','fs_audition','fs_acouph'].some(has)) ng.push('pas de signe vestibulaire ni cochléaire');
  else if(eprFaites) ng.push('épreuves vestibulaires normales');
  const orl = [];
  ['D','G'].forEach(sd=>{ const v = d['oto_'+sd];
    if(v>0) orl.push('otoscopie '+(sd==='D'?'droite':'gauche')+' stade '+v+' ('+HAINES_LAB(v)+')'+(d['oto_epanch_'+sd]===1?' avec épanchement rétro-tympanique':'')); });
  ['D','G'].forEach(sd=>{ const v = d['valsalva_'+sd];
    if(v!=null && v<2) orl.push('Valsalva '+(sd==='D'?'droit':'gauche')+' '+low(lab('valsalva_'+sd))); });
  if(d.weber>0) orl.push('Weber '+low(lab('weber')));
  ['D','G'].forEach(sd=>{ if(d['rinne_'+sd]===0) orl.push('Rinne '+(sd==='D'?'droit':'gauche')+' négatif'); });
  if(d.orl_interp_txt && d.orl_interp>0) orl.push(low(d.orl_interp_txt.replace(/\.$/,'')));
  if(d.orl_txt) orl.push(flat(d.orl_txt));
  if(orl.length) ps.push(['anomalies ORL', 'des anomalies ORL : '+orl.join(', ')]);
  else if(['oto_D','oto_G','valsalva_D','valsalva_G','weber','rinne_D','rinne_G'].some(has)) ng.push('examen ORL normal');
  /* motricité et sensibilité */
  const mt = [];
  const fa = [];
  MYO.forEach(m0=>['D','G'].forEach(sd=>{ const v = d[myoKey(m0.k,sd)]; if(v!=null && v<5)
    fa.push(m0.l+' ('+low(m0.m)+') '+(sd==='D'?'droit':'gauche')+' coté '+v+'/5'); }));
  ['f_epaule','f_main'].forEach(b=>['D','G'].forEach(sd=>{ const v = d[b+'_'+sd]; if(v!=null && v<5)
    fa.push((b==='f_epaule'?'élévation de l’épaule ':'serrage de main ')+(sd==='D'?'droit':'gauche')+' coté '+v+'/5'); }));
  if(fa.length) mt.push('un déficit moteur : '+fa.join(', '));
  if(d.barre===1) mt.push('une chute au Barré '+cote(d.barre_cote));
  if(d.ming===1) mt.push('une chute au Mingazzini '+cote(d.ming_cote));
  const motTest = MYO.some(m0=>['D','G'].some(sd=>d[myoKey(m0.k,sd)]!=null)) || has('barre') || has('ming');
  /* la pallesthésie écrit toujours 0 dans son agrégat : seules le tact léger et la piqûre prouvent que l'examen a eu lieu */
  const sensTest = d.sens_examinee===1 ||
                   (d.sens_examinee!==0 && MODAL.filter(m=>m.mode==='derm').some(m=>d['sens_'+m.k+'_nb']!=null));
  const sn = [];
  if(d.sens_examinee!==0){
    /* tact léger et piqûre portent souvent la même anomalie : on les écrit ensemble */
    const grp = {};
    MODAL.forEach(m=>{ const n = d['sens_'+m.k+'_nb']||0; if(!n) return;
      const t = (m.mode==='derm') ? dermResume(m.k) : zonesTxt(d['sens_'+m.k+'_zones']);
      (grp[t] = grp[t]||[]).push(low(m.l)); });
    Object.keys(grp).forEach(t=>sn.push(lst(grp[t])+' : '+t));
  }
  if(d.sf_subj===1) sn.push('signes subjectifs'+(d.sf_subj_cote?' '+cote(d.sf_subj_cote):'')+(d.subj_nb?' ('+zonesTxt(d.subj_zones)+')':''));
  mt.forEach(x=>ps.push(['déficit moteur', x.trim()]));
  if(sn.length) ps.push(['troubles sensitifs', 'des troubles sensitifs : '+sn.join(' ; ')]);
  if(!mt.length && !sn.length){
    if(motTest && sensTest) ng.push('pas de déficit sensitivo-moteur');
    else if(motTest) ng.push('pas de déficit moteur'+(d.sens_examinee===0?', sensibilités non examinées':''));
    else if(sensTest) ng.push('pas de déficit sensitif');
  } else if(!mt.length && motTest) ng.push('pas de déficit moteur');
  else if(!sn.length && sensTest) ng.push('pas de déficit sensitif');
  /* douleur */
  const dl = [];
  if(d.sf_ceph===1) dl.push('céphalées');
  if(d.sf_rachis===1) dl.push('douleur rachidienne'+(d.sf_rachis_loc&&d.sf_rachis_loc.length?' ('+d.sf_rachis_loc.join(', ')+')':''));
  if(has('eva_type') && d.eva_type!==3 && d.eva_score>0) dl.push((d.eva_type===1?'EVA ':'EN ')+d.eva_score+'/10'+(d.eva_loc?' ('+flat(d.eva_loc)+')':''));
  if(dl.length) ps.push(['douleur', 'une douleur : '+dl.join(', ')]);
  else if(['sf_ceph','sf_rachis'].some(has)) ng.push('pas de céphalée ni de douleur rachidienne');
  /* coordination */
  const co = [];
  if(d.vertic===0) co.push('verticalisation impossible');
  else if(has('vertic')){
    if(d.equil_yo===0) co.push('équilibre statique non conservé yeux ouverts');
    if(d.equil_yf===0) co.push('équilibre statique non conservé yeux fermés');
  }
  if(d.marche===0) co.push('marche impossible');
  else if(has('marche')){
    if(d.marche_yo===1) co.push('marche anormale yeux ouverts');
    if(d.marche_yf===1) co.push('marche anormale yeux fermés');
    if(d.devia_cote) co.push('déviation '+cote(d.devia_cote));
  }
  if(d.talon_genou===0) co.push('talon-genou déficitaire '+cote(d.talon_genou_cote));
  if(d.doigt_nez===0) co.push('doigt-nez déficitaire '+cote(d.doigt_nez_cote));
  if(co.length) ps.push(['troubles de la coordination', 'des troubles de la coordination : '+co.map(x=>x.trim()).join(', ')]);
  else if(['vertic','marche','talon_genou','doigt_nez'].some(has)) ng.push('verticalisation, équilibre, marche et épreuves cérébelleuses normaux');
  /* réflexes, signes pyramidaux */
  const RN = {ref_bicip:['bicipitaux','bicipital'], ref_tricip:['tricipitaux','tricipital'],
              ref_rot:['rotuliens','rotulien'], ref_ach:['achilléens','achilléen']};
  const RFL = {poly:'polycinétique', etendu:'diffusé'};
  /* description d'un réflexe anormal : null s'il est simplement présent */
  const rdesc = k => { const v = d[k]; if(v==null) return null;
    const fl = ['etendu','poly'].filter(f=>d[k+'_'+f]);
    return (v===1 && !fl.length) ? null : {v:v, fl:fl}; };
  const rtxt = (x, pl) => [x.v===0 ? 'aboli' : x.v===2 ? 'vif' : 'présent'].concat(x.fl.map(f=>RFL[f]))
                            .map(w=>w+(pl?'s':'')).join(', ');
  const rkey = x => x ? x.v+'|'+x.fl.join(',') : '';
  const rg = {};       // description commune aux deux côtés -> groupes concernés
  const rside = [];    // réflexes asymétriques
  let rtest = 0;
  Object.keys(RN).forEach(b=>{
    const D = rdesc(b+'_D'), G = rdesc(b+'_G');
    if(d[b+'_D']!=null || d[b+'_G']!=null) rtest++;
    if(!D && !G) return;
    if(D && G && rkey(D)===rkey(G)){ const t = rtxt(D, true); (rg[t] = rg[t]||[]).push(RN[b][0]); }
    else {
      if(D) rside.push(RN[b][1]+' droit '+rtxt(D, false));
      if(G) rside.push(RN[b][1]+' gauche '+rtxt(G, false));
    }
  });
  const rf = [];
  Object.keys(rg).forEach(k=>rf.push('ROT '+lst(rg[k])+' '+k));
  rside.forEach(x=>rf.push('ROT '+x));
  ['D','G'].forEach(s=>{ if(d['hoffman_'+s]===1) rf.push('signe de Hoffmann positif '+(s==='D'?'à droite':'à gauche')); });
  const trepTxt = (base, nom) => {
    const parts = [];
    ['D','G'].forEach(sd=>{
      const c = d[base+'_cote'], concerne = (sd==='D' ? (c===1||c===3) : (c===2||c===3));
      if(!concerne) return;
      const q = d[base+'_qual_'+sd];
      parts.push((sd==='D'?'à droite':'à gauche')+(q?' ('+low(lab(base+'_qual_'+sd))+')':''));
    });
    return nom+' '+(parts.length ? parts.join(' et ') : cote(d[base+'_cote']));
  };
  if(d.trep_pied===1) rf.push(trepTxt('trep_pied','trépidation épileptoïde du pied'));
  if(d.trep_rot===1) rf.push(trepTxt('trep_rot','trépidation épileptoïde de la rotule'));
  const bbk = {D:d.bbk_D, G:d.bbk_G};
  ['D','G'].forEach(s=>{ if(bbk[s]===2) rf.push('cutané plantaire en extension '+(s==='D'?'à droite':'à gauche')); });
  const bbkInd = ['D','G'].filter(s=>bbk[s]===1);
  if(bbkInd.length && rf.length) rf.push('cutané plantaire indifférent '+(bbkInd.length===2 ? 'des deux côtés' : (bbkInd[0]==='D'?'à droite':'à gauche')));
  if(d.contract===1) rf.push('contractions musculaires spontanées '+cote(d.contract_cote)+(d.contract_loc?' ('+flat(d.contract_loc)+')':''));
  if(rf.length) ps.push(['anomalies des réflexes', 'des anomalies des réflexes : '+rf.map(x=>x.trim()).join(', ')]);
  else if(rtest || ['hoffman_D','hoffman_G','bbk_D','bbk_G','trep_pied','trep_rot'].some(has))
    ng.push('réflexes ostéotendineux présents et symétriques, pas de signe pyramidal');
  /* peau, examen général */
  if(d.cut_present===1){
    const c = [];
    if(d.cut_nb) c.push(zonesTxt(d.cut_zones));
    if(d.cut_delai!=null) c.push('apparition '+d.cut_delai+'\' après l’émersion');
    if(has('cut_evol')) c.push('évolution sous oxygène : '+low(lab('cut_evol')));
    if(d.cut_txt) c.push(flat(d.cut_txt));
    ps.push(['lésions cutanées', 'des lésions cutanées de désaturation'+(c.length?' : '+c.join(', '):'')]);
  } else if(d.cut_present===0) ng.push('pas de lésion cutanée');
  const GEN = [['ex_cv','cardio-vasculaire'],['ex_pneumo','respiratoire'],['ex_abdo','abdominal'],['ex_loco','locomoteur']];
  const gx = GEN.filter(g=>d[g[0]]===1).map(g=>'anomalie '+g[1]+(d[g[0]+'_txt']?' ('+flat(d[g[0]+'_txt']).replace(/\.$/,'')+')':''));
  if(gx.length) ps.push(['anomalies de l’examen général', 'des anomalies à l’examen général : '+gx.join(', ')]);
  const gn = GEN.filter(g=>d[g[0]]===0).map(g=>g[1]);
  if(gn.length) ng.push('examen '+lst(gn)+' sans anomalie');

  /* miction et sphincter */
  const mi = [];
  if(has('mict')) mi.push(d.mict===1 ? (d.mict_type===3 ? 'miction par regorgement ou rétention' : d.mict_type===2 ? 'miction spontanée avec effort' : 'miction spontanée') : 'pas de miction depuis l’accident');
  if(d.mict_residu_post!=null) mi.push(d.mict_residu_post>100 ? 'résidu post-mictionnel à '+d.mict_residu_post+' mL' : d.mict_residu_post===0 ? 'pas de résidu post-mictionnel' : 'résidu post-mictionnel non significatif ('+d.mict_residu_post+' mL)');
  if(d.mict_residu_pre!=null) mi.push('résidu pré-mictionnel de '+d.mict_residu_pre+' mL');
  /* l'examen anal ne s'écrit que s'il est anormal : contraction volontaire absente, pression profonde non perçue.
     Normal ou non testé, il ne figure pas dans le texte. */
  const anal = [];
  if(d.vac===0) anal.push('contraction anale volontaire absente');
  if(d.dap===0) anal.push('pression anale profonde non perçue');
  if(anal.length) mi.push(anal.join(', '));
  if(d.mict===0 || d.mict_type===3 || d.mict_residu_post>100 || d.vac===0 || d.dap===0) ps.push(['troubles sphinctériens', 'des troubles sphinctériens']);

  /* l'examen s'écrit « A l'examen : pas de …, GCS 15, … En revanche, il existe … » */
  const ex1 = [];
  if(ng.length && ps.length) ex1.push('À l’examen : '+ng.join(', ')+'. En revanche, il existe '+ps.map(x=>x[1]).join(' ; ')+'.');
  else if(ng.length) ex1.push('À l’examen : '+ng.join(', ')+'.');
  else if(ps.length) ex1.push('À l’examen : il existe '+ps.map(x=>x[1]).join(' ; ')+'.');
  if(mi.length) ex1.push(cap(mi.join(', '))+'.');
  /* Score ASIA : les totaux, puis les niveaux quand l'examen n'est pas normal. La préservation sacrée
     ne s'écrit que si elle est absente : sa présence est la règle. */
  const asia = (()=>{
    if(!(ASIA && ASIA.ais)) return '';
    const a = [];
    if(ASIA.lt!=null) a.push('tact léger '+ASIA.lt+'/112');
    if(ASIA.pp!=null) a.push('piqûre '+ASIA.pp+'/112');
    if(ASIA.uems!=null) a.push('moteur membres supérieurs '+ASIA.uems+'/50');
    if(ASIA.lems!=null) a.push('moteur membres inférieurs '+ASIA.lems+'/50');
    if(ASIA.ais!=='E'){
      a.push('niveaux sensitifs droit '+ASIA.sens_D+', gauche '+ASIA.sens_G);
      a.push('niveaux moteurs droit '+ASIA.mot_D+', gauche '+ASIA.mot_G);
      a.push('niveau neurologique '+ASIA.nli);
    }
    if(ASIA.sacralKnown && !ASIA.sacral) a.push('absence de préservation sacrée');
    a.push('AIS '+ASIA.ais);
    return 'Score ASIA : '+a.join(', ')+'.';
  })();
  sect(TY===1 ? 'Examen clinique d’entrée' : 'Examen clinique', [mes.join(' ; '), ex1.join(' ')], false);

  /* ---------- au total ---------- */
  if(has('conclusion')){
    const doms = ps.map(x=>x[0]).filter((x,i,a)=>x!=='douleur' && a.indexOf(x)===i);
    let t;
    if(d.conclusion===1) t = 'examen neurologique normal';
    else if(d.conclusion===2) t = 'examen neurologique anormal'+(doms.length?', avec '+lst(doms):'');
    else t = 'examen à recontrôler'+(doms.length?' ('+lst(doms)+')':'');
    sect('Au total', [fin(t)], true);
  }

  /* ---------- actes, biologie, examens complémentaires et scores ---------- */
  const pc = [];
  const act = [];                    // la voie veineuse ne s'écrit pas : geste courant, sans intérêt dans le compte rendu
  if(d.ac_sonde===2 || d.ac_sonde===3)
    act.push((d.ac_sonde===2 ? 'sonde vésicale à demeure' : 'sondage vésical évacuateur')+
             (d.ac_sonde_vol!=null ? ' (volume initial évacué : '+d.ac_sonde_vol+' mL)' : ''));
  if(act.length) pc.push('Actes : '+lst(act)+'.');
  const bio = [];
  if(d.bio_add===1) bio.push('bilan accident de plongée');
  if(d.bio_opi===1) bio.push('bilan d’œdème pulmonaire d’immersion');
  if(d.bio_etude===1) bio.push('prélèvement pour étude complémentaire');
  if(d.bio_autre) bio.push(flat(d.bio_autre).replace(/\.$/,''));
  if(bio.length || d.bio_res)
    pc.push('Biologie : '+[bio.length ? lst(bio)+' prélevé'+(bio.length>1?'s':'') : '',
                           d.bio_res ? 'résultats marquants : '+flat(d.bio_res).replace(/\.$/,'') : ''].filter(Boolean).join(' ; ')+'.');
  /* un examen réalisé, avec son résultat quand il est saisi ; e : féminin pour l'accord de « réalisé » */
  const exam = (k, lib, res, e) => {
    if(d[k]!==1) return;
    pc.push(d[res] ? fin(lib+' : '+lc1(flat(d[res]))) : lib+' réalisé'+(e?'e':'')+'.');
  };
  if(d.im_ecg===1) pc.push(d.ecg_txt ? fin('ECG : '+d.ecg_txt) : 'ECG réalisé.');
  exam('im_rp', 'Radiographie thoracique', 'im_rp_res', 1);
  exam('im_tdm_thor', 'Scanner thoracique', 'im_tdm_thor_res', 0);
  exam('im_tdm_cer', 'Scanner cérébral', 'im_tdm_cer_res', 0);
  exam('im_irm_cer', 'IRM cérébrale', 'im_irm_cer_res', 1);
  exam('im_irm_med', 'IRM médullaire', 'im_irm_med_res', 1);
  exam('im_eto', 'Échographie cardiaque'+(d.im_eto_fop ? ' (recherche de FOP)' : ''), 'im_eto_res', 1);
  if(d.im_dtc===1){
    const cond = [['dtc_repos','sans sensibilisation'],['dtc_sensib','après sensibilisation allongée'],['dtc_flack','pendant un test de Flack']]
                 .filter(x=>d[x[0]]!=null).map(x=>x[1]+', '+lc1(lab(x[0])));
    pc.push(cond.length || d.dtc_txt ? fin('Doppler transcrânien : '+[cond.join(' ; '), d.dtc_txt ? flat(d.dtc_txt) : ''].filter(Boolean).join(' ; '))
                                     : 'Doppler transcrânien réalisé.');
  }
  if(d.im_echopp===1){
    const e = echoTexte() || 'Échographie pleuro-pulmonaire réalisée.';
    pc.push(d.ech_txt ? e+' '+flat(d.ech_txt) : e);
  }
  if(d.im_autre) pc.push(fin('Autres examens : '+flat(d.im_autre)));
  if(d.im_demande) pc.push('Examens demandés : '+flat(d.im_demande).replace(/\.$/,'')+'.');
  /* les deux scores s'écrivent par leur seule valeur, sans maximum, seuil ni détail des items ;
     le moment de la cotation n'est précisé que quand le dossier en compte plusieurs */
  const Rn = mshCalc();
  if(!Rn.horsFenetre){
    const sr = mshSerie();
    if(sr.length) pc.push('Score MEDSUBHYP : '+sr.map(x=>x.t+(sr.length>1 ? ' '+x.lab : '')).join(', ')+'.');
  }
  const Vn = vestCalc();
  if(Vn && Vn.total!=null) pc.push(Vn.nom+' : '+Vn.total+'.');
  if(asia) pc.push(asia);
  sect('Examens paracliniques', pc, false);

  /* ---------- diagnostic retenu : entre les examens paracliniques et la conduite à tenir ---------- */
  const dgt = diagnosticTexte(d);
  if(dgt) sect('Diagnostic retenu', [dgt], true);

  /* ---------- conduite à tenir ---------- */
  const cat = [];
  const ORIENT = {1:'retour au domicile', 2:'hospitalisation en service de médecine', 3:'hospitalisation en surveillance continue',
                  4:'hospitalisation en soins intensifs', 5:'transfert vers '+(d.orientation_autre?flat(d.orientation_autre):'une autre structure')};
  const ori = ORIENT[d.orientation] || '';
  const tbl = tableLib(d);
  if(tbl || d.tb_h_mep){
    const tb = [];
    if(d.tb_h_mep) tb.push('mise en pression à '+hFr(d.tb_h_mep));
    if(d.tb_h_fin) tb.push('fin à '+hFr(d.tb_h_fin));
    if(d.tb_delai!=null) tb.push('recompression '+dureeFr(d.tb_delai)+' après les premiers symptômes');
    if(d.tb_nb_seances!=null) tb.push(d.tb_nb_seances+' séance'+(d.tb_nb_seances>1?'s':'')+' réalisée'+(d.tb_nb_seances>1?'s':''));
    cat.push(fin('Table '+(tbl ? flat(tbl) : 'de recompression')+(tb.length?' ('+tb.join(', ')+')':'')+(ori?' puis '+ori:'')));
  } else if(ori) cat.push(fin('Orientation : '+ori));
  if(d.tb_complic===1) cat.push(fin('Complication thérapeutique'+(d.tb_complic_txt?' : '+flat(d.tb_complic_txt):'')));
  if(d.rx_o2===1){
    let o = 'Oxygénothérapie normobare';
    if(d.rx_o2_mode===1) o += ' au masque à haute concentration'+(d.rx_o2_debit!=null ? ' à '+d.rx_o2_debit+' L/min' : '');
    else if(d.rx_o2_mode===2){
      const v = [];
      if(d.rx_vni_pep!=null) v.push('PEP '+d.rx_vni_pep+' cmH2O');
      if(d.rx_vni_ai!=null) v.push('AI '+d.rx_vni_ai+' cmH2O');
      if(d.rx_vni_fr!=null) v.push('FR '+d.rx_vni_fr+'/min');
      if(d.rx_vni_fio2!=null) v.push('FiO2 '+d.rx_vni_fio2+' %');
      o += ' en ventilation non invasive'+(v.length ? ' ('+v.join(', ')+')' : '');
    }
    cat.push(o+'.');
  }
  if(d.rx_solu===1){
    let c = 'Corticothérapie : (méthyl)prednisolone';
    if(d.rx_solu_dose!=null) c += ' '+d.rx_solu_dose+' mg/jour'+
      (d.poids>0 && d.rx_solu_dose===Math.round(d.poids*DEF_CORTICO_MGKG) ? ' ('+DEF_CORTICO_MGKG+' mg/kg)' : '');
    if(d.rx_solu_jours!=null) c += ' pendant '+d.rx_solu_jours+' jour'+(d.rx_solu_jours>1?'s':'');
    if(d.rx_solu_h) c += ', 1re dose à '+hFr(d.rx_solu_h);
    cat.push(c+'.');
  }
  if(d.rx_nacl===1) cat.push('Remplissage vasculaire'+(d.rx_nacl_vol!=null?' '+d.rx_nacl_vol+' mL':'')+'.');
  if(d.rx_antalg) cat.push(fin('Antalgiques : '+flat(d.rx_antalg)));
  [d.rx_autres, d.orientation_txt].forEach(t=>{ if(t) String(t).split(/\n+/).forEach(l=>{ if(l.trim()) cat.push(fin(l)); }); });
  sect('Conduite à tenir', cat, false);

  /* ---------- commentaires et pièces jointes ---------- */
  if(d.notes) sect('Commentaires', [flat(d.notes)], true);
  return B;
}

/* texte brut : pour le presse-papiers et les traitements de texte sans mise en forme */
function narrative(){
  return narrativeBlocks().map(b=>{
    if(b.title) return b.lines.join('\n');
    return b.inline ? b.h+' : '+b.lines.join('\n') : b.h+' :\n'+b.lines.join('\n');
  }).join('\n\n');
}
/* même texte avec titres en gras, pour l'écran, le PDF et la copie enrichie */
function narrativeHTML(){
  return narrativeBlocks().map(b=>{
    if(b.title) return '<p><b>'+b.lines.map(esc).join('<br>')+'</b></p>';
    return '<p><b>'+esc(b.h)+' :</b>'+(b.inline ? ' ' : '<br>')+b.lines.map(esc).join('<br>')+'</p>';
  }).join('');
}

/* Le paragraphe d'évolution destiné au compte rendu de sortie.
   Il est assemblé à partir des champs de l'encart, pas recopié à la main :
   ce qui est saisi ici se retrouve mot pour mot dans le CRH. */
function evolTexte(){
  const d = REC.d, P = [];
  const quand = d.date_ex ? 'Le '+frDate(d.date_ex)+(d.heure_ex?' à '+TXT.hFr(d.heure_ex):'') : '';
  const s1 = [];
  if(d.ev_seances!=null)
    s1.push(d.ev_seances+' séance'+(d.ev_seances>1?'s':'')+' de recompression '+
            (d.ev_seances>1?'ont été réalisées':'a été réalisée')+' depuis la consultation précédente');
  if(d.ev_complic===0) s1.push('sans complication thérapeutique');
  else if(d.ev_complic===1)
    s1.push('avec une complication thérapeutique'+(d.ev_complic_txt?' : '+d.ev_complic_txt.replace(/\s*\.\s*$/,''):''));
  if(s1.length) P.push((quand?quand+', ':'')+s1.join(', ').replace(/^./,c=>quand?c:c.toUpperCase())+'.');
  /* Les libellés du champ sont masculins (« amélioré »), accordés avec le patient
     et non avec l'évolution : on écrit donc la phrase autour du patient. */
  if(has('ev_sens')){
    const F = d.sexe===2, et = lab('ev_sens').toLowerCase();
    P.push((F ? 'La patiente est ' : 'Le patient est ')+(F && /é$/.test(et) ? et+'e' : et)+'.');
  }
  if(d.ev_txt) P.push(d.ev_txt.trim());
  if(d.ev_exam_faits) P.push('Examens complémentaires réalisés : '+d.ev_exam_faits.trim().replace(/\s*\.\s*$/,'')+'.');
  if(d.ev_exam_demandes) P.push('Examens complémentaires demandés : '+d.ev_exam_demandes.trim().replace(/\s*\.\s*$/,'')+'.');
  return TXT.clean(P.join(' '));
}
function copyEvol(){
  const t = evolTexte();
  if(!t){ toast("Rien à copier : l'encart d'évolution est vide"); return; }
  navigator.clipboard.writeText(t).then(()=>toast('Paragraphe copié'),()=>toast('Copie impossible'));
}
function evolBox(){
  const t = evolTexte();
  return '<div class="note" style="background:#f2f6fb;border-color:#c9d8ea">'+
   '<div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:5px">'+
   '<b>Paragraphe pour le compte rendu de sortie</b>'+
   '<button class="mini" style="margin-left:auto" onclick="copyEvol()">Copier</button></div>'+
   '<div id="evolp" style="white-space:pre-wrap;font-size:12.5px;line-height:1.45'+(t?'':';color:var(--ink2)')+'">'+
   (t ? esc(t) : "Renseignez l'encart : le paragraphe s'écrit tout seul et se recopie dans le CRH.")+'</div></div>';
}
function renderSynth(){ const el=$('#synth'); if(el) el.innerHTML=narrativeHTML() ||
    '<span style="color:var(--ink2)">Renseignez la fiche : la synthèse s\'écrit toute seule.</span>';
  const ev=$('#evolp'); if(ev) ev.textContent = evolTexte() ||
    "Renseignez l'encart : le paragraphe s'écrit tout seul et se recopie dans le CRH.";
}
/* Copie en texte brut ET en texte enrichi : collée dans un traitement de texte,
   la synthèse garde ses titres en gras ; collée dans un champ simple, elle reste lisible. */
function copySynth(){
  const txt = narrative(), ok = ()=>toast('Synthèse copiée'), ko = ()=>toast('Copie impossible');
  if(!navigator.clipboard){ ko(); return; }
  if(window.ClipboardItem && navigator.clipboard.write){
    const html = '<div style="font-family:Calibri,Arial,sans-serif;font-size:11pt">'+narrativeHTML()+'</div>';
    navigator.clipboard.write([new ClipboardItem({
      'text/plain': new Blob([txt], {type:'text/plain'}),
      'text/html':  new Blob([html], {type:'text/html'})
    })]).then(ok, ()=>navigator.clipboard.writeText(txt).then(ok, ko));
  } else navigator.clipboard.writeText(txt).then(ok, ko);
}

   IMPRESSION / PDF
   ===================================================================== */
function pv(k,normalVal){ const v=REC.d[k];
  if(v==null||v==='') return '<span style="color:#888">—</span>';
  const t=lab(k), f=FIELDS[k];
  /* une valeur déclarée normale par le champ ne se souligne pas à l'impression */
  const ok = f && f.ok && f.ok.indexOf(v)>=0;
  const abn = !ok && normalVal!=null && v!==normalVal;
  return '<span class="pv'+(abn?' ab':'')+'">'+esc(t!=null?t:v)+'</span>'; }
function pline(l,html){ return '<div class="pl"><b>'+l+' :</b> '+html+'</div>'; }
function pcote(k){ const v=REC.d[k]; return v?' <span class="pv">('+(v===1?'D':v===2?'G':'D+G')+')</span>':''; }
function pmulti(k){ const t=multiLab(k,1); return t?' <span class="pv">[regard '+esc(t)+']</span>':''; }
function ptrep(base,nom){
  const d=REC.d;
  if(d[base]!==1) return pline(nom,pv(base,0));
  const c=d[base+'_cote'], parts=[];
  ['D','G'].forEach(sd=>{
    const concerne = (sd==='D' ? (c===1||c===3) : (c===2||c===3));
    if(!concerne) return;
    parts.push(sd+' : '+(d[base+'_qual_'+sd]!=null? pv(base+'_qual_'+sd) : '<span style="color:#888">caractère non précisé</span>'));
  });
  return pline(nom, pv(base,0)+pcote(base+'_cote')+(parts.length?' &nbsp; '+parts.join(' &nbsp;·&nbsp; '):''));
}
function pref(k){ return pv(k,1)+'<span class="pf">'+esc(refFlags(k))+'</span>'; }
function pid(l,v){ return '<div style="font-size:8.2pt"><b>'+l+' :</b> '+(v?esc(v):'<span style="color:#888">&nbsp;</span>')+'</div>'; }
function box(t,inner){ return '<div class="pbox"><h4>'+t+'</h4><div class="pb">'+inner+'</div></div>'; }

/* =====================================================================
   IMPRESSION DES ENCARTS PILOTÉS PAR LE SPEC
   Les encarts d'anamnèse, de plongée, de plongeur, d'actes et de traitement
   portent près de deux cents champs. Les écrire un par un dans la fonction
   d'impression, c'est garantir qu'un champ ajouté au SPEC n'apparaîtra
   jamais sur le papier. On les rend donc à partir du SPEC lui-même : ce qui
   est saisi s'imprime, le reste disparaît.
   ===================================================================== */
function pspecVal(f){
  const d = REC.d, v = d[f.k];
  if(f.t==='head' || f.t==='html') return null;
  if(f.t==='multi'){
    const t = multiLab(f.k); return t ? esc(t) : null;
  }
  if(f.t==='check') return v ? '<span class="pv">'+esc(f.cl||'Oui')+'</span>' : null;
  if(v==null || v==='') return null;
  if(f.t==='choice' || f.t==='select' || f.t==='bool'){
    const o = (f.o||[]).find(x=>x.v===v);
    const txt = o ? o.l : String(v);
    const mauvais = o && (o.c==='v-ab' || o.c==='v-wn');
    return '<span class="pv'+(mauvais?' ab':'')+'">'+esc(txt)+'</span>';
  }
  if(f.t==='num' || f.t==='calc')
    return '<span class="pv">'+esc(String(v))+(f.unit?' '+esc(f.unit):'')+'</span>';
  if(f.t==='date') return '<span class="pv">'+esc(frDate(v))+'</span>';
  return esc(String(v)).replace(/\n/g,'<br>');
}

const PGROUPED = (function(){ const s={}; Object.keys(PGROUP).forEach(p=>PGROUP[p].kids.forEach(c=>{ s[c]=p; })); return s; })();
/* valeur d'un champ en texte brut */
function ptxt(f){
  const v = REC.d[f.k]; if(v==null || v==='') return '';
  if(f.t==='check') return v ? (f.cl || 'Oui') : '';
  if(f.t==='choice' || f.t==='select'){ const o = (f.o||[]).find(x=>x.v===v); return o ? o.l : String(v); }
  if(f.t==='date') return frDate(v);
  if(f.t==='multi') return multiLab(f.k);
  return String(v) + (((f.t==='num' || f.t==='calc') && f.unit) ? ' '+f.unit : '');
}
/* Un encart du SPEC rendu en deux colonnes. Retourne '' si rien n'est saisi :
   un cadre vide sur un compte rendu d'urgence est du bruit.
   Les champs portant col:'a' ou col:'b' s'impriment à part, en deux colonnes
   titrées (personne à prévenir / médecin traitant). */
function pspec(id, titre, etroit){
  const S = SPEC.find(x=>x.id===id); if(!S) return '';
  const lignes = [], cols = {a:[], b:[]}, colH = {a:'', b:''};
  let TXN = null;
  S.f.forEach(f=>{
    if(f.t==='head'){ if(f.col) colH[f.col] = f.l; return; }
    if(f.t==='html' || PMERGED[f.k] || PGROUPED[f.k] || PSKIP[f.k] || (PHIDE[f.k] && REC.d.ecg_txt)) return;
    if(PGROUP[f.k]){
      const t = PGROUP[f.k].t(TXN || (TXN = terrainTextes()));
      if(t.length) lignes.push(pline(esc(PGROUP[f.k].l), esc(TXT.flat(t.join(' ; ')))));
      return;
    }
    if(f.nofill && !REC.d[f.k]) return;
    let v = pspecVal(f);
    if(v==null) return;
    const kids = (PMERGE[f.k]||[]).map(c=>ptxt(FIELDS[c])).filter(Boolean);
    if(kids.length) v += ' — '+esc(kids.join(', '));
    if(PCUSTOM[f.k]) v = PCUSTOM[f.k](v);
    if(f.col) cols[f.col].push(pline(esc(f.l.replace(/^[^—]*—\s*/,'')), v));
    else lignes.push(pline(esc(f.l), v));
  });
  const tail = S.ptail ? S.ptail() : '';
  if(!lignes.length && !cols.a.length && !cols.b.length && !tail) return '';
  const moitie = Math.ceil(lignes.length/2);
  let corps = (lignes.length > 5 && !etroit)
    ? '<div class="p2"><div>'+lignes.slice(0,moitie).join('')+'</div><div>'+lignes.slice(moitie).join('')+'</div></div>'
    : lignes.join('');
  if(cols.a.length || cols.b.length){
    const side = k => cols[k].length ? '<div class="pl"><b>'+esc(colH[k])+'</b></div>'+cols[k].join('') : '';
    corps += '<div class="p2" style="margin-top:.8mm"><div>'+side('a')+'</div><div>'+side('b')+'</div></div>';
  }
  return '<div class="pbox"><h4 class="small">'+esc(titre||S.t).toUpperCase()+'</h4><div class="pb">'+corps+tail+'</div></div>';
}
/* Contacts (personne à prévenir, médecin traitant) : sur le papier ils ferment l'encart
   d'anamnèse, en deux colonnes, sans cadre propre — un cadre de plus coûte 6 mm sur la page 1. */
function pcontacts(){
  const S = SPEC.find(x=>x.id==='contacts'); if(!S) return '';
  const cols = {a:[], b:[]}, colH = {a:'', b:''};
  S.f.forEach(f=>{
    if(f.t==='head'){ if(f.col) colH[f.col] = f.l; return; }
    if(PMERGED[f.k]) return;
    let v = pspecVal(f); if(v==null) return;
    const kids = (PMERGE[f.k]||[]).map(c=>ptxt(FIELDS[c])).filter(Boolean);
    if(kids.length) v += ' — '+esc(kids.join(', '));
    cols[f.col].push(pline(esc(f.l.replace(/^[^—]*—\s*/,'')), v));
  });
  if(!cols.a.length && !cols.b.length) return '';
  const side = k => cols[k].length ? '<div class="pl"><b>'+esc(colH[k])+'</b></div>'+cols[k].join('') : '';
  return '<div class="p2" style="border-top:.3mm solid #000;margin-top:.8mm;padding-top:.6mm"><div>'+side('a')+'</div><div>'+side('b')+'</div></div>';
}

  /* ---------- schémas corporels et pallesthésie ---------- */

  const half = Math.ceil(LANDMARKS.length/2);

    return '<tr><td>'+esc(l.l)+'</td>'+(l.uni?'<td colspan="2" style="text-align:center">'+c(null)+'</td>':'<td>'+c('D')+'</td><td>'+c('G')+'</td>')+'</tr>';
  };
  h+='<div class="pbox"><h4 class="small">PALLESTHÉSIE<span class="sb"> sensibilité vibratoire sur les reliefs osseux — diapason</span></h4>'+

  /* Les scores de sévérité closent l'examen, après la grille ASIA dont ils

     pline('Orientation',pv('orientation')+(d.orientation===5&&d.orientation_autre?' — '+esc(d.orientation_autre):''))+

  h+='</div>';

  /* ---------- pages de pièces jointes ---------- */
  const PJ = Array.isArray(d.pj) ? d.pj : [];
  if(PJ.length){
    /* six vignettes par page en deux colonnes, une seule si la photo est isolée :
       au-delà, les images deviennent trop petites pour servir à quoi que ce soit */
    const parPage = PJ.length === 1 ? 1 : 6;
    for(let i = 0; i < PJ.length; i += parPage){
      const lot = PJ.slice(i, i + parPage);
      const n = Math.ceil(PJ.length / parPage), pg = Math.floor(i / parPage) + 1;
      h += '<div class="pg"><div class="phead" style="font-size:10.5pt">PIÈCES JOINTES'+
           (n > 1 ? ' ('+pg+'/'+n+')' : '')+'</div>'+
           '<div class="pjp'+(lot.length === 1 ? ' solo' : '')+'">'+
           lot.map(it => '<figure><figcaption>'+esc(pjLabel(it))+'</figcaption>'+
             '<img src="'+it.data+'" alt="">'+
             '<div class="pjn">'+esc(it.nom || '')+' · '+it.w+'×'+it.h+' px</div></figure>').join('')+
           '</div>'+
           '<div style="font-size:7pt;text-align:right;margin-top:1.5mm;color:#444">Fiche '+esc(REC.id)+
           ' — '+esc(d.dossier || 'sans dossier')+' — '+frDate(d.date_ex)+'</div></div>';
    }
  }
  return h;
}

/* Feuille de style complete de la page, reutilisee telle quelle pour
   l'impression native : l'adaptateur d'impression d'Android et de iOS
   applique bien les regles @media print. */
function printCSS(){
  return Array.prototype.map.call(document.querySelectorAll('style'), s=>s.textContent).join('\n')
       + '\n@page{size:A4 portrait;margin:9mm 10mm}'
       + '\nbody.printdoc{background:#fff}'
       + '\nbody.printdoc #print-root{display:block !important}';
}
function printName(){
  return 'Fiche_neuro_'+(REC.d.dossier||'sans-dossier')+'_'+(REC.d.date_ex||'')+(REC.d.num_ex?'_ex'+REC.d.num_ex:'');
}
function doPrint(){
  computeAll();
  $('#print-root').innerHTML = buildPrint();

  /* Dans un WebView natif (Android, iOS), window.print() ne fait rien :
     ni WebView ni WKWebView n'implementent l'appel. On passe alors par le
     plugin NativePrint livre avec le projet natif, qui ouvre le service
     d'impression du systeme (impression papier ou export PDF). */
  const NP = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.NativePrint;
  if(NP){
    const doc = '<!doctype html><html lang="fr"><head><meta charset="utf-8">'+
      '<title>'+printName()+'</title><style>'+printCSS()+'</style></head>'+
      '<body class="printdoc">'+$('#print-root').innerHTML+'</body></html>';
    NP.print({ name: printName(), html: doc })
      .catch(e => toast('Impression indisponible : '+e));
    return;
  }

  const old=document.title;
  document.title = printName();
  window.print();
  setTimeout(()=>{document.title=old;},800);
}

/* =====================================================================
   COLONNES DU FICHIER STATISTIQUE + DICTIONNAIRE
   ===================================================================== */
const SET = {pii:false, sep:';', poste:'', wedge:true, scanRe:'', hash:false, hashLen:12, salt:'', searchSame:true, autoDl:false};

function codesOf(f){
  if(f.t==='choice' || f.t==='select')
    return f.o.map(o=>o.v+' = '+o.l).join(' ; ');
  if(f.t==='multi')  return '1 = coche ; 0 = non coche';
  if(f.t==='check')  return '1 = coche ; vide = non coche';
  if(f.t==='date')   return 'AAAA-MM-JJ';
  if(f.t==='time')   return 'HH:MM';
  if(f.t==='num')    return 'numerique'+(f.unit?' ('+f.unit+')':'');
  if(f.t==='calc')   return 'numerique, calcule'+(f.unit?' ('+f.unit+')':'');
  return 'texte libre';
}
/* Les libelles ecrits a la main dans ce fichier sont sans accent : le
   dictionnaire reste lisible quel que soit l'encodage du tableur qui
   l'ouvre. noAcc applique la meme regle aux libelles repris du SPEC. */
function noAcc(t){ return String(t==null?'':t).normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

function columns(pii){
  const C=[], add=(k,l,codes,get)=>C.push({k:k,l:l,codes:codes,get:get||(r=>r.d[k])});
  add('fiche_id',"Identifiant unique de la fiche",'texte (cle primaire, sert au dedoublonnage)',r=>r.id);
  add('dossier',"N. de dossier / identifiant du sujet",'texte (cle sujet : relie les examens repetes)');
  add('dossier_pseudo','Identifiant pseudonymise ?',
      '1 = empreinte salee SHA-256 d un identifiant scanne ou saisi (prefixe P-) ; 0 = valeur saisie telle quelle ; vide = non renseigne',
      r=>r.d.dossier_pseudo!=null?r.d.dossier_pseudo:'');
  add('num_ex',"Rang de l'examen pour ce sujet",'entier >= 1, ordonne par date et heure');
  add('date_ex',"Date de l'examen",'AAAA-MM-JJ');
  add('heure_ex',"Heure de l'examen",'HH:MM');
  add('examinateur','Examinateur','texte');
  add('poste','Poste de saisie','texte (renseigne dans les reglages, utile a la fusion)',()=>SET.poste);
  add('date_acc',"Date de l'accident",'AAAA-MM-JJ');
  add('heure_acc',"Heure de l'accident",'HH:MM');
  add('delai_min','Delai accident vers examen','entier, minutes (calcule)');
  add('fiche_type',"Type de consultation",
      '1 = consultation initiale (prise en charge en urgence) ; 2 = consultation de suivi ; '+
      '3 = consultation de sortie / CRH ; vide = non renseigne (a lire comme 1)',
      r=>r.d.fiche_type!=null?r.d.fiche_type:'');
  add('sexe','Sexe','1 = M ; 2 = F ; 3 = Autre');
  add('age',"Age a la date de l'examen",'entier, annees (calcule)');
  if(pii){ add('nom','Nom','texte - DONNEE IDENTIFIANTE');
           add('prenom','Prenom','texte - DONNEE IDENTIFIANTE');
           add('ddn','Date de naissance','AAAA-MM-JJ - DONNEE IDENTIFIANTE'); }

  SPEC.forEach(s=>{ if(s.id==='ident') return;
    s.f.forEach(f=>{
      if(f.t==='head' || f.t==='html') return;   // intertitre ou bloc d'affichage, pas une variable
      /* Un champ marqué identifiant (adresse, téléphone, e-mail, personne à prévenir,
         médecin traitant) ne sort dans le fichier de données que si les réglages
         l'autorisent, comme le nom, le prénom et la date de naissance. Il reste
         dans la fiche, sur le PDF et dans la sauvegarde JSON. */
      if(f.pii && !pii) return;
      if(f.t==='multi'){
        f.o.forEach(o=>add(f.k+'_'+o.v, f.l+' - '+o.l+' ('+s.t+')','1 = coche ; 0 = non coche',
          r=>{const a=r.d[f.k]; return Array.isArray(a)?(a.indexOf(o.v)>=0?1:0):(r.d[f.k+'_'+o.v]!=null?r.d[f.k+'_'+o.v]:'');}));
        add(f.k, f.l+' - liste ('+s.t+')','texte, valeurs separees par |',
          r=>Array.isArray(r.d[f.k])?r.d[f.k].join('|'):(r.d[f.k]||''));
      } else {
        /* dl : libellé pour le dictionnaire quand celui du formulaire n'a de sens que sous son parent (« Résultat ») */
        add(f.k, (f.dl||f.l)+' ('+s.t+')', codesOf(f));
        // qualites complementaires des reflexes osteotendineux
        if(f.flags) f.flags.forEach(fl=>{ const kk=f.k+'_'+fl.k;
          add(kk, f.l+' - reflexe '+fl.l+' ('+s.t+')',
              '1 = present ; 0 = absent ; vide = reflexe non teste',
              r=>r.d[f.k]==null?'':(r.d[kk]?1:0)); });
      }
    });
  });

  // ---- origine de la DTR et remontee attendue ----
  add('pl_dtr_src','Origine de la DTR',
      '1 = calculee d apres les heures DF et HS ; 2 = saisie ; 3 = estimee d apres Pmax et les paliers (DTP seule connue) ; '+
      '4 = deduite de DTP - DT ; vide = DTR inconnue', r=>r.d.pl_dtr_src!=null ? r.d.pl_dtr_src : '');
  const ATT = r => dtrAttendue(r.d);
  add('pl_dtr_att_min','DTR attendue - minimum','entier, minutes : remontee a '+V_REM_MAX+' m/min, '+S_PAR_M+' s par metre entre paliers, arrondie a la minute superieure ; vide = Pmax inconnue',
      r=>{ const a = ATT(r); return a ? a.min : ''; });
  add('pl_dtr_att_max','DTR attendue - maximum','entier, minutes : remontee a '+V_REM_MIN+' m/min, '+S_PAR_M+' s par metre entre paliers, arrondie a la minute superieure ; vide = Pmax inconnue',
      r=>{ const a = ATT(r); return a ? a.max : ''; });
  add('pl_vit_remontee','Vitesse de remontee deduite de la DTR','m/min, une decimale ; vide = DTR estimee, inconnue ou incoherente avec les paliers',
      r=>{ if(r.d.pl_dtr_src===3) return ''; const v = vitesseDeduite(r.d, r.d.pl_dtr!=null ? r.d.pl_dtr : null); return v==null ? '' : Math.round(v*10)/10; });

  // ---- paliers de decompression ----
  // Le detail reste dans la fiche et sur le PDF. Le CSV porte une ligne par fiche :
  // des agregats, le detail des six premiers paliers et un texte qui les reprend tous.
  const palArr = r => Array.isArray(r.d.pl_pal) ? r.d.pl_pal : [];
  const palNums = (r,k) => palArr(r).map(x=>x[k]).filter(v=>v!=null && !isNaN(v)).map(Number);
  const GAZCODE = GAZ.map(o=>o.v+' = '+noAcc(o.l)).join(' ; ');
  add('pl_pal_nb','Paliers - nombre de paliers saisis','entier ; vide = aucun palier saisi',
      r=>palArr(r).length||'');
  add('pl_pal_secu','Paliers - paliers de securite realises',
      '1 = au moins un palier de securite ; 0 = paliers saisis, aucun de securite ; vide = aucun palier saisi',
      r=>palArr(r).length?(palArr(r).some(x=>x.s)?1:0):'');
  add('pl_pal_secu_nb','Paliers - nombre de paliers de securite (non obligatoires)','entier ; vide = aucun palier saisi',
      r=>palArr(r).length?palArr(r).filter(x=>x.s).length:'');
  add('pl_pal_obl_nb','Paliers - nombre de paliers obligatoires','entier ; vide = aucun palier saisi',
      r=>palArr(r).length?palArr(r).filter(x=>!x.s).length:'');
  add('pl_pal_duree','Paliers - duree cumulee','entier, minutes (calcule) ; vide = aucune duree saisie',
      r=>{const v=palNums(r,'m'); return v.length?v.reduce((a,b)=>a+b,0):'';});
  add('pl_pal_prof_max','Paliers - profondeur du palier le plus profond','metres ; vide = aucune profondeur saisie',
      r=>{const v=palNums(r,'p'); return v.length?Math.max.apply(null,v):'';});
  add('pl_pal_txt','Paliers - liste detaillee',
      'texte : duree a profondeur (gaz, obligatoire ou securite), separes par |',
      r=>palArr(r).map(x=>noAcc(palTxt(x))).join('|'));
  for(let i=1;i<=6;i++){
    add('pl_pal'+i+'_gaz','Palier '+i+' - gaz',GAZCODE+' ; vide = palier non saisi',
        r=>palArr(r)[i-1] ? (palArr(r)[i-1].g||1) : '');
    add('pl_pal'+i+'_prof','Palier '+i+' - profondeur','metres ; vide = non renseigne',
        r=>palArr(r)[i-1] && palArr(r)[i-1].p!=null ? palArr(r)[i-1].p : '');
    add('pl_pal'+i+'_duree','Palier '+i+' - duree a la profondeur','minutes ; vide = non renseigne',
        r=>palArr(r)[i-1] && palArr(r)[i-1].m!=null ? palArr(r)[i-1].m : '');
    add('pl_pal'+i+'_secu','Palier '+i+' - palier de securite','1 = de securite (non obligatoire) ; 0 = obligatoire ; vide = palier non saisi',
        r=>palArr(r)[i-1] ? (palArr(r)[i-1].s?1:0) : '');
  }

  // ---- pieces jointes photographiques ----
  // les images elles-memes ne sortent jamais dans le CSV : seulement leur nombre et leurs titres
  add('pj_nb','Nombre de photographies jointes','entier ; vide = aucune',
